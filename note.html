<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>eonToefl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* 표면 (톤으로 층을 만든다 — 선으로 나누지 않는다) */
    --surface: #f8f9fa;
    --surface-lowest: #ffffff;
    --surface-low: #f3f4f5;
    --surface-container: #edeef0;
    --surface-high: #e7e9eb;
    --surface-highest: #e1e4e6;
    /* 글자 */
    --on-surface: #191c1d;
    --on-surface-variant: #3e484f;
    /* 강조 */
    --primary: #006688;
    --primary-container: #50c9ff;
    --primary-fixed-dim: #76d1ff;
    --on-primary-container: #001e2b;
    --secondary-container: #cfe9d6;
    --on-secondary-container: #14351f;
    --tertiary: #a53b22;
    --error: #ba1a1a;
    --outline-ghost: rgba(62, 72, 79, .15);
    --grad: linear-gradient(135deg, #006688 0%, #50c9ff 100%);
    --lift: 0 4px 28px rgba(25, 28, 29, .05);
    --float: 0 8px 40px rgba(25, 28, 29, .06);
    --r: .5rem;
    --r-lg: 1rem;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Inter", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--surface); color: var(--on-surface);
    line-height: 1.72; font-size: 15px; font-weight: 400;
    padding: 0 0 96px;
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 1.4rem; }
  h1, h2, h3, .display { letter-spacing: -0.02em; }
  ::selection { background: var(--primary-fixed-dim); color: var(--on-primary-container); }

  /* ───── 잠금 화면 ───── */
  #gate { max-width: 360px; margin: 16vh auto; padding: 0 1.4rem; text-align: center; }
  #gate .mark { width: 52px; height: 52px; margin: 0 auto 1.4rem; border-radius: var(--r-lg);
    background: var(--grad); display: grid; place-items: center; font-size: 23px; }
  #gate h1 { font-size: 20px; font-weight: 700; margin-bottom: .35rem; }
  #gate p { font-size: 13.5px; color: var(--on-surface-variant); margin-bottom: 1.4rem; }
  #gate input { width: 100%; background: var(--surface-highest); border: none; border-radius: var(--r);
    padding: 14px 16px; font-family: inherit; font-size: 16px; color: var(--on-surface);
    outline: none; text-align: center; transition: outline-color .15s; }
  #gate input:focus { outline: 2px solid var(--primary-fixed-dim); outline-offset: 0; }
  #gate button { width: 100%; margin-top: .7rem; background: var(--grad); color: #fff; border: none;
    border-radius: var(--r); padding: 14px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  #gate .msg { font-size: 13px; color: var(--error); margin-top: .7rem; min-height: 20px; font-weight: 500; }

  /* ───── 상단 날짜 바 (유리) ───── */
  .topbar { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, .8);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); margin-bottom: 1.75rem; }
  .topbar .inner { max-width: 1400px; margin: 0 auto; padding: 1rem 1.4rem;
    display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
  .brand { font-size: 10.5px; font-weight: 600; letter-spacing: .18em; color: var(--on-surface-variant); display: block; }
  .dtitle { font-size: 27px; font-weight: 700; line-height: 1.25; margin-right: .35rem; }
  .glint { display: none; width: 6px; height: 6px; border-radius: 99px; background: var(--primary);
    vertical-align: 7px; margin-left: .5rem; }
  .dtitle.today .glint { display: inline-block; }
  .iconbtn { width: 40px; height: 40px; border: none; border-radius: var(--r); background: var(--surface-high);
    color: var(--on-primary-container); font-size: 19px; font-weight: 600; cursor: pointer; line-height: 1;
    font-family: inherit; transition: background .15s; flex-shrink: 0; }
  .iconbtn:hover { background: var(--surface-highest); }
  .ghostbtn { border: none; border-radius: var(--r); background: transparent; color: var(--primary);
    padding: 9px 14px; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .ghostbtn:hover { background: var(--surface-high); }
  .fillbtn { border: none; border-radius: var(--r); background: var(--surface-high); color: var(--on-primary-container);
    padding: 10px 15px; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .fillbtn:hover { background: var(--surface-highest); }
  #savedot { margin-left: auto; font-size: 12.5px; font-weight: 500; color: var(--on-surface-variant); }
  #savedot.bad { color: var(--tertiary); }

  /* ───── 달력 (Contextual Blade) ───── */
  #scrim { position: fixed; inset: 0; background: rgba(25, 28, 29, .18); opacity: 0; pointer-events: none;
    transition: opacity .22s; z-index: 50; }
  #scrim.on { opacity: 1; pointer-events: auto; }
  #blade { position: fixed; top: 0; right: 0; height: 100%; width: 350px; max-width: 88vw; z-index: 51;
    background: rgba(255, 255, 255, .8); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--float); transform: translateX(101%); transition: transform .26s cubic-bezier(.32,.72,0,1);
    padding: 1.4rem; overflow-y: auto; }
  #blade.on { transform: translateX(0); }
  .blade-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.4rem; }
  .blade-top b { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .mrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: .7rem; }
  .mrow b { font-size: 15px; font-weight: 600; }
  .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .dow { text-align: center; font-size: 10.5px; font-weight: 600; color: var(--on-surface-variant); padding: 6px 0; }
  .dow.sun { color: var(--tertiary); }
  .day { position: relative; text-align: center; padding: 9px 0 12px; font-size: 13.5px; font-weight: 500;
    border-radius: var(--r); cursor: pointer; color: var(--on-surface-variant); }
  .day:hover { background: var(--surface-high); }
  .day.empty { cursor: default; }
  .day.sun { color: var(--tertiary); }
  .day.has { color: var(--on-surface); font-weight: 600; }
  .day.has::after { content: ""; position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 99px; background: var(--primary); }
  .day.today { background: var(--surface-highest); }
  .day.sel { background: var(--grad); color: #fff; font-weight: 700; }
  .day.sel::after { background: #fff; }
  .blade-foot { font-size: 12px; color: var(--on-surface-variant); margin-top: 1rem; }

  /* ───── 1순위 히어로 ───── */
  .hero { background: var(--grad); color: #fff; border-radius: var(--r-lg); padding: 1.5rem 1.75rem;
    margin-bottom: 1.75rem; }
  .hero .lab { font-size: 10.5px; font-weight: 600; letter-spacing: .16em; opacity: .78; }
  .hero .h { font-size: 25px; font-weight: 700; letter-spacing: -0.02em; margin: .15rem 0 .3rem; }
  .hero .s { font-size: 13.5px; opacity: .9; font-weight: 400; line-height: 1.65; }
  .hero .s b { font-weight: 700; }

  /* ───── 레이아웃 ───── */
  .cols { display: grid; grid-template-columns: 430px 1fr; gap: 1.75rem; align-items: start; }
  section { margin-bottom: 1.75rem; }
  .seclab { font-size: 10.5px; font-weight: 600; letter-spacing: .16em; color: var(--on-surface-variant);
    margin-bottom: .7rem; padding-left: .15rem; }
  .seclab span { font-weight: 400; letter-spacing: .02em; text-transform: none; }
  .panel { background: var(--surface-lowest); border-radius: var(--r-lg); padding: 1.4rem; box-shadow: var(--lift); }
  .sunk { background: var(--surface-low); border-radius: var(--r); padding: 1rem 1.15rem; }

  /* ───── 진행 ───── */
  .prog { display: flex; align-items: center; gap: 1rem; margin-bottom: .35rem; }
  .prog .track { flex: 1; height: 6px; background: var(--surface-high); border-radius: 99px; overflow: hidden; }
  .prog .bar { height: 100%; width: 0%; background: var(--grad); border-radius: 99px; transition: width .3s; }
  .prog .n { font-size: 12.5px; font-weight: 600; color: var(--on-surface-variant); white-space: nowrap; }

  /* ───── 할 일 (선 없음 · 여백으로 구분) ───── */
  .todo { list-style: none; }
  .todo li { display: flex; align-items: flex-start; gap: .8rem; padding: 1rem .15rem; border-radius: var(--r); }
  .todo li:hover { background: var(--surface-low); }
  .todo input[type=checkbox] { width: 21px; height: 21px; margin-top: 3px; accent-color: var(--primary);
    cursor: pointer; flex-shrink: 0; }
  .todo .t { font-size: 11px; font-weight: 600; color: var(--primary); min-width: 52px; margin-top: 5px; flex-shrink: 0; }
  .todo .b { flex: 1; min-width: 0; }
  .todo .task { font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.5; }
  .todo .dur { display: inline-block; font-size: 10.5px; font-weight: 600; color: var(--on-surface-variant);
    background: var(--surface-high); padding: 2px 8px; border-radius: 99px; margin-left: .4rem; vertical-align: 2px; }
  .todo .crit { font-size: 13px; color: var(--on-surface-variant); margin-top: .4rem; line-height: 1.8; }
  .todo .crit b, .todo .crit strong { color: var(--on-surface); font-weight: 600; }
  .todo .crit em { font-style: normal; color: var(--primary); font-weight: 600; }
  /* 단계 목록 — 선 없이 톤으로 묶는다 */
  .todo .steps { margin-top: .65rem; background: var(--surface-low); border-radius: var(--r); padding: .75rem .95rem; }
  .todo .steps > div { font-size: 13px; color: var(--on-surface-variant); line-height: 1.75; padding: .28rem 0 .28rem 1.35rem;
    position: relative; }
  .todo .steps > div .n { position: absolute; left: 0; top: .28rem; font-weight: 700; color: var(--primary); font-size: 12px; }
  .todo .steps > div b { color: var(--on-surface); font-weight: 600; }
  .todo .steps > div em { font-style: normal; color: var(--primary); font-weight: 600; }
  /* 왜 지금 / 이러면 끝 */
  .todo .why, .todo .done-crit { margin-top: .55rem; font-size: 12.5px; line-height: 1.7;
    border-radius: var(--r); padding: .6rem .9rem; }
  .todo .why { background: #e3f3fb; color: var(--on-primary-container); }
  .todo .done-crit { background: var(--secondary-container); color: var(--on-secondary-container); }
  .todo .why .lab, .todo .done-crit .lab { display: block; font-size: 9.5px; font-weight: 700;
    letter-spacing: .14em; opacity: .6; margin-bottom: .15rem; }
  .todo .why b, .todo .done-crit b { font-weight: 700; }
  .todo .note { width: 100%; margin-top: .5rem; background: var(--surface-low); border: none; border-radius: var(--r);
    font-size: 13px; padding: 7px 10px; color: var(--on-surface); font-family: inherit; outline: none; }
  .todo .note:focus { outline: 2px solid var(--primary-fixed-dim); background: var(--surface-highest); }
  .todo li.done .task { text-decoration: line-through; color: var(--on-surface-variant); opacity: .6; }
  .todo li.done .crit, .todo li.done .t { opacity: .5; }
  .todo .del { background: none; border: none; color: var(--on-surface-variant); font-size: 14px; cursor: pointer;
    padding: 3px 5px; line-height: 1; border-radius: var(--r); opacity: .5; }
  .todo .del:hover { color: var(--tertiary); opacity: 1; background: var(--surface-high); }
  .chip { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
    vertical-align: 2px; margin-left: .4rem; letter-spacing: .01em; }
  .chip.hot { background: #f7e2dd; color: var(--tertiary); }
  .chip.star { background: #d7f0fb; color: var(--on-primary-container); }
  .chip.opt { background: var(--surface-high); color: var(--on-surface-variant); }
  .chip.mine { background: var(--secondary-container); color: var(--on-secondary-container); }

  .addrow { display: flex; gap: .5rem; margin-top: 1rem; }
  .addrow input { flex: 1; min-width: 0; background: var(--surface-highest); border: none; border-radius: var(--r);
    padding: 11px 14px; font-family: inherit; font-size: 14px; color: var(--on-surface); outline: none; }
  .addrow input:focus { outline: 2px solid var(--primary-fixed-dim); }
  .addrow button { background: var(--grad); color: #fff; border: none; border-radius: var(--r); padding: 11px 18px;
    font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; flex-shrink: 0; }

  .note-block { font-size: 13px; color: var(--on-surface-variant); margin-top: 1rem; line-height: 1.7; }
  .asks { background: var(--secondary-container); color: var(--on-secondary-container); border-radius: var(--r);
    padding: 1rem 1.15rem 1.15rem; font-size: 13.5px; margin-top: 1rem; line-height: 1.7; }
  .asks > .head { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; margin-bottom: .6rem; opacity: .65; }
  .ask { padding: .55rem 0; }
  .ask .q { font-size: 13.5px; line-height: 1.7; }
  .ask .q .num { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 99px;
    background: rgba(20,53,31,.14); font-size: 11px; font-weight: 700; margin-right: .4rem; vertical-align: 1px; }
  .ask .q b { font-weight: 700; }
  .ask textarea { width: 100%; min-height: 46px; margin-top: .45rem; background: rgba(255,255,255,.75);
    border: none; border-radius: var(--r); padding: .55rem .75rem; font-family: inherit; font-size: 13.5px;
    line-height: 1.65; color: var(--on-surface); resize: vertical; outline: none; }
  .ask textarea:focus { outline: 2px solid var(--primary-fixed-dim); background: #fff; }
  .ask textarea[readonly] { background: rgba(255,255,255,.45); color: var(--on-secondary-container); }
  /* 저장 · 수정 버튼 (부서 메모와 공용) */
  .btnrow { margin-top: .45rem; display: flex; gap: .4rem; }
  .btnrow button { border: none; border-radius: var(--r); padding: 6px 15px; font-family: inherit;
    font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btnrow .save { background: var(--grad); color: #fff; }
  .btnrow .save:disabled { background: rgba(20,53,31,.16); color: var(--on-secondary-container); cursor: default; }
  .btnrow .edit { background: transparent; color: var(--primary); }
  .btnrow .edit:hover:not(:disabled) { background: var(--surface-high); }
  .btnrow .edit:disabled { opacity: .35; cursor: default; }
  .dmemo .btnrow .save:disabled { background: var(--surface-high); color: var(--on-surface-variant); }

  /* ───── 지출 ───── */
  .exp-note { font-size: 12.5px; color: var(--on-surface-variant); background: var(--surface-low);
    border-radius: var(--r); padding: .8rem 1rem; margin-bottom: 1rem; line-height: 1.65; }
  .exp-note b { color: var(--on-surface); font-weight: 600; }
  .exp-row { padding: .7rem 0; }
  .exp-row .r1, .exp-row .r2 { display: flex; gap: .5rem; }
  .exp-row .r2 { margin-top: .5rem; }
  .exp-row input, .exp-row select { background: var(--surface-highest); border: none; border-radius: var(--r);
    padding: 10px 12px; font-family: inherit; font-size: 13.5px; color: var(--on-surface); outline: none; min-width: 0; }
  .exp-row input:focus, .exp-row select:focus { outline: 2px solid var(--primary-fixed-dim); }
  .e-item { flex: 1.4; } .e-amt { width: 108px; flex-shrink: 0; }
  .e-card { width: 152px; flex-shrink: 0; } .e-why { flex: 1; }
  #addexp { margin-top: .5rem; width: 100%; background: transparent; color: var(--primary); border: none;
    border-radius: var(--r); padding: 10px; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  #addexp:hover { background: var(--surface-low); }
  .etotal { text-align: right; font-size: 12.5px; font-weight: 500; color: var(--on-surface-variant); margin-top: .7rem; }
  .etotal b { color: var(--on-surface); font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin-left: .35rem; }
  .cardsum { margin-top: 1rem; }
  .cs-row { display: flex; justify-content: space-between; gap: .5rem; font-size: 12.5px; padding: .35rem 0;
    color: var(--on-surface-variant); }
  .cs-row b { color: var(--on-surface); font-weight: 600; }
  .cs-row .nm { font-weight: 600; color: var(--on-surface); }
  .upcoming { margin-top: 1rem; background: var(--surface-low); border-radius: var(--r); padding: 1rem 1.15rem;
    font-size: 12.5px; color: var(--on-surface-variant); line-height: 1.75; }
  .upcoming .uh { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; color: var(--on-surface); margin-bottom: .35rem; }

  #memo { width: 100%; min-height: 120px; background: var(--surface-highest); border: none; border-radius: var(--r);
    padding: 1rem 1.15rem; font-family: inherit; font-size: 14.5px; line-height: 1.7; color: var(--on-surface);
    resize: vertical; outline: none; }
  #memo:focus { outline: 2px solid var(--primary-fixed-dim); }
  #sendday { margin-top: .7rem; width: 100%; background: var(--grad); color: #fff; border: none; border-radius: var(--r);
    padding: 13px; font-family: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  #sendday.sent { background: var(--secondary-container); color: var(--on-secondary-container); }
  #sweepbtn { margin-top: .5rem; width: 100%; background: var(--surface-high); color: var(--on-primary-container);
    border: none; border-radius: var(--r); padding: 12px; font-family: inherit; font-size: 13.5px;
    font-weight: 600; cursor: pointer; }
  #sweepbtn:hover { background: var(--surface-highest); }

  /* ───── 부서 보고 ───── */
  .dept-cols { column-count: 2; column-gap: 1.4rem; }
  .dept { background: var(--surface-lowest); border-radius: var(--r-lg); padding: 1.4rem; margin-bottom: 1.4rem;
    box-shadow: var(--lift); break-inside: avoid; display: inline-block; width: 100%; }
  .dept-top { display: flex; align-items: center; gap: .7rem; margin-bottom: 1rem; }
  .dept-top .who { position: relative; flex-shrink: 0; line-height: 0; }
  .dept-top .avatar { width: 46px; height: 46px; border-radius: 99px; object-fit: cover;
    background: var(--surface-high); display: block; }
  .dept-top .dot { position: absolute; right: 0; bottom: 1px; width: 12px; height: 12px; border-radius: 99px;
    box-shadow: 0 0 0 2.5px var(--surface-lowest); }
  .dept-top h3 { font-size: 16.5px; font-weight: 700; line-height: 1.25; }
  .dept-top .person { font-size: 12px; color: var(--on-surface-variant); font-weight: 500; margin-top: 1px; }
  .dept-top .edited { color: var(--primary); font-weight: 600; margin-left: .3rem; font-size: 11px; }
  .dept-top .role { font-size: 11.5px; color: var(--on-surface-variant); margin-left: auto; text-align: right;
    font-weight: 400; line-height: 1.45; max-width: 40%; }
  .kpi { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .kpi > div { background: var(--surface-low); border-radius: var(--r); padding: .7rem .95rem; flex: 1; min-width: 96px; }
  .kpi .k { font-size: 10.5px; font-weight: 600; color: var(--on-surface-variant); letter-spacing: .04em; }
  .kpi .v { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-top: .1rem; }
  .gauge { background: var(--surface-low); border-radius: var(--r); padding: .8rem .95rem; margin-bottom: 1rem; }
  .gauge .lab { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 600;
    color: var(--on-surface-variant); margin-bottom: .45rem; }
  .gauge .track { height: 8px; background: var(--surface-high); border-radius: 99px; overflow: hidden; }
  .gauge .bar { height: 100%; background: var(--grad); border-radius: 99px; }
  .dept p { font-size: 14.5px; color: var(--on-surface-variant); margin-bottom: .75rem; line-height: 1.72;
    display: flex; gap: .55rem; align-items: flex-start; }
  .dept p .no { flex-shrink: 0; width: 19px; height: 19px; border-radius: 99px; background: var(--surface-high);
    color: var(--on-surface-variant); font-size: 11px; font-weight: 700; display: grid; place-items: center;
    margin-top: 3px; }
  .dept p .sug { display: block; margin-top: .4rem; color: var(--primary); font-weight: 600; font-size: 13.5px;
    line-height: 1.65; }
  .dept p .sug::before { content: "→ "; opacity: .7; }
  .dept p.note { display: block; margin-top: 1rem; padding-top: .9rem; background: var(--surface-low);
    border-radius: var(--r); padding: .9rem 1rem; font-size: 13.5px; }
  .dept p:last-of-type { margin-bottom: 0; }
  .dept p strong { color: var(--on-surface); font-weight: 600;
    background: linear-gradient(transparent 62%, #d7f0fb 62%); }
  .dept p b { color: var(--on-surface); font-weight: 600; }
  .nag { background: var(--surface-low); border-radius: var(--r); padding: 1rem 1.15rem; font-size: 13.5px;
    margin-top: 1rem; line-height: 1.7; color: var(--on-surface-variant); }
  .nag::before { content: "💬 "; }
  /* 팀 카드의 이야기하기 버튼 */
  .chatbtn { margin-top: 1rem; width: 100%; background: var(--surface-high); color: var(--on-primary-container);

<script>
const SB = "https://qpqjevecjejvbeuogtbx.supabase.co/rest/v1/hq_briefings";
const AK = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwcWpldmVjamVqdmJldW9ndGJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0MDAxNDEsImV4cCI6MjA4Njk3NjE0MX0.pJvY4u9oHQYa7IvAjWluHMow_4WIkONDBBasnXxF5Gc";
const HDR = { "apikey": AK, "Authorization": "Bearer " + AK, "Content-Type": "application/json" };
const PWKEY = "hq-pw";
const DOW = ["일","월","화","수","목","금","토"];
const CARDS = ["", "토스파랑이 (부부 생활비)", "카뱅파랑이 (내 체크)", "아멕스 (부부 신용)", "신한카드 (내 신용)", "기타"];

/* ───── 암호 ───── */
const enc = new TextEncoder(), dec = new TextDecoder();
async function keyFrom(pw, salt) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function b64e(b) { let s = ""; new Uint8Array(b).forEach(c => s += String.fromCharCode(c)); return btoa(s); }
async function lock(pw, obj) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await keyFrom(pw, salt);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, enc.encode(JSON.stringify(obj)));
  const out = new Uint8Array(28 + ct.byteLength);
  out.set(salt, 0); out.set(iv, 16); out.set(new Uint8Array(ct), 28);
  return b64e(out);
}
async function unlockText(pw, blob) {
  const raw = b64d(blob);
  const k = await keyFrom(pw, raw.slice(0, 16));
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(16, 28) }, k, raw.slice(28))));
}

/* ───── 상태 ───── */
let PW = null, DATE = null, DAY = null, STATE = null, DATES = [], calYM = null, saveTimer = null;
const todayStr = () => { const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const shift = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const won = n => (n || 0).toLocaleString("ko-KR") + "원";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
/* 팀장이 쓰는 **굵게**를 실제 굵은 글씨로. 이스케이프 뒤에 하므로 안전하다 */
const fmt = t => esc(t)
  .replace(/^\/fix\b[ \t]*(.*)$/gm, '<span class="cmd">/fix</span> <b class="fixbody">$1</b>')
  .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
const plain = t => String(t == null ? "" : t).replace(/\*\*/g, "");
function setDot(ok, msg) { const d = document.getElementById("savedot"); d.textContent = msg; d.className = ok ? "" : "bad"; }

/* ───── 서버 ───── */
async function fetchDay(d) {
  const r = await fetch(SB + "?d=eq." + d + "&select=d,payload,state", { headers: HDR, cache: "no-store" });
  const j = await r.json();
  return Array.isArray(j) && j.length ? j[0] : null;
}
async function fetchDates() {
  try {
    const r = await fetch(SB + "?select=d&order=d.desc&limit=400", { headers: HDR, cache: "no-store" });
    const j = await r.json();
    DATES = Array.isArray(j) ? j.map(x => x.d) : [];
  } catch (e) { DATES = []; }
}
async function pushState() {
  if (!DATE || !STATE) return;
  try {
    STATE.updated = new Date().toLocaleString("ko-KR");
    const blob = await lock(PW, STATE);
    const r = await fetch(SB + "?on_conflict=d", { method: "POST",
      headers: Object.assign({}, HDR, { "Prefer": "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify({ d: DATE, state: blob }) });
    if (!r.ok) throw new Error(r.status);
    setDot(true, "저장됨 " + STATE.updated);
  } catch (e) { setDot(false, "저장 안 됨 — 인터넷 확인"); }
}
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(pushState, 500); }

/* ───── 잠금 해제 ───── */
async function tryUnlock(pw) {
  let row = await fetchDay(todayStr());
  if (!row) { await fetchDates(); if (DATES.length) row = await fetchDay(DATES[0]); }
  if (!row || !row.payload) return { ok: true };
  try { await unlockText(pw, row.payload); return { ok: true }; } catch (e) { return { ok: false }; }
}
document.getElementById("unlock").addEventListener("click", doUnlock);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") doUnlock(); });
async function doUnlock() {
  const pw = document.getElementById("pw").value, msg = document.getElementById("gatemsg");
  if (!pw) return;
  msg.style.color = "var(--on-surface-variant)"; msg.textContent = "여는 중…";
  const r = await tryUnlock(pw);
  if (!r.ok) { msg.style.color = "var(--error)"; msg.textContent = "비밀번호가 다릅니다"; return; }
  PW = pw; localStorage.setItem(PWKEY, pw);
  document.getElementById("gate").style.display = "none";

}

/* ───── 팀장 채팅 ───── */
const CHAT = "https://qpqjevecjejvbeuogtbx.supabase.co/rest/v1/hq_chat";
const PERSON = { dev: "김도윤", ct: "이서현", cs: "박준호", mkt: "최유진", fin: "정민석", hr: "한지우" };
const SEENKEY = "hq-chat-seen";
const TEAMNAME = { dev: "개발팀", ct: "콘텐츠팀", cs: "CS팀", mkt: "마케팅영업팀", fin: "회계팀", hr: "인사총무팀" };
let chatBtns = {}, chatTimer = null, chatCache = {}, chatDrafts = {};

/* 오른쪽 채팅 목록 */
const ORDER = ["dev", "ct", "cs", "mkt", "fin", "hr"];
function hhmm(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (!sameDay) return (d.getMonth() + 1) + "/" + d.getDate();
  let h = d.getHours(); const ap = h < 12 ? "오전" : "오후";
  h = h % 12 || 12;
  return ap + " " + h + ":" + String(d.getMinutes()).padStart(2, "0");
}
function drawAlerts() {                     // 목록 다시 그리기
  const box = document.getElementById("rlist");
  if (!box) return;
  const s = seen();
  let total = 0;
  box.innerHTML = ORDER.map(key => {
    const list = chatCache[key] || [];
    const last = list.length ? list[list.length - 1] : null;
    const unread = docks[key] ? 0 : list.filter(m => m.role === "lead" && m.id > (s[key] || 0)).length;
    total += unread ? 1 : 0;
    const waiting = list.some(m => m.role === "boss" && m.status !== "done");
    const pv = waiting ? '<span class="waiting">답장 쓰는 중…</span>'
      : last ? (last.role === "boss" ? "나: " : "") + esc(plain(last.text))
      : "아직 나눈 이야기가 없습니다";
    return '<div class="ritem' + (unread ? " unread" : "") + (docks[key] ? " open" : "") + '" data-team="' + key + '">' +
      '<img src="assets/team/' + key + '.jpg" alt="">' +
      '<div class="txt"><div class="top"><span class="nm">' + esc(PERSON[key]) + '</span>' +
        '<span class="tm">' + esc(TEAMNAME[key]) + '</span>' +
        '<span class="when">' + esc(last ? hhmm(last.at) : "") + '</span></div>' +
        '<div class="pv">' + pv + '</div></div>' +
      (unread ? '<span class="badge2">' + unread + '</span>' : "") +
      '</div>';
  }).join("");
  box.querySelectorAll(".ritem").forEach(el => {
    const key = el.dataset.team;
    el.addEventListener("click", () => openDock(key, TEAMNAME[key], PERSON[key]));
  });
  const cnt = document.getElementById("rcnt");
  cnt.textContent = total; cnt.classList.toggle("on", total > 0);
  document.getElementById("rostertab").classList.toggle("has-new", total > 0);
}

const seen = () => { try { return JSON.parse(localStorage.getItem(SEENKEY) || "{}"); } catch (e) { return {}; } };
function markSeen(team, id) { const s = seen(); s[team] = id; localStorage.setItem(SEENKEY, JSON.stringify(s)); }

/* 채팅창은 팀마다 하나씩, 여러 개를 동시에 띄울 수 있다 */
let docks = {}, zTop = 60;

function openDock(key, team, person) {
  if (docks[key]) { front(key); docks[key].ta.focus(); return; }

  const el = document.getElementById("docktpl").content.firstElementChild.cloneNode(true);
  el.dataset.team = key;
  el.querySelector(".head img").src = "assets/team/" + key + ".jpg";
  el.querySelector(".head .nm").textContent = (person || "팀장") + " 팀장";
  el.querySelector(".head .tm").textContent = team;
  const ta = el.querySelector(".foot textarea"), btn = el.querySelector(".foot button");
  ta.placeholder = team + "에 할 말";
  ta.value = chatDrafts[key] || "";
  document.body.appendChild(el);

  docks[key] = { el: el, log: el.querySelector(".log"), ta: ta, sig: "" };
  placeNew(key, el);
  wireDock(key, el, ta, btn);
  el.classList.add("on");
  front(key);
  drawDock(key);
  ta.focus();
  drawAlerts();
  chatLoad();
}

function closeDock(key) {
  if (key === undefined) { Object.keys(docks).forEach(closeDock); return; }
  const d = docks[key]; if (!d) return;
  chatDrafts[key] = d.ta.value;
  d.el.remove();
  delete docks[key];
  drawAlerts();
}

function front(key) {
  const d = docks[key]; if (!d) return;
  d.el.style.zIndex = ++zTop;
}

function drawDock(key) {
  const d = docks[key]; if (!d) return;
  const list = chatCache[key] || [];
  const log = d.log;

  // 내용이 그대로면 다시 그리지 않는다 (다시 그리면 읽던 자리가 맨 아래로 튄다)
  const sig = list.map(m => m.id + ":" + m.status).join(",");
  if (sig !== d.sig) {
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    log.innerHTML = (list.length
      ? list.map((m, i) => {
          if (m.role === "boss")
            return '<div class="row me"><div class="bubble me">' + fmt(m.text) + '</div></div>';
          const same = i > 0 && list[i - 1].role === "lead";
          return '<div class="row"><img class="ava' + (same ? " hide" : "") + '" src="assets/team/' +
            key + '.jpg" alt=""><div class="bubble lead">' +
            (same ? "" : '<span class="who">' + esc(PERSON[key] || "팀장") + '</span>') +
            fmt(m.text) + '</div></div>';
        }).join("")
      : '<div class="empty">아직 나눈 이야기가 없습니다. 편하게 말 걸어보세요.</div>')
      + (list.some(m => m.role === "boss" && m.status !== "done")
          ? '<div class="wait">' + esc(PERSON[key] || "팀장") + ' 팀장이 문서 보는 중…</div>' : "");
    if (atBottom || !d.sig) log.scrollTop = log.scrollHeight;
    d.sig = sig;
  }
  markSeen(key, list.length ? list[list.length - 1].id : 0);
  const b = chatBtns[key]; if (b) b.classList.remove("has-new");
  drawAlerts();
}

function drawAllDocks() { Object.keys(docks).forEach(drawDock); }

async function chatLoad() {
  clearTimeout(chatTimer);
  if (!PW) return;
  let waiting = false;
  try {
    const r = await fetch(CHAT + "?select=id,team,role,body,status,created_at&order=id.asc&limit=400", { headers: HDR, cache: "no-store" });
    const rows = await r.json();
    if (!Array.isArray(rows)) throw new Error("bad");
    const byTeam = {};
    for (const row of rows) {
      if (row.role === "relay" || row.role === "card") continue;   // 화면에 안 보이는 줄
      let text;
      try { text = await unlockText(PW, row.body); } catch (e) { text = "(읽을 수 없는 메시지)"; }
      (byTeam[row.team] = byTeam[row.team] || []).push({ id: row.id, role: row.role, status: row.status, text: text, at: row.created_at });
      if (row.role === "boss" && row.status !== "done") waiting = true;
    }
    chatCache = byTeam;
    await refreshCards();     // 브리핑이 바뀌었으면 그 카드만 다시 그린다
    const s = seen();
    let unreadTeams = 0;
    Object.entries(chatBtns).forEach(([key, btn]) => {
      const list = byTeam[key] || [];
      const last = list.length ? list[list.length - 1] : null;
      const unread = last && last.role === "lead" && last.id > (s[key] || 0) && !docks[key];
      btn.classList.toggle("has-new", !!unread);
      const tag = btn.querySelector(".new");
      if (unread) {
        unreadTeams++;
        const n = list.filter(m => m.role === "lead" && m.id > (s[key] || 0)).length;
        tag.textContent = n > 1 ? "새 답장 " + n : "새 답장";
      }
    });
    document.title = (unreadTeams ? "(" + unreadTeams + ") " : "") + "eonToefl";
    drawAllDocks();
    drawAlerts();
  } catch (e) { /* 조용히 다음 차례에 재시도 */ }
  chatTimer = setTimeout(chatLoad, waiting ? 4000 : (Object.keys(docks).length ? 8000 : 30000));
}
async function chatSend(team, text) {
  const body = await lock(PW, text);
  await fetch(CHAT, { method: "POST", headers: Object.assign({}, HDR, { Prefer: "return=minimal" }),
    body: JSON.stringify({ team: team, role: "boss", body: body, status: "pending" }) });
  await chatLoad();
}

/* ───── 저장 · 수정 버튼 (답변칸·팀 메모 공용) ───── */
function saveEditBox(ta, get, set) {
  const row = document.createElement("div");
  row.className = "btnrow";
  row.innerHTML = '<button type="button" class="save">저장</button><button type="button" class="edit" disabled>수정</button>';
  const bs = row.querySelector(".save"), be = row.querySelector(".edit");
  function lockUI(locked) {
    ta.readOnly = locked;
    bs.disabled = locked; bs.textContent = locked ? "저장됨" : "저장";
    be.disabled = !locked;
  }
  bs.addEventListener("click", () => { set(ta.value, true); lockUI(true); save(); });
  be.addEventListener("click", () => { set(ta.value, false); lockUI(false); ta.focus(); save(); });
  ta.addEventListener("input", () => { set(ta.value, false); save(); });
  lockUI(!!(get() || {}).saved);
  return row;
}

        (mine ? '<span class="chip mine">직접 추가</span>' : (t.badge ? '<span class="chip ' + t.badge.k + '">' + esc(t.badge.t) + '</span>' : "")) +

/* 카드 한 장 그리기 — 팀장이 고치면 이 카드만 다시 그린다 */
const TONE = { fin: "#2f6f4f", mkt: "#a53b22", cs: "#006688", ct: "#7b4fa0", dev: "#3e484f", hr: "#b0355c" };
let deptEls = {};

/* 브리핑이 바뀌었는지 보고, 바뀐 팀 카드만 다시 그린다 */
async function refreshCards() {
  if (!PW || !DATE || !DAY) return;
  try {
    const r = await fetch(SB + "?d=eq." + DATE + "&select=payload", { headers: HDR, cache: "no-store" });
    const j = await r.json();
    if (!Array.isArray(j) || !j.length || !j[0].payload) return;
    const fresh = await unlockText(PW, j[0].payload);
    (fresh.depts || []).forEach(dp => {
      const slot = deptEls[dp.key]; if (!slot) return;
      if (JSON.stringify(slot.base) === JSON.stringify(dp)) return;   // 안 바뀌었으면 그대로 둔다
      slot.base = dp;
      mountDept(dp.key);
    });
    DAY.depts = fresh.depts || DAY.depts;
  } catch (e) { /* 다음 차례에 다시 본다 */ }
}

function mountDept(key) {
  const slot = deptEls[key]; if (!slot) return;
  const dp = slot.base;
  const el = slot.el;
  const parts = String(dp.name || "").split(" · ");
  const team = parts[0], person = parts[1] || "";
  const when = dp.at;
  el.innerHTML = '<div class="dept-top">' +
      '<div class="who"><img class="avatar" src="assets/team/' + key + '.jpg" alt="" ' +
        'onerror="this.style.display=\'none\'"><span class="dot" style="background:' + (TONE[key] || "#006688") + '"></span></div>' +
      '<div><h3>' + esc(team) + '</h3>' + (person ? '<div class="person">' + esc(person) + ' 팀장' +
        (when ? '<span class="edited">· ' + esc(when) + ' 고침</span>' : "") + '</div>' : "") + '</div>' +
      '<div class="role">' + esc(dp.role || "") + '</div></div>' +
    (dp.kpi ? '<div class="kpi">' + dp.kpi.map(k => '<div><div class="k">' + esc(k.k) + '</div><div class="v">' + esc(k.v) + '</div></div>').join("") + '</div>' : "") +
    (dp.gauge ? '<div class="gauge"><div class="lab"><span>' + esc(dp.gauge.label) + '</span><span>' + esc(dp.gauge.text) + '</span></div>' +
      '<div class="track"><div class="bar" style="width:' + dp.gauge.pct + '%"></div></div></div>' : "") +
    (function () {              // 보고는 번호를 붙여 한 줄씩, 아래에 '그래서 이렇게 하자'
      let n = 0;
      return (dp.paras || []).map(p => {
        if (typeof p !== "string") {                       // { f: 사실, s: 제안 }
          return '<p><span class="no">' + (++n) + '</span><span>' + (p.f || "") +
                 (p.s ? '<span class="sug">' + p.s + '</span>' : "") + '</span></p>';
        }
        const head = p.trim().startsWith("<b>");            // 소제목 문단은 번호 없이
        return head ? '<p class="note">' + p + '</p>'
                    : '<p><span class="no">' + (++n) + '</span><span>' + p + '</span></p>';
      }).join("");
    })() +
    (dp.nag ? '<div class="nag">' + esc(dp.nag) + '</div>' : "") +
    '<button class="chatbtn" type="button">💬 ' + esc(person || "팀장") + ' 팀장과 이야기하기<span class="new"></span></button>';
  const cb = el.querySelector(".chatbtn");
  chatBtns[key] = cb;
  cb.addEventListener("click", () => openDock(key, team, person));
}

/* ───── 달력 ───── */
function drawCal() {
  const [y, m] = calYM;
  document.getElementById("mlabel").textContent = y + "년 " + (m + 1) + "월";
  document.getElementById("dows").innerHTML = DOW.map((x, i) => '<div class="dow' + (i === 0 ? " sun" : "") + '">' + x + "</div>").join("");
  const first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate();
  const box = document.getElementById("days"); box.innerHTML = "";
  for (let i = 0; i < first; i++) { const e = document.createElement("div"); e.className = "day empty"; box.appendChild(e); }
  for (let dd = 1; dd <= last; dd++) {
    const s = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(dd).padStart(2, "0");
    const el = document.createElement("div");
    el.className = "day" + (new Date(y, m, dd).getDay() === 0 ? " sun" : "") + (DATES.includes(s) ? " has" : "") +
      (s === todayStr() ? " today" : "") + (s === DATE ? " sel" : "");
    el.textContent = dd;
    el.addEventListener("click", () => { go(s); closeBlade(); });
    box.appendChild(el);
  }
}
function openBlade() { const dd = new Date(DATE + "T12:00:00"); calYM = [dd.getFullYear(), dd.getMonth()]; drawCal();
  document.getElementById("blade").classList.add("on"); document.getElementById("scrim").classList.add("on"); }
function closeBlade() { document.getElementById("blade").classList.remove("on"); document.getElementById("scrim").classList.remove("on"); }
/* 채팅창 하나하나에 끌기·크기조절·보내기를 붙인다 */
function placeNew(key, el) {
  const POS = "hq-dock-" + key;
  let p = null;
  try { p = JSON.parse(localStorage.getItem(POS) || "null"); } catch (e) {}
  if (p && p.w && innerWidth > 620) { el.style.width = p.w + "px"; el.style.height = p.h + "px"; }
  if (p && typeof p.x === "number" && innerWidth > 620) {
    el.style.left = p.x + "px"; el.style.top = p.y + "px";
    el.style.right = el.style.bottom = "auto";
  } else if (innerWidth > 620) {
    // 저장된 자리가 없으면 이미 떠 있는 창들과 안 겹치게 계단식으로 놓는다
    const n = Object.keys(docks).length - 1;
    el.style.right = ((document.body.classList.contains("roster-on") ? 316 : 20) + n * 26) + "px";
    el.style.bottom = (20 + n * 26) + "px";
  }
}

function wireDock(key, el, ta, btn) {
  const POS = "hq-dock-" + key;
  const head = el.querySelector(".head");
  function savePos(o) {
    let p = {};
    try { p = JSON.parse(localStorage.getItem(POS) || "{}"); } catch (e) {}
    Object.assign(p, o);
    localStorage.setItem(POS, JSON.stringify(p));
  }
  function place(x, y) {
    const w = el.offsetWidth, h = el.offsetHeight;
    x = Math.min(Math.max(8, x), Math.max(8, innerWidth - w - 8));
    y = Math.min(Math.max(8, y), Math.max(8, innerHeight - h - 8));
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.right = el.style.bottom = "auto";
    savePos({ x: x, y: y });
  }

  el.querySelector(".head .x").addEventListener("click", () => closeDock(key));
  el.addEventListener("pointerdown", () => front(key), true);

  let drag = null;
  head.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    const r = el.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    el.classList.add("dragging");
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener("pointermove", e => {
    if (!drag) return;
    e.preventDefault();
    place(e.clientX - drag.dx, e.clientY - drag.dy);
  });
  function endDrag(e) {
    if (!drag) return;
    drag = null; el.classList.remove("dragging");
    try { head.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  head.addEventListener("pointerup", endDrag);
  head.addEventListener("pointercancel", endDrag);
  head.addEventListener("dblclick", e => {
    if (e.target.closest("button")) return;
    localStorage.removeItem(POS);
    el.style.left = el.style.top = el.style.right = el.style.bottom = "";
    el.style.width = el.style.height = "";
    placeNew(key, el);
  });

  if (window.ResizeObserver) {
    let t = null;
    new ResizeObserver(() => {
      clearTimeout(t);
      t = setTimeout(() => savePos({ w: el.offsetWidth, h: el.offsetHeight }), 400);
    }).observe(el);
  }

  async function send() {
    const v = ta.value.trim(); if (!v) return;
    btn.disabled = true; ta.value = ""; chatDrafts[key] = ""; ta.classList.remove("fixing");
    try { await chatSend(key, v); } finally { btn.disabled = false; ta.focus(); }
  }
  ta.addEventListener("input", () => {
    chatDrafts[key] = ta.value;
    ta.classList.toggle("fixing", /^\/fix\b/.test(ta.value));   // 쓰는 중에도 표시
  });
  btn.addEventListener("click", send);
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
}


/* 하루 정리하고 채팅 비우기 */
(function () {
  const scrim = document.getElementById("sweepscrim"), list = document.getElementById("sweeplist");
  const go = document.getElementById("sweepgo"), wipe = document.getElementById("sweepwipe");
  let timer = null;

  function open() { scrim.classList.add("on"); draw(); poll(); }
  function close() { scrim.classList.remove("on"); clearTimeout(timer); }
  window.openSweep = open;

  async function state() {
    const r = await fetch(CHAT + "?select=id,team,role,body,status&role=in.(sweep,sweepdone)&order=id.asc",
      { headers: HDR, cache: "no-store" });
    const rows = await r.json();
    if (!Array.isArray(rows)) return { running: false, done: {} };
    const done = {};
    let running = false;
    for (const x of rows) {
      if (x.role === "sweep") { if (x.status !== "done") running = true; continue; }
      try { done[x.team] = await unlockText(PW, x.body); } catch (e) { done[x.team] = "확인 완료"; }
    }
    return { running: running, done: done };
  }

  async function draw() {
    const st = await state();
    const n = Object.keys(st.done).length;
    list.innerHTML = ORDER.map(k => {
      const res = st.done[k];
      const cls = res ? " done" : (st.running ? " doing" : "");
      return '<div class="row2' + cls + '"><img src="assets/team/' + k + '.jpg" alt="">' +
        '<div><div class="who2">' + esc(PERSON[k]) + ' 팀장</div>' +
        '<div class="res">' + (res ? esc(res) : (st.running ? "확인 중…" : "대기")) + '</div></div>' +
        '<span class="mark">' + (res ? "✓" : (st.running ? "…" : "")) + '</span></div>';
    }).join("");
    go.disabled = st.running;
    go.textContent = st.running ? "정리 중… (" + n + "/6)" : (n >= 6 ? "다시 정리" : "정리 시작");
    wipe.disabled = n < 6;
    return st;
  }

  function poll() {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      if (!scrim.classList.contains("on")) return;
      const st = await draw();
      if (st.running || Object.keys(st.done).length < 6) poll();
    }, 6000);
  }

  go.addEventListener("click", async () => {
    go.disabled = true;
    await fetch(CHAT, { method: "POST", headers: Object.assign({}, HDR, { Prefer: "return=minimal" }),
      body: JSON.stringify({ team: "_all", role: "sweep", status: "pending", body: await lock(PW, "하루 정리") }) });
    draw(); poll();
  });

  wipe.addEventListener("click", async () => {
    if (!confirm("오늘 대화를 전부 비웁니다.\n원문은 파일로 저장되고, 화면의 채팅은 모두 사라집니다.\n\n계속할까요?")) return;
    wipe.disabled = true; wipe.textContent = "비우는 중…";
    await fetch(CHAT, { method: "POST", headers: Object.assign({}, HDR, { Prefer: "return=minimal" }),
      body: JSON.stringify({ team: "_all", role: "wipe", status: "pending", body: await lock(PW, "비우기") }) });
    setTimeout(() => { close(); chatLoad(); wipe.textContent = "채팅 비우기"; }, 8000);
  });

  document.getElementById("sweepclose").addEventListener("click", close);
  scrim.addEventListener("click", e => { if (e.target === scrim) close(); });
})();

/* 오른쪽 목록 접기·펴기 */
(function () {
  const RKEY = "hq-roster-open";
  const ros = document.getElementById("roster"), tab = document.getElementById("rostertab");
  function apply(open) {
    ros.classList.toggle("on", open);
    document.body.classList.toggle("roster-on", open);
    tab.classList.toggle("on", !open);
    localStorage.setItem(RKEY, open ? "1" : "0");
  }
  ros.querySelector(".fold").addEventListener("click", () => apply(false));
  tab.addEventListener("click", () => apply(true));
  apply(localStorage.getItem(RKEY) !== "0");
})();

document.getElementById("calbtn").addEventListener("click", openBlade);
document.getElementById("bladeclose").addEventListener("click", closeBlade);
document.getElementById("scrim").addEventListener("click", closeBlade);
document.getElementById("mprev").addEventListener("click", () => { calYM = calYM[1] ? [calYM[0], calYM[1] - 1] : [calYM[0] - 1, 11]; drawCal(); });
document.getElementById("mnext").addEventListener("click", () => { calYM = calYM[1] === 11 ? [calYM[0] + 1, 0] : [calYM[0], calYM[1] + 1]; drawCal(); });
document.getElementById("prev").addEventListener("click", () => go(shift(DATE, -1)));
document.getElementById("next").addEventListener("click", () => go(shift(DATE, 1)));
document.getElementById("todaybtn").addEventListener("click", () => go(todayStr()));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeBlade(); closeDock(); }
  if (!PW || (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) return;
  if (e.key === "ArrowLeft") go(shift(DATE, -1));
  if (e.key === "ArrowRight") go(shift(DATE, 1));
});

/* ───── 이동 ───── */
async function go(d) {
  DATE = d; history.replaceState(null, "", "#" + d);
  setDot(true, "여는 중…");
  const row = await fetchDay(d);
  DAY = null; STATE = { checks: [], notes: {}, custom: [], expenses: [], memo: "", deptNotes: {} };
  if (row) {
    if (row.payload) { try { DAY = await unlockText(PW, row.payload); } catch (e) { DAY = null; } }
    if (row.state) { try { STATE = Object.assign(STATE, await unlockText(PW, row.state)); } catch (e) {} }
  }
  render();
  Object.values(docks).forEach(d => d.sig = "");
  chatLoad();
  setDot(true, row ? "저장 준비됨" : "브리핑 없음");
  if (document.getElementById("blade").classList.contains("on")) drawCal();
  window.scrollTo({ top: 0 });
}
async function start() {
  await fetchDates();
  const h = (location.hash || "").replace("#", "");
  await go(/^\d{4}-\d{2}-\d{2}$/.test(h) ? h : (DATES.includes(todayStr()) ? todayStr() : (DATES[0] || todayStr())));
}
(async () => {
  const saved = localStorage.getItem(PWKEY);
  if (saved) {
    const r = await tryUnlock(saved);
    if (r.ok) {
      PW = saved;
      document.getElementById("gate").style.display = "none";
      document.getElementById("app").style.display = "";
      await start();
      return;
    }
    localStorage.removeItem(PWKEY);
  }
  document.getElementById("pw").focus();
})();
</script>
