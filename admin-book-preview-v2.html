<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>미리보기·인쇄 v2 - 이온토플</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/book-design-system.css?v=20261103c">
<link rel="stylesheet" href="css/book-font-notosanskr.css">
<link rel="stylesheet" href="css/book-font-voca2.css?v=20261110a">
<link rel="stylesheet" href="css/book-page-fonts.css?v=20261115a">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9ebf0;font-family:Pretendard,sans-serif;color:#1f2937}
.pv-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:1px solid #e5e7eb}
.pv-top h1{font-size:16px;margin:0;flex:1}
.pv-top button,.pv-top select{font:600 13px Pretendard;padding:7px 12px;border-radius:8px;border:1px solid #d1d5db;background:#fff;cursor:pointer}
#status{font-size:12.5px;color:#6b7280}
.pv-stack{display:flex;flex-direction:column;align-items:center;gap:22px;padding:26px 10px 80px}
.pv-sheet{background:#fff;box-shadow:0 2px 10px rgba(20,30,40,.12);overflow:hidden}
.pv-no{font:600 12px Pretendard;color:#6b7280;margin-bottom:6px}
@media print{
  @page{size:210mm 280mm;margin:0}
  body{background:#fff}
  .pv-top,.pv-no{display:none!important}
  .pv-stack{display:block;padding:0}
  .pv-wrap{break-after:page;page-break-after:always}
  .pv-wrap:last-child{break-after:auto;page-break-after:auto}
  .pv-sheet{box-shadow:none;width:210mm!important;height:280mm!important}
  .pv-sheet .bp-host{transform:none!important}
}
</style>
</head>
<body>
<div class="pv-top"><h1 id="title">미리보기·인쇄 v2</h1><span id="status">불러오는 중…</span>
<select id="zoom"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.5">150%</option></select>
<button id="btnPrint">인쇄 · PDF로 저장</button></div>
<div class="pv-stack" id="stack"></div>
<script src="js/supabase-config.js?v=20261012"></script>
<script src="js/book-page.js?v=20261117g"></script>
<script>
// 관리자 미리보기·인쇄 v2 (2026-11-15): 에디터 v2와 같은 BookPage로 쪽을 그린다. 인쇄 = 210×280 종이 그대로(축소 없음).
(async function () {
  const p = new URLSearchParams(location.search), DEV = p.get('dev') === '1' && ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
  if (!DEV) { let u = null; try { u = JSON.parse(localStorage.getItem('iontoefl_user') || 'null'); } catch (_) {} if (!u || u.role !== 'admin') { alert('⚠️ 관리자만 접근할 수 있습니다.'); location.href = 'index.html'; return; } }
  const st = (t) => document.getElementById('status').textContent = t;
  const id = p.get('book'); if (!id) { st('책 번호가 없어요'); return; }
  const doc = (await supabaseAPI.query('tr_book_documents', { id: 'eq.' + id, select: 'id,title' }))[0];
  document.getElementById('title').textContent = (doc && doc.title || '책') + ' · 미리보기·인쇄 v2';
  const pages = await supabaseAPI.query('tr_book_pages', { book_id: 'eq.' + id, deleted_at: 'is.null', select: 'id,sort_order,html', order: 'sort_order.asc' });
  if (!BookPage.isHtmlBook(pages)) { st('아직 HTML 쪽으로 옮기지 않은 책이에요 (' + pages.filter(BookPage.isHtmlPage).length + ' / ' + pages.length + '쪽)'); return; }
  const stack = document.getElementById('stack'); const items = [];
  pages.forEach((pg, i) => { const w = document.createElement('div'); w.className = 'pv-wrap'; w.innerHTML = '<div class="pv-no">' + (i + 1) + '쪽</div><div class="pv-sheet"><div class="bp-host"></div></div>'; stack.appendChild(w); const host = w.querySelector('.bp-host'); BookPage.render(host, pg.html); items.push([w.querySelector('.pv-sheet'), host]); });
  const scale = () => { const s = parseFloat(document.getElementById('zoom').value) || 1; items.forEach(([b, h]) => BookPage.place(b, h, s)); };
  document.getElementById('zoom').addEventListener('change', scale); scale();
  document.getElementById('btnPrint').addEventListener('click', async () => { if (document.fonts) await document.fonts.ready; window.print(); });
  if (document.fonts) await document.fonts.ready;
  st(pages.length + '쪽');
  window.__pvReady = true;
})();
</script>
</body>
</html>
