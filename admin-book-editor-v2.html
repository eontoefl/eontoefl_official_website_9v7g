<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>책 에디터 v2 - 이온토플</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<!-- 책 글꼴: 지금 에디터·서재와 같은 사이트 글꼴 + 쪽 안에 있던 글꼴 -->
<link rel="stylesheet" href="css/book-design-system.css?v=20261103c">
<link rel="stylesheet" href="css/book-font-notosanskr.css">
<link rel="stylesheet" href="css/book-font-voca2.css?v=20261110a">
<link rel="stylesheet" href="css/book-page-fonts.css?v=20261115a">
<link rel="stylesheet" href="css/admin-book-editor-v2.css?v=20261117p">
</head>
<body class="be2">
<header class="be2-top">
  <div class="be2-top-l">
    <a class="be2-btn ghost" id="btnBack" href="admin-book-list-v2.html"><i class="fas fa-arrow-left"></i> 교재 관리</a>
    <h1 id="bookTitle">책 에디터 v2</h1>
    <span class="be2-status" id="status">불러오는 중…</span>
  </div>
  <div class="be2-top-r">
    <label class="be2-zoom">배율 <select id="zoomSel"><option value="0.6">60%</option><option value="0.75">75%</option><option value="0.9">90%</option><option value="1" selected>100%</option><option value="1.25">125%</option></select></label>
    <a class="be2-btn ghost" id="btnStudent" target="_blank" hidden><i class="fas fa-eye"></i> 학생 화면으로 보기</a>
    <button class="be2-btn ghost" id="btnPdf" type="button" hidden title="이름 없는 원본 PDF (인쇄소·보관용)"><i class="fas fa-file-arrow-down"></i> PDF 저장</button>
    <button class="be2-btn grad" id="btnSave" hidden><i class="fas fa-floppy-disk"></i> 저장</button>
  </div>
</header>
<div class="be2-main">
  <aside class="be2-outline" id="outline"><div class="be2-outline-h">목차</div><div id="outlineList"></div></aside>
  <main class="be2-canvas" id="canvas"><div id="stack" class="be2-stack"></div></main>
</div>
<div class="be2-toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/supabase-config.js?v=20261012"></script>
<script src="js/book-page.js?v=20261117g"></script>
<script src="js/admin-book-pdf.js?v=20261117a"></script>
<script src="js/admin-book-editor-v2.js?v=20261117b"></script>
</body>
</html>
