<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>김비서 v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --surface:#f7edf5; --surface-lowest:#ffffff; --surface-low:#f4e6f0;
    --surface-container:#efdcea; --surface-high:#ecd4e6; --surface-highest:#e9cde2;
    --field:#f3ebf1;
    --on-surface:#2a2431; --on-surface-variant:#6d6270;
    --accent:#b1d1e7; --accent-soft:#c8dfee; --accent-lightest:#e4eff7;
    --accent-ink:#16384e; --accent-strong:#3f7fa8; --accent-line:#86b8dc;
    --grad:linear-gradient(135deg,#b1d1e7 0%,#c8dfee 100%);
    --brandmark:linear-gradient(135deg,#e9cde2 0%,#c8dfee 100%);
    --danger:#b0476a; --danger-soft:#f7e4ec;
    --lift:0 4px 28px rgba(80,40,70,.06); --lift-hi:0 12px 40px rgba(80,40,70,.11);
    --r:.5rem; --r-lg:1rem;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-text-size-adjust:100%; }
  body { font-family:"Inter","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--surface); color:var(--on-surface); line-height:1.72; font-size:15px; padding:0 0 96px; }
  .wrap { max-width:900px; margin:0 auto; padding:0 1.4rem; }
  @media (min-width:760px){ .wrap { padding:0 2rem; } }
  h1,h2,h3 { letter-spacing:-0.02em; }
  ::selection { background:var(--accent-soft); color:var(--accent-ink); }
  button { font-family:inherit; cursor:pointer; }

  /* 잠금 */
  #gate { max-width:360px; margin:16vh auto; padding:0 1.4rem; text-align:center; }
  #gate .mark { width:52px; height:52px; margin:0 auto 1.4rem; border-radius:var(--r-lg);
    background:var(--brandmark); display:grid; place-items:center; font-size:23px; }
  #gate h1 { font-size:20px; font-weight:700; margin-bottom:.35rem; }
  #gate p { font-size:13.5px; color:var(--on-surface-variant); margin-bottom:1.4rem; }
  #gate input { width:100%; background:#fff; border:none; border-radius:var(--r); padding:14px 16px;
    font-family:inherit; font-size:16px; color:var(--on-surface); outline:none; text-align:center; box-shadow:var(--lift); }
  #gate input:focus { outline:2px solid var(--accent-line); }
  #gate button { width:100%; margin-top:.7rem; background:var(--grad); color:var(--accent-ink); border:none;
    border-radius:var(--r); padding:14px; font-size:15px; font-weight:700; box-shadow:var(--lift); }
  #gate .msg { font-size:13px; color:var(--danger); margin-top:.7rem; min-height:20px; font-weight:500; }

  /* 상단바 */
  .topbar { position:sticky; top:0; z-index:40; background:rgba(255,255,255,.72);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); margin-bottom:1.5rem; }
  .topbar .inner { max-width:900px; margin:0 auto; padding:1rem 1.4rem; display:flex; align-items:center; gap:.7rem; }
  @media (min-width:760px){ .topbar .inner { padding:1rem 2rem; } }
  .brand { font-size:15px; font-weight:700; }
  .brand small { display:block; font-size:10px; font-weight:600; letter-spacing:.18em; color:var(--on-surface-variant); }
  #savedot { font-size:12px; font-weight:500; color:var(--on-surface-variant); margin-left:auto; }
  #savedot.bad { color:var(--danger); }

  /* 탭 */
  .tabs { display:flex; gap:.3rem; background:var(--surface-low); border-radius:var(--r-lg); padding:.35rem; margin-bottom:1.75rem; }
  .tabs button { flex:1; border:none; background:transparent; border-radius:.7rem; padding:.7rem .4rem;
    font-size:14px; font-weight:600; color:var(--on-surface-variant); transition:.15s; }
  .tabs button:hover { color:var(--on-surface); }
  .tabs button.on { background:var(--surface-lowest); color:var(--accent-strong); box-shadow:var(--lift); }
  @media (max-width:480px){ .tabs button { font-size:13px; padding:.65rem .2rem; } }

  /* 영역 머리 */
  .vhead { display:flex; align-items:center; gap:.8rem; margin-bottom:1.1rem; padding-left:.15rem; }
  .vhead .t { font-size:22px; font-weight:700; }
  .vhead .c { font-size:12.5px; font-weight:600; color:var(--on-surface-variant); background:var(--surface-high); border-radius:99px; padding:2px 10px; }
  .addbtn { margin-left:auto; border:none; border-radius:var(--r); background:var(--grad); color:var(--accent-ink);
    padding:10px 16px; font-size:13.5px; font-weight:700; box-shadow:var(--lift); }
  .addbtn:hover { filter:brightness(1.03); }

  /* 업무 섹션 */
  .wsec { margin-bottom:1.4rem; }
  .wsec-h { display:flex; align-items:center; gap:.5rem; margin:0 0 .6rem .15rem; font-size:13.5px; font-weight:700; color:var(--on-surface); }
  .wsec-h .ic { font-size:15px; }
  .wsec-h .n { background:var(--surface-high); color:var(--on-surface-variant); font-size:11.5px; font-weight:700; border-radius:99px; padding:1px 9px; }
  .wsec-empty { font-size:12.5px; color:var(--on-surface-variant); opacity:.6; padding:.2rem 0 .2rem .3rem; }

  /* 카드 목록 */
  .list { display:flex; flex-direction:column; gap:.7rem; }
  .card { display:flex; align-items:flex-start; gap:.6rem; background:var(--surface-lowest); border-radius:var(--r-lg);
    padding:1rem 1.05rem 1rem .7rem; box-shadow:var(--lift); transition:box-shadow .15s, opacity .15s; }
  .card:hover { box-shadow:var(--lift-hi); }
  .card.done, .card.past { opacity:.55; }
  .card.dragging { box-shadow:var(--lift-hi); opacity:.9; }
  .drag { flex-shrink:0; width:22px; align-self:stretch; display:flex; align-items:center; justify-content:center;
    color:var(--on-surface-variant); opacity:.4; cursor:grab; touch-action:none; font-size:15px; line-height:1; user-select:none; }
  .drag:hover { opacity:.8; }
  .drag:active { cursor:grabbing; }
  .card > input[type=checkbox] { width:22px; height:22px; margin-top:1px; accent-color:var(--accent-line); cursor:pointer; flex-shrink:0; }
  .card .cal { width:22px; margin-top:1px; font-size:16px; text-align:center; flex-shrink:0; }
  .card .body { flex:1; min-width:0; }
  .card .title { font-size:15.5px; font-weight:600; line-height:1.5; word-break:break-word; }
  .card.done .title { text-decoration:line-through; text-decoration-color:var(--on-surface-variant); }
  .card .why { font-size:13px; color:var(--accent-strong); margin-top:.2rem; word-break:break-word; }
  .card .memo { font-size:13px; color:var(--on-surface-variant); margin-top:.15rem; white-space:pre-wrap; word-break:break-word; }
  .card .meta { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.55rem; }
  .card .meta:empty { display:none; }
  .badge { font-size:11.5px; font-weight:600; border-radius:99px; padding:2.5px 10px; line-height:1.5; display:inline-flex; align-items:center; gap:4px; }
  .badge.due { background:var(--accent-lightest); color:var(--accent-strong); }
  .badge.due.over { background:var(--danger-soft); color:var(--danger); }
  .badge.when { background:var(--accent-lightest); color:var(--accent-strong); }
  .badge.soft { background:var(--surface-high); color:var(--on-surface-variant); }
  .card .acts { display:flex; align-items:center; gap:.1rem; flex-shrink:0; margin:-1px -3px 0 0; }
  .card .acts button { border:none; background:transparent; color:var(--on-surface-variant); width:30px; height:30px;
    border-radius:var(--r); font-size:15px; opacity:.55; transition:.12s; }
  .card:hover .acts button { opacity:1; }
  .card .acts button:hover { background:var(--surface-high); }
  .card .acts button.del:hover { background:var(--danger-soft); color:var(--danger); }

  /* 프로젝트 카드 */
  .card.proj { flex-direction:column; align-items:stretch; gap:0; padding:1rem 1.05rem 1rem .7rem; }
  .proj-top { display:flex; align-items:flex-start; gap:.6rem; }
  .proj-top .body { flex:1; min-width:0; cursor:pointer; }
  .proj-top .prog { font-size:12px; font-weight:600; color:var(--on-surface-variant); margin-top:.3rem; }
  .proj-sub { margin:.8rem 0 0 1.9rem; display:flex; flex-direction:column; gap:.4rem; }
  .sub { display:flex; align-items:center; gap:.5rem; background:var(--surface-low); border-radius:var(--r); padding:.5rem .6rem; }
  .sub.done { opacity:.55; }
  .sub .drag { align-self:center; width:18px; font-size:13px; }
  .sub input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent-line); cursor:pointer; }
  .sub .st { flex:1; font-size:13.5px; min-width:0; word-break:break-word; }
  .sub.done .st { text-decoration:line-through; color:var(--on-surface-variant); }
  .sub .x { border:none; background:transparent; color:var(--on-surface-variant); opacity:.5; font-size:13px; width:24px; height:24px; border-radius:var(--r); }
  .sub .x:hover { background:var(--danger-soft); color:var(--danger); opacity:1; }
  .subadd { display:flex; gap:.4rem; margin-top:.2rem; }
  .subadd input { flex:1; background:var(--field); border:none; border-radius:var(--r); padding:8px 11px; font-family:inherit; font-size:13.5px; color:var(--on-surface); outline:none; }
  .subadd input:focus { outline:2px solid var(--accent-line); }
  .subadd button { border:none; background:var(--surface-high); color:var(--on-surface-variant); border-radius:var(--r); padding:0 13px; font-size:13px; font-weight:700; }

  .empty { background:var(--surface-low); border-radius:var(--r-lg); padding:3rem 1.4rem; text-align:center; color:var(--on-surface-variant); font-size:14px; line-height:1.8; }
  .empty .big { font-size:34px; margin-bottom:.5rem; }
  .empty b { color:var(--accent-strong); font-weight:700; }
  .soon { background:var(--surface-low); border-radius:var(--r-lg); padding:3.2rem 1.4rem; text-align:center; color:var(--on-surface-variant); }
  .soon .big { font-size:30px; margin-bottom:.6rem; }
  .soon .t { font-size:16px; font-weight:600; color:var(--on-surface); }
  .soon .d { font-size:13px; margin-top:.35rem; }
  .foot { text-align:center; font-size:11px; color:var(--on-surface-variant); opacity:.6; margin-top:2.5rem; }

  /* 오버레이 공통 */
  .ov { position:fixed; inset:0; z-index:60; background:rgba(42,36,49,.30); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    display:none; align-items:flex-end; justify-content:center; }
  .ov.on { display:flex; }
  @media (min-width:620px){ .ov { align-items:center; } }
  .sheet { width:100%; max-width:520px; background:var(--surface-lowest); border-radius:var(--r-lg) var(--r-lg) 0 0;
    box-shadow:0 -12px 40px rgba(80,40,70,.16); padding:1.5rem 1.4rem 1.6rem; max-height:92vh; overflow-y:auto; }
  @media (min-width:620px){ .sheet { border-radius:var(--r-lg); box-shadow:0 20px 60px rgba(80,40,70,.20); } }
  .sheet h3 { font-size:17px; font-weight:700; margin-bottom:1.2rem; }

  /* 1단계 종류 선택 */
  .pickbtn { width:100%; display:flex; align-items:center; gap:.8rem; border:none; background:var(--field);
    border-radius:var(--r); padding:14px 16px; margin-bottom:.5rem; text-align:left; transition:.12s; }
  .pickbtn:hover { background:var(--surface-high); }
  .pickbtn .pi { font-size:20px; width:24px; text-align:center; flex-shrink:0; }
  .pickbtn .pn { display:block; font-size:15px; font-weight:700; color:var(--on-surface); }
  .pickbtn .pd { display:block; font-size:12px; color:var(--on-surface-variant); margin-top:1px; }
  .pcancel { width:100%; margin-top:.6rem; border:none; background:var(--surface-high); color:var(--on-surface-variant);
    border-radius:var(--r); padding:12px; font-size:14px; font-weight:700; }

  /* 종류 토글(개인) */
  .seg { display:flex; gap:.3rem; background:var(--field); border-radius:99px; padding:.3rem; margin-bottom:1.3rem; }
  .seg button { flex:1; border:none; background:transparent; border-radius:99px; padding:9px; font-size:14px; font-weight:700; color:var(--on-surface-variant); transition:.12s; }
  .seg button.on { background:var(--surface-lowest); color:var(--accent-strong); box-shadow:var(--lift); }

  .fld { margin-bottom:1.1rem; }
  .fld label { display:block; font-size:10.5px; font-weight:700; letter-spacing:.12em; color:var(--on-surface-variant); margin-bottom:.5rem; }
  .fld input[type=text], .fld textarea, .fld input[type=date], .fld input[type=time], .fld input[type=number] {
    width:100%; background:var(--field); border:none; border-radius:var(--r); padding:12px 14px; font-family:inherit; font-size:15px; color:var(--on-surface); outline:none; }
  .fld input:focus, .fld textarea:focus { outline:2px solid var(--accent-line); }
  .fld textarea { resize:vertical; min-height:64px; line-height:1.6; }
  .chips { display:flex; flex-wrap:wrap; gap:.4rem; }
  .chips button { border:none; background:var(--field); color:var(--on-surface-variant); border-radius:99px; padding:8px 14px; font-size:13px; font-weight:600; transition:.12s; }
  .chips button.on { background:var(--grad); color:var(--accent-ink); }
  .row { display:flex; gap:.6rem; margin-top:1.4rem; }
  .row button { flex:1; border:none; border-radius:var(--r); padding:13px; font-size:14.5px; font-weight:700; }
  .cancel { background:var(--surface-high); color:var(--on-surface-variant); }
  .save { background:var(--grad); color:var(--accent-ink); box-shadow:var(--lift); }
  .save:disabled { opacity:.45; box-shadow:none; }
  .hide { display:none !important; }
</style>
</head>
<body>

<div id="gate">
  <div class="mark">🔒</div>
  <h1>김비서 v3</h1>
  <p>비밀번호를 넣어주세요</p>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="unlock" type="button">열기</button>
  <div class="msg" id="gatemsg"></div>
</div>

<div id="app" style="display:none">
  <div class="topbar"><div class="inner">
    <div class="brand">김비서 v3<small>내가 기록한다</small></div>
    <div id="savedot"></div>
  </div></div>
  <div class="wrap">
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="money">돈관리</button>
      <button type="button" data-tab="work">업무</button>
      <button type="button" data-tab="personal">개인</button>
      <button type="button" data-tab="marketing">마케팅</button>
    </nav>
    <div id="view"></div>
    <p class="foot">eonfl.com/note3 · 김비서 v3</p>
  </div>
</div>

<!-- 1단계: 업무 종류 선택 -->
<div class="ov" id="pick"><div class="sheet">
  <h3>어떤 업무예요?</h3>
  <button class="pickbtn" type="button" data-b="quick"><span class="pi">⚡</span><span><span class="pn">단발</span><span class="pd">5분이면 끝나는 일</span></span></button>
  <button class="pickbtn" type="button" data-b="deadline"><span class="pi">📌</span><span><span class="pn">약속·마감</span><span class="pd">누구에게 언제까지 하기로 한 일</span></span></button>
  <button class="pickbtn" type="button" data-b="recurring"><span class="pi">🔁</span><span><span class="pn">반복</span><span class="pd">매일·매주 도는 일</span></span></button>
  <button class="pickbtn" type="button" data-b="someday"><span class="pi">💤</span><span><span class="pn">언젠가</span><span class="pd">급하진 않지만 언젠가 할 일</span></span></button>
  <button class="pickbtn" type="button" data-b="project"><span class="pi">📚</span><span><span class="pn">장기 프로젝트</span><span class="pd">여러 단계로 된 큰 일</span></span></button>
  <button class="pcancel" type="button" id="pickcancel">취소</button>
</div></div>

<!-- 2단계: 입력 폼 -->
<div class="ov" id="ov"><div class="sheet">
  <h3 id="shtitle">새 할일</h3>

  <div class="seg" id="f_seg">
    <button type="button" data-v="task" class="on">할일</button>
    <button type="button" data-v="appt">약속</button>
  </div>

  <div class="fld"><label id="lbl_title">제목</label>
    <input type="text" id="f_title" autocomplete="off"></div>

  <div class="fld" id="blk_why"><label>왜 필요한지 (선택)</label>
    <textarea id="f_why" placeholder="이게 왜 필요한지 — 나중에 AI가 이걸 보고 판단해요."></textarea></div>

  <!-- 개인 할일: 기한 -->
  <div id="blk_ptask">
    <div class="fld"><label>기한</label>
      <div class="chips" id="f_chip" style="margin-bottom:.6rem">
        <button type="button" data-v="">없음</button>
        <button type="button" data-v="asap">최대한 빨리</button>
        <button type="button" data-v="1-2d">하루이틀 이내</button>
        <button type="button" data-v="1w">일주일 이내</button>
      </div>
      <input type="date" id="f_date"></div>
  </div>

  <!-- 개인 약속 -->
  <div id="blk_appt">
    <div class="fld"><label>날짜</label><input type="date" id="a_date"></div>
    <div class="fld"><label>시간</label>
      <div class="chips" id="a_tbd" style="margin-bottom:.6rem">
        <button type="button" data-v="" class="on">시간 지정</button>
        <button type="button" data-v="tbd">시간 미정</button>
      </div>
      <input type="time" id="a_time"></div>
    <div class="fld"><label>누구랑 (선택)</label><input type="text" id="a_who" placeholder="예: 남편" autocomplete="off"></div>
    <div class="fld"><label>장소 (선택)</label><input type="text" id="a_place" placeholder="예: CGV 강남" autocomplete="off"></div>
  </div>

  <!-- 업무 약속·마감 -->
  <div id="blk_wdue">
    <div class="fld"><label>언제까지</label><input type="date" id="w_due"></div>
    <div class="fld"><label>누구랑 / 무슨 약속</label><input type="text" id="w_who" placeholder="예: 김OO 학생 / OO업체 납품" autocomplete="off"></div>
  </div>

  <!-- 업무 반복 -->
  <div id="blk_freq">
    <div class="fld"><label>반복 주기</label>
      <div class="chips" id="f_freq" style="margin-bottom:.6rem">
        <button type="button" data-v="daily" class="on">매일</button>
        <button type="button" data-v="weekly">매주</button>
        <button type="button" data-v="monthly">매월</button>
      </div>
      <div class="chips" id="f_wday" style="margin-bottom:.6rem">
        <button type="button" data-v="0">일</button><button type="button" data-v="1">월</button>
        <button type="button" data-v="2">화</button><button type="button" data-v="3">수</button>
        <button type="button" data-v="4">목</button><button type="button" data-v="5">금</button>
        <button type="button" data-v="6">토</button>
      </div>
      <input type="number" id="f_mday" min="1" max="31" placeholder="며칠 (1~31)"></div>
  </div>

  <div class="fld" id="blk_memo"><label id="lbl_memo">메모 (선택)</label>
    <textarea id="f_memo" placeholder="자세한 내용"></textarea></div>

  <div class="row">
    <button type="button" class="cancel" id="shcancel">취소</button>
    <button type="button" class="save" id="shsave">저장</button>
  </div>
</div></div>

<script>
/* ═══ 김비서 v3 · note3.html ═══
   저장: Supabase note3_store(암호블롭) → 없으면 localStorage. 관리자 비번 게이트.
   개인 탭: 할일(제목·왜·기한·메모) / 약속(날짜·시간·누구랑·장소)
   업무 탭: +추가 → 1단계 종류(단발·약속마감·반복·언젠가·프로젝트) → 2단계 전용 폼
   우선순위: 왼쪽 드래그 핸들로 자유 이동. 색: 메인=연보라, 강조=연하늘 */

/* 암호 */
const enc = new TextEncoder(), dec = new TextDecoder();
async function keyFrom(pw, salt) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt, iterations:200000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function b64e(b){ let s=""; new Uint8Array(b).forEach(c=>s+=String.fromCharCode(c)); return btoa(s); }
async function lock(pw, obj) {
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await keyFrom(pw, salt);
  const ct=await crypto.subtle.encrypt({ name:"AES-GCM", iv }, k, enc.encode(JSON.stringify(obj)));
  const out=new Uint8Array(28+ct.byteLength); out.set(salt,0); out.set(iv,16); out.set(new Uint8Array(ct),28); return b64e(out);
}
async function unlockText(pw, blob) {
  const raw=b64d(blob); const k=await keyFrom(pw, raw.slice(0,16));
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:raw.slice(16,28) }, k, raw.slice(28))));
}

const nowHM = () => { const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };

function dueLabel(it){
  if (it.dueChip && CHIP[it.dueChip]) return { text:CHIP[it.dueChip], over:false };
  if (it.due){ const d=new Date(it.due+"T12:00:00"); return { text:(d.getMonth()+1)+"월 "+d.getDate()+"일", over:it.due<todayStr() && !it.done }; }
  return null;
}
function apptWhen(it){
  let s; if (it.date){ const d=new Date(it.date+"T12:00:00"); s=(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DOW[d.getDay()]+")"; } else s="날짜 미정";
  if (it.timeTBD) s+=" · 시간 미정";
  else if (it.time){ const p=it.time.split(":"), H=+p[0], ap=H<12?"오전":"오후", h12=H%12||12; s+=" · "+ap+" "+h12+":"+p[1]; }
  return s;
}
function apptPast(it){ if(!it.date) return false; const t=todayStr(); if(it.date<t) return true; if(it.date===t && it.time && !it.timeTBD) return it.time<nowHM(); return false; }
function dueBadge(it){ const d=dueLabel(it); return d ? '<span class="badge due'+(d.over?' over':'')+'">📅 '+esc(d.text)+'</span>' : ''; }
function freqLabel(it){ if(it.freq==="weekly") return "매주 "+DOW[it.freqDay||0]; if(it.freq==="monthly") return "매월 "+(it.freqDay||1)+"일"; return "매일"; }

/* 저장소 */
async function pullCloud(){
  try { const r=await fetch(SB+"?id=eq.main&select=data",{headers:HDR,cache:"no-store"}); if(r.ok){ const j=await r.json(); return { reachable:true, blob:(Array.isArray(j)&&j.length?j[0].data:null) }; } } catch(e){}
  return { reachable:false, blob:null };
}
async function pushBlob(blob){
  localStorage.setItem(LSKEY, blob);
  try { const r=await fetch(SB+"?on_conflict=id",{method:"POST",headers:Object.assign({},HDR,{"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify({id:"main",data:blob})}); if(r.ok){ storeSrc="sb"; return; } } catch(e){}
  storeSrc="local";
}
async function pushState(){ if(!STORE||!PW) return; try { STORE.updated=new Date().toLocaleString("ko-KR"); await pushBlob(await lock(PW,STORE)); setDot(true,"저장됨 "+(storeSrc==="local"?"· 이 기기":"· 동기화")); } catch(e){ setDot(false,"저장 안 됨"); } }
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(pushState,500); }
function blankStore(){ return { v:3, personal:[], work:{ quick:[], deadline:[], recurring:[], someday:[], project:[] }, marketing:[], money:{} }; }

/* 잠금 */
async function tryUnlock(pw){ try { const t=await unlockText(pw,VERIFIER); if(t&&t.ok==="note3") return {ok:true}; } catch(e){} return {ok:false}; }
$("unlock").addEventListener("click", doUnlock);
$("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") doUnlock(); });
async function doUnlock(){
  const pw=$("pw").value, msg=$("gatemsg"); if(!pw) return;
  msg.style.color="var(--on-surface-variant)"; msg.textContent="여는 중…";
  const r=await tryUnlock(pw); if(!r.ok){ msg.style.color="var(--danger)"; msg.textContent="비밀번호가 다릅니다"; return; }
  PW=pw; localStorage.setItem(PWKEY,pw); $("gate").style.display="none"; $("app").style.display=""; await start();
}
async function loadStore(){
  /* 클라우드 우선. 단, 클라우드가 '연결은 되는데 비어 있고' 이 기기(localStorage)에 저장분이 있으면
     → 기기 저장분을 복구해서 쓰고 클라우드로 올린다(옛 localStorage 데이터가 빈 클라우드에 가려지는 사고 방지). */
  const cloud = await pullCloud();
  const local = localStorage.getItem(LSKEY);
  let blob=null, migrate=false;
  if(cloud.reachable){
    if(cloud.blob){ blob=cloud.blob; storeSrc="sb"; }
    else if(local){ blob=local; storeSrc="sb"; migrate=true; }
    else { storeSrc="sb"; }
  } else { blob=local; storeSrc="local"; }
  STORE=blankStore();
  if(blob){ try { STORE=Object.assign(blankStore(), await unlockText(PW,blob)); } catch(e){} }
  if(!Array.isArray(STORE.personal)) STORE.personal=[];
  if(!Array.isArray(STORE.marketing)) STORE.marketing=[];
  if(Array.isArray(STORE.work)){ const old=STORE.work; STORE.work={ quick:[],deadline:[],recurring:[],someday:[],project:[] }; old.forEach(x=>STORE.work.quick.push(Object.assign({ bucket:"quick" }, x))); }
  else if(!STORE.work || typeof STORE.work!=="object"){ STORE.work={}; }
  ["quick","deadline","recurring","someday","project"].forEach(k=>{ if(!Array.isArray(STORE.work[k])) STORE.work[k]=[]; });
  if(migrate) save();   // 이 기기 저장분을 클라우드로 올려 동기화 복구
}

/* 드래그 정렬 (왼쪽 핸들, 마우스·터치 공용) */
function enableDrag(container, arr){
  container.querySelectorAll(":scope > [data-id] > .drag, :scope > [data-id] > .proj-top > .drag").forEach(handle=>{
    handle.addEventListener("pointerdown", e=>{
      e.preventDefault();
      const card = handle.closest("[data-id]"); if(!card) return;
      card.classList.add("dragging"); let moved=false;
      const move = ev=>{
        moved=true;
        const others=[...container.querySelectorAll(":scope > [data-id]:not(.dragging)")];
        let placed=false;
        for(const o of others){ const r=o.getBoundingClientRect(); if(ev.clientY < r.top+r.height/2){ container.insertBefore(card,o); placed=true; break; } }
        if(!placed) container.appendChild(card);
      };
      const up = ()=>{
        document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up);
        card.classList.remove("dragging");
        if(moved){ const ids=[...container.querySelectorAll(":scope > [data-id]")].map(c=>c.dataset.id); arr.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id)); save(); render(); }
      };
      document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
    });
  });
}

function wireWork(){
  const add=$("wadd"); if(add) add.addEventListener("click", openPicker);
  document.querySelectorAll("#view .list[data-bucket]").forEach(list=>{
    const bucket=list.dataset.bucket, arr=STORE.work[bucket];
    list.querySelectorAll(":scope > .card").forEach(card=>{
      const id=card.dataset.id;
      card.querySelectorAll("[data-act]").forEach(el=> el.addEventListener("click", ()=>actWork(bucket, id, el.dataset.act)));
      // 프로젝트 서브태스크
      card.querySelectorAll("[data-sub]").forEach(el=>{
        const sub=el.closest("[data-id]"); const sid=sub.dataset.id;
        el.addEventListener("click", ()=>actSub(id, sid, el.dataset.sub));
      });
      const si=card.querySelector("[data-subinput]");
      if(si){ si.addEventListener("keydown", e=>{ if(e.key==="Enter") addSub(id, si.value, si); }); }
      const sb=card.querySelector("[data-subadd]");
      if(sb){ sb.addEventListener("click", ()=>{ const inp=card.querySelector("[data-subinput]"); addSub(id, inp.value, inp); }); }
      const subwrap=card.querySelector(".proj-sub");
      if(subwrap){ const p=arr.find(x=>x.id===id); if(p) enableDrag(subwrap, p.subtasks); }
    });
    enableDrag(list, arr);
  });
}
function actWork(bucket, id, act){
  const arr=STORE.work[bucket], i=arr.findIndex(x=>x.id===id); if(i<0) return; const it=arr[i];
  if(act==="done"){ if(bucket==="recurring"){ it.lastDone = doneToday(it) ? "" : todayStr(); } else { it.done=!it.done; } it.updated=Date.now(); }
  else if(act==="toggle"){ if(openProjects.has(id)) openProjects.delete(id); else openProjects.add(id); }
  else if(act==="edit"){ openForm({tab:"work", type:bucket, id}); return; }
  else if(act==="del"){ if(!confirm('이 항목을 지웁니다.\n\n"'+it.title+'"\n\n계속할까요?')) return; arr.splice(i,1); openProjects.delete(id); }
  else return;
  save(); render();
}
function actSub(pid, sid, act){
  const p=STORE.work.project.find(x=>x.id===pid); if(!p) return; const subs=p.subtasks||[]; const i=subs.findIndex(s=>s.id===sid); if(i<0) return;
  if(act==="done"){ subs[i].done=!subs[i].done; }
  else if(act==="del"){ subs.splice(i,1); }
  save(); render();
}
function addSub(pid, title, inp){
  title=(title||"").trim(); if(!title) return;
  const p=STORE.work.project.find(x=>x.id===pid); if(!p) return;
  if(!Array.isArray(p.subtasks)) p.subtasks=[];
  p.subtasks.push({ id:uid(), title, done:false });
  if(inp) inp.value="";
  save(); render();
}

$("f_chip").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; pickChip=b.dataset.v; selChips($("f_chip"),pickChip); if(pickChip) $("f_date").value=""; });
$("f_date").addEventListener("input", ()=>{ if($("f_date").value){ pickChip=""; selChips($("f_chip"),""); } });
$("a_tbd").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; pickTbd=b.dataset.v; selChips($("a_tbd"),pickTbd); $("a_time").style.display=pickTbd==="tbd"?"none":""; });
$("f_freq").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; pickFreq=b.dataset.v; selChips($("f_freq"),pickFreq); updateFreqUI(); });
$("f_wday").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; pickWday=b.dataset.v; selChips($("f_wday"),pickWday); });
$("f_title").addEventListener("input", updateSave);
$("w_due").addEventListener("input", updateSave);
function updateSave(){ const t=$("f_title").value.trim(); let ok=!!t; if(curCtx.tab==="work"&&curCtx.type==="deadline"&&!$("w_due").value) ok=false; $("shsave").disabled=!ok; }

function findItem(ctx){
  if(ctx.tab==="personal") return STORE.personal.find(x=>x.id===ctx.id);
  return STORE.work[ctx.type].find(x=>x.id===ctx.id);
}
function openForm(ctx){
  curCtx={ tab:ctx.tab, type:ctx.type, id:ctx.id||null };
  const it = ctx.id ? findItem(ctx) : null;
  $("f_title").value = it ? it.title : "";
  $("f_why").value = it && it.why ? it.why : "";
  $("f_memo").value = it ? (it.memo||it.desc||"") : "";
  // 개인 할일 기한
  pickChip = it && it.dueChip ? it.dueChip : ""; $("f_date").value = it && it.due && !it.dueChip ? it.due : ""; selChips($("f_chip"), pickChip);
  // 개인 약속
  $("a_date").value = it && it.date ? it.date : "";
  pickTbd = it && it.timeTBD ? "tbd" : ""; $("a_time").value = it && it.time ? it.time : ""; $("a_time").style.display = pickTbd==="tbd"?"none":""; selChips($("a_tbd"), pickTbd);
  $("a_who").value = it && it.who ? it.who : ""; $("a_place").value = it && it.place ? it.place : "";
  // 업무 약속·마감
  $("w_due").value = (ctx.type==="deadline" && it && it.due) ? it.due : ""; $("w_who").value = it && it.who ? it.who : "";
  // 업무 반복
  pickFreq = it && it.freq ? it.freq : "daily"; selChips($("f_freq"), pickFreq);
  pickWday = it && it.freqDay!=null && it.freq==="weekly" ? String(it.freqDay) : "1"; selChips($("f_wday"), pickWday);
  $("f_mday").value = it && it.freq==="monthly" && it.freqDay!=null ? it.freqDay : "";
  configForm(); updateSave();
  $("ov").classList.add("on"); setTimeout(()=>$("f_title").focus(), 50);
}
function closeForm(){ $("ov").classList.remove("on"); curCtx.id=null; }
$("shcancel").addEventListener("click", closeForm);
$("ov").addEventListener("click", e=>{ if(e.target===$("ov")) closeForm(); });
$("shsave").addEventListener("click", saveForm);
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if($("ov").classList.contains("on")) closeForm(); else if($("pick").classList.contains("on")) $("pick").classList.remove("on"); } });

function buildItem(){
  const {tab,type}=curCtx, title=$("f_title").value.trim(), why=$("f_why").value.trim(), memo=$("f_memo").value.trim(), now=Date.now();
  if(tab==="personal"){
    if(type==="appt") return { type:"appt", title, memo, date:$("a_date").value, time:pickTbd==="tbd"?"":$("a_time").value, timeTBD:pickTbd==="tbd", who:$("a_who").value.trim(), place:$("a_place").value.trim(), updated:now };
    return { type:"task", title, why, memo, dueChip:pickChip, due:pickChip?"":$("f_date").value, updated:now };
  }
  // work
  if(type==="quick") return { bucket:"quick", title, memo, updated:now };
  if(type==="deadline") return { bucket:"deadline", title, why, memo, due:$("w_due").value, who:$("w_who").value.trim(), updated:now };
  if(type==="recurring"){ const day = pickFreq==="weekly" ? +pickWday : (pickFreq==="monthly" ? (+$("f_mday").value||1) : null); return { bucket:"recurring", title, why, memo, freq:pickFreq, freqDay:day, updated:now }; }
  if(type==="someday") return { bucket:"someday", title, why, memo, updated:now };
  if(type==="project") return { bucket:"project", title, desc:memo, updated:now };
}
function saveForm(){
  if($("shsave").disabled) return;
  const data=buildItem();
  const arr = curCtx.tab==="personal" ? STORE.personal : STORE.work[curCtx.type];
  if(curCtx.id){
    const it=arr.find(x=>x.id===curCtx.id);
    if(it){ ["why","dueChip","due","date","time","timeTBD","who","place","freq","freqDay","memo","desc"].forEach(k=>delete it[k]); Object.assign(it, data); }
  } else {
    const base={ id:uid(), created:Date.now() };
    if(curCtx.tab==="personal" || ["quick","deadline","someday"].includes(curCtx.type)) base.done=false;
    if(curCtx.type==="project") base.subtasks=[];
    arr.unshift(Object.assign(base, data));
  }
  closeForm(); save(); render();
}

/* 시작 */
async function start(){ setDot(true,"여는 중…"); await loadStore(); render(); setDot(true,"준비됨"); }
(async ()=>{
  const saved=localStorage.getItem(PWKEY);
  if(saved){ const r=await tryUnlock(saved); if(r.ok){ PW=saved; $("gate").style.display="none"; $("app").style.display=""; await start(); return; } localStorage.removeItem(PWKEY); }
  $("pw").focus();
})();
</script>
