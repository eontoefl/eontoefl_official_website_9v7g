<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>김비서 v3</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --surface:#f7edf5; --surface-lowest:#ffffff; --surface-low:#f4e6f0;
    --surface-container:#efdcea; --surface-high:#ecd4e6; --surface-highest:#e9cde2;
    --field:#f3ebf1;
    --on-surface:#2a2431; --on-surface-variant:#6d6270;
    --accent:#b1d1e7; --accent-soft:#c8dfee; --accent-lightest:#e4eff7;
    --accent-ink:#16384e; --accent-strong:#3f7fa8; --accent-line:#86b8dc;
    --grad:linear-gradient(135deg,#b1d1e7 0%,#c8dfee 100%);
    --brandmark:linear-gradient(135deg,#e9cde2 0%,#c8dfee 100%);
    --danger:#b0476a; --danger-soft:#f7e4ec;
    --lift:0 4px 28px rgba(80,40,70,.06); --lift-hi:0 12px 40px rgba(80,40,70,.11);
    --r:.5rem; --r-lg:1rem;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-text-size-adjust:100%; }
  body { font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--surface); color:var(--on-surface); line-height:1.72; font-size:15px; padding:0 0 96px; }
  .wrap { max-width:900px; margin:0 auto; padding:0 1.4rem; }
  @media (min-width:760px){ .wrap { padding:0 2rem; } }
  h1,h2,h3 { letter-spacing:-0.02em; }
  ::selection { background:var(--accent-soft); color:var(--accent-ink); }
  button { font-family:inherit; cursor:pointer; }

  #gate { max-width:360px; margin:16vh auto; padding:0 1.4rem; text-align:center; }
  #gate .mark { width:52px; height:52px; margin:0 auto 1.4rem; border-radius:var(--r-lg); background:var(--brandmark); display:grid; place-items:center; font-size:23px; }
  #gate h1 { font-size:20px; font-weight:700; margin-bottom:.35rem; }
  #gate p { font-size:13.5px; color:var(--on-surface-variant); margin-bottom:1.4rem; }
  #gate input { width:100%; background:#fff; border:none; border-radius:var(--r); padding:14px 16px; font-family:inherit; font-size:16px; color:var(--on-surface); outline:none; text-align:center; box-shadow:var(--lift); }
  #gate input:focus { outline:2px solid var(--accent-line); }
  #gate button { width:100%; margin-top:.7rem; background:var(--grad); color:var(--accent-ink); border:none; border-radius:var(--r); padding:14px; font-size:15px; font-weight:700; box-shadow:var(--lift); }
  #gate .msg { font-size:13px; color:var(--danger); margin-top:.7rem; min-height:20px; font-weight:500; }

  .topbar { position:sticky; top:0; z-index:40; background:rgba(255,255,255,.72); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); margin-bottom:1.5rem; }
  .topbar .inner { max-width:900px; margin:0 auto; padding:1rem 1.4rem; display:flex; align-items:center; gap:.7rem; }
  @media (min-width:760px){ .topbar .inner { padding:1rem 2rem; } }
  .brand { font-size:15px; font-weight:700; }
  .brand small { display:block; font-size:10px; font-weight:600; letter-spacing:.18em; color:var(--on-surface-variant); }
  #savedot { font-size:12px; font-weight:500; color:var(--on-surface-variant); margin-left:auto; }
  #savedot.bad { color:var(--danger); }
  #restorebtn { border:none; background:var(--surface-high); color:var(--on-surface-variant); border-radius:var(--r); padding:7px 12px; font-size:12.5px; font-weight:600; flex-shrink:0; }
  #restorebtn:hover { background:var(--surface-highest); }
  .snap-row { display:flex; align-items:center; gap:.6rem; padding:.75rem .2rem; }
  .snap-row + .snap-row { box-shadow:inset 0 1px 0 rgba(109,98,112,.12); }
  .snap-row span { flex:1; font-size:14px; color:var(--on-surface); }
  .snap-restore { border:none; background:var(--grad); color:var(--accent-ink); border-radius:var(--r); padding:8px 14px; font-size:13px; font-weight:700; flex-shrink:0; }
  #restorelist { max-height:52vh; overflow-y:auto; }

  .tabs { display:flex; gap:.3rem; background:var(--surface-low); border-radius:var(--r-lg); padding:.35rem; margin-bottom:1.75rem; }
  .tabs button { flex:1; border:none; background:transparent; border-radius:.7rem; padding:.7rem .4rem; font-size:14px; font-weight:600; color:var(--on-surface-variant); transition:.15s; }
  .tabs button:hover { color:var(--on-surface); }
  .tabs button.on { background:var(--surface-lowest); color:var(--accent-strong); box-shadow:var(--lift); }
  @media (max-width:480px){ .tabs button { font-size:13px; padding:.65rem .2rem; } }

  .vhead { display:flex; align-items:center; gap:.8rem; margin-bottom:1.1rem; padding-left:.15rem; }
  .vhead .t { font-size:22px; font-weight:700; }
  .vhead .c { font-size:12.5px; font-weight:600; color:var(--on-surface-variant); background:var(--surface-high); border-radius:99px; padding:2px 10px; }
  .addbtn { margin-left:auto; border:none; border-radius:var(--r); background:var(--grad); color:var(--accent-ink); padding:10px 16px; font-size:13.5px; font-weight:700; box-shadow:var(--lift); }
  .addbtn:hover { filter:brightness(1.03); }

  .wsec { margin-bottom:1.4rem; }
  .wsec-h { display:flex; align-items:center; gap:.5rem; margin:0 0 .6rem .15rem; font-size:13.5px; font-weight:700; color:var(--on-surface); }
  .wsec-h .ic { font-size:15px; }
  .wsec-h .n { background:var(--surface-high); color:var(--on-surface-variant); font-size:11.5px; font-weight:700; border-radius:99px; padding:1px 9px; }
  .wsec-empty { font-size:12.5px; color:var(--on-surface-variant); opacity:.6; padding:.2rem 0 .2rem .3rem; }
  .secadd { border:none; background:var(--surface-high); color:var(--on-surface-variant); width:22px; height:22px; border-radius:99px; font-size:15px; font-weight:700; line-height:1; padding:0; }
  .secadd:hover { background:var(--accent-soft); color:var(--accent-ink); }
  .sweepbtn { margin-left:auto; border:none; background:var(--surface-high); color:var(--on-surface-variant); border-radius:99px; padding:3px 11px; font-size:11.5px; font-weight:700; }
  .sweepbtn:hover { background:var(--surface-highest); }
  .today-done .card.done { opacity:.82; }
  body.dragging-lock { user-select:none; -webkit-user-select:none; }
  body.dragging-lock .sub .st { pointer-events:none; }
  .rangerow { display:flex; gap:.5rem; align-items:center; }
  .rangerow input { flex:1; min-width:0; }
  .rangerow .tilde { color:var(--on-surface-variant); flex-shrink:0; }
  .fld .hint { font-size:11px; color:var(--on-surface-variant); margin-top:.35rem; opacity:.85; }

  /* 접이식 (반복 업무 · 완료·지난 것) */
  .fold { margin-bottom:1.3rem; }
  .fold-h { display:flex; align-items:center; gap:.5rem; cursor:pointer; font-size:13.5px; font-weight:700; color:var(--on-surface-variant); padding:.55rem .15rem; user-select:none; border-radius:var(--r); }
  .fold-h:hover { color:var(--on-surface); background:var(--surface-low); }
  .fold-h .ic { font-size:15px; }
  .fold-h .n { background:var(--surface-high); font-size:11.5px; font-weight:700; border-radius:99px; padding:1px 9px; }
  .fold-h .chev { margin-left:auto; opacity:.55; font-size:12px; }
  .fold-body { padding-top:.5rem; }
  .donelist .card { opacity:.6; }

  /* 목표 스티커판 */
  .card.goal { flex-direction:column; align-items:stretch; gap:0; }
  .goal-top { display:flex; align-items:flex-start; gap:.6rem; }
  .goal-top .body { flex:1; min-width:0; }
  .goal-prog { font-size:12.5px; font-weight:600; color:var(--on-surface-variant); margin-top:.3rem; }
  .stickers { display:flex; flex-wrap:wrap; gap:5px; margin:.9rem 0 .2rem; }
  .sticker { width:26px; height:26px; border-radius:50%; background:var(--surface-high); display:grid; place-items:center; font-size:14px; line-height:1; }
  .sticker.on { background:#fff3d6; }
  .goal-claim { width:100%; border:none; border-radius:var(--r); background:var(--grad); color:var(--accent-ink); padding:11px; font-size:14px; font-weight:700; box-shadow:var(--lift); margin-top:.7rem; }
  .goal-claim.claimed { background:var(--surface-high); color:var(--on-surface-variant); box-shadow:none; }

  .list { display:flex; flex-direction:column; gap:.7rem; }
  .card { display:flex; align-items:flex-start; gap:.6rem; background:var(--surface-lowest); border-radius:var(--r-lg); padding:1rem 1.05rem 1rem .7rem; box-shadow:var(--lift); transition:box-shadow .15s, opacity .15s; }
  .card:hover { box-shadow:var(--lift-hi); }
  .card.done, .card.past { opacity:.55; }
  .card.dragging { box-shadow:var(--lift-hi); opacity:.9; }
  .drag { flex-shrink:0; width:22px; align-self:stretch; display:flex; align-items:center; justify-content:center; color:var(--on-surface-variant); opacity:.4; cursor:grab; touch-action:none; font-size:15px; line-height:1; user-select:none; }
  .drag:hover { opacity:.8; } .drag:active { cursor:grabbing; }
  .card > input[type=checkbox] { width:22px; height:22px; margin-top:1px; accent-color:var(--accent-line); cursor:pointer; flex-shrink:0; }
  .card .cal { width:22px; margin-top:1px; font-size:16px; text-align:center; flex-shrink:0; }
  .card .body { flex:1; min-width:0; }
  .card .title { font-size:15.5px; font-weight:600; line-height:1.5; word-break:break-word; }
  .card.done .title { text-decoration:line-through; text-decoration-color:var(--on-surface-variant); }
  .card .why { font-size:13px; color:var(--accent-strong); margin-top:.2rem; word-break:break-word; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .memo { font-size:13px; color:var(--on-surface-variant); margin-top:.15rem; white-space:pre-wrap; word-break:break-word; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card .meta { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; margin-top:.55rem; }
  .card .meta:empty { display:none; }
  .badge { font-size:11.5px; font-weight:600; border-radius:99px; padding:2.5px 10px; line-height:1.5; display:inline-flex; align-items:center; gap:4px; }
  .badge.due { background:var(--accent-lightest); color:var(--accent-strong); }
  .badge.due.over { background:var(--danger-soft); color:var(--danger); }
  .badge.when { background:var(--accent-lightest); color:var(--accent-strong); }
  .badge.soft { background:var(--surface-high); color:var(--on-surface-variant); }
  .badge.post { border:none; cursor:pointer; background:var(--accent-soft); color:var(--accent-ink); font-family:inherit; }
  .badge.post:hover { filter:brightness(1.05); }
  .card .acts { display:flex; align-items:center; gap:.1rem; flex-shrink:0; margin:-1px -3px 0 0; }
  .card .acts button { border:none; background:transparent; color:var(--on-surface-variant); width:30px; height:30px; border-radius:var(--r); font-size:15px; opacity:.55; transition:.12s; }
  .card:hover .acts button { opacity:1; }
  .card .acts button:hover { background:var(--surface-high); }
  .card .acts button.del:hover { background:var(--danger-soft); color:var(--danger); }

  .card.proj { flex-direction:column; align-items:stretch; gap:0; padding:1rem 1.05rem 1rem .7rem; }
  .proj-top { display:flex; align-items:flex-start; gap:.6rem; }
  .proj-top .body { flex:1; min-width:0; cursor:pointer; }
  .proj-top .prog { font-size:12px; font-weight:600; color:var(--on-surface-variant); margin-top:.3rem; }
  .proj-sub { margin:.8rem 0 0 1.9rem; display:flex; flex-direction:column; gap:.4rem; }
  .sub { display:flex; align-items:center; gap:.5rem; background:var(--surface-low); border-radius:var(--r); padding:.5rem .6rem; }
  .sub.done { opacity:.55; }
  .sub .drag { align-self:center; width:18px; font-size:13px; }
  .sub input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent-line); cursor:pointer; }
  .sub .st { flex:1; font-size:13.5px; min-width:0; word-break:break-word; }
  .sub.done .st { text-decoration:line-through; color:var(--on-surface-variant); }
  .sub .x { border:none; background:transparent; color:var(--on-surface-variant); opacity:.5; font-size:13px; width:24px; height:24px; border-radius:var(--r); }
  .sub .x:hover { background:var(--danger-soft); color:var(--danger); opacity:1; }
  .subadd { display:flex; gap:.4rem; margin-top:.2rem; }
  .subadd input { flex:1; background:var(--field); border:none; border-radius:var(--r); padding:8px 11px; font-family:inherit; font-size:13.5px; color:var(--on-surface); outline:none; }
  .subadd input:focus { outline:2px solid var(--accent-line); }
  .subadd button { border:none; background:var(--surface-high); color:var(--on-surface-variant); border-radius:var(--r); padding:0 13px; font-size:13px; font-weight:700; }

  .empty { background:var(--surface-low); border-radius:var(--r-lg); padding:3rem 1.4rem; text-align:center; color:var(--on-surface-variant); font-size:14px; line-height:1.8; }
  .empty .big { font-size:34px; margin-bottom:.5rem; }
  .empty b { color:var(--accent-strong); font-weight:700; }
  .soon { background:var(--surface-low); border-radius:var(--r-lg); padding:3.2rem 1.4rem; text-align:center; color:var(--on-surface-variant); }
  .soon .big { font-size:30px; margin-bottom:.6rem; }
  .soon .t { font-size:16px; font-weight:600; color:var(--on-surface); }
  .soon .d { font-size:13px; margin-top:.35rem; }
  .foot { text-align:center; font-size:11px; color:var(--on-surface-variant); opacity:.6; margin-top:2.5rem; }

  .ov { position:fixed; inset:0; z-index:60; background:rgba(42,36,49,.30); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:none; align-items:flex-end; justify-content:center; }
  .ov.on { display:flex; }
  @media (min-width:620px){ .ov { align-items:center; } }
  .sheet { width:100%; max-width:520px; background:var(--surface-lowest); border-radius:var(--r-lg) var(--r-lg) 0 0; box-shadow:0 -12px 40px rgba(80,40,70,.16); padding:1.5rem 1.4rem 1.6rem; max-height:92vh; overflow-y:auto; }
  @media (min-width:620px){ .sheet { border-radius:var(--r-lg); box-shadow:0 20px 60px rgba(80,40,70,.20); } }
  .sheet h3 { font-size:17px; font-weight:700; margin-bottom:1.2rem; }

  .seg { display:flex; gap:.3rem; background:var(--field); border-radius:99px; padding:.3rem; margin-bottom:1.3rem; }
  .seg button { flex:1; border:none; background:transparent; border-radius:99px; padding:9px; font-size:14px; font-weight:700; color:var(--on-surface-variant); transition:.12s; }
  .seg button.on { background:var(--surface-lowest); color:var(--accent-strong); box-shadow:var(--lift); }

  .fld { margin-bottom:1.1rem; }
  .fld label { display:block; font-size:10.5px; font-weight:700; letter-spacing:.12em; color:var(--on-surface-variant); margin-bottom:.5rem; }
  .fld input[type=text], .fld textarea, .fld input[type=date], .fld input[type=time] { width:100%; background:var(--field); border:none; border-radius:var(--r); padding:12px 14px; font-family:inherit; font-size:15px; color:var(--on-surface); outline:none; }
  .fld input:focus, .fld textarea:focus { outline:2px solid var(--accent-line); }
  .fld textarea { resize:vertical; min-height:64px; line-height:1.6; }
  .chips { display:flex; flex-wrap:wrap; gap:.4rem; }
  .chips button { border:none; background:var(--field); color:var(--on-surface-variant); border-radius:99px; padding:8px 14px; font-size:13px; font-weight:600; transition:.12s; }
  .chips button.on { background:var(--grad); color:var(--accent-ink); }
  .row { display:flex; gap:.6rem; margin-top:1.4rem; }
  .row button { flex:1; border:none; border-radius:var(--r); padding:13px; font-size:14.5px; font-weight:700; }
  .cancel { background:var(--surface-high); color:var(--on-surface-variant); }
  .save { background:var(--grad); color:var(--accent-ink); box-shadow:var(--lift); }
  .save:disabled { opacity:.45; box-shadow:none; }
  .hide { display:none !important; }
</style>
</head>
<body>

<div id="gate">
  <div class="mark">🔒</div>
  <h1>김비서 v3</h1>
  <p>비밀번호를 넣어주세요</p>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="unlock" type="button">열기</button>
  <div class="msg" id="gatemsg"></div>
</div>

<div id="app" style="display:none">
  <div class="topbar"><div class="inner">
    <div class="brand">김비서 v3<small>내가 기록한다</small></div>
    <div id="savedot"></div>
    <button id="restorebtn" type="button" title="이전 상태로 되돌리기">⟲ 복원</button>
  </div></div>
  <div class="wrap">
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="money">돈관리</button>
      <button type="button" data-tab="work">업무</button>
      <button type="button" data-tab="personal">개인</button>
      <button type="button" data-tab="marketing">마케팅</button>
    </nav>
    <div id="view"></div>
    <p class="foot">eonfl.com/note3 · 김비서 v3</p>
  </div>
</div>

<!-- 입력 폼 -->
<div class="ov" id="ov"><div class="sheet">
  <h3 id="shtitle">새 할일</h3>

  <div class="fld"><label id="lbl_title">제목</label>
    <input type="text" id="f_title" autocomplete="off"></div>

  <div class="fld" id="blk_pkind"><label>종류</label>
    <div class="chips" id="f_pkind">
      <button type="button" data-v="task" class="on">✅ 할일</button>
      <button type="button" data-v="appt">📅 약속</button>
      <button type="button" data-v="routine">🔁 루틴</button>
      <button type="button" data-v="goal">🎯 목표</button>
    </div>
  </div>

  <div class="fld" id="blk_bucket"><label>성격 <span style="font-weight:400;letter-spacing:0">· 안 고르면 단발</span></label>
    <div class="chips" id="f_bucket">
      <button type="button" data-v="quick" class="on">⚡ 단발</button>
      <button type="button" data-v="deadline">📌 약속·마감</button>
      <button type="button" data-v="recurring">🔁 반복</button>
      <button type="button" data-v="someday">💤 백로그</button>
      <button type="button" data-v="project">📚 프로젝트</button>
    </div>
  </div>

  <div class="fld" id="blk_why"><label>왜 필요한지 (선택)</label>
    <textarea id="f_why" placeholder="이게 왜 필요한지 — 나중에 AI가 이걸 보고 판단해요."></textarea></div>

  <div id="blk_ptask">
    <div class="fld"><label>기한</label>
      <div class="chips" id="f_chip" style="margin-bottom:.6rem">
        <button type="button" data-v="">없음</button>
        <button type="button" data-v="asap">최대한 빨리</button>
        <button type="button" data-v="1-2d">하루이틀 이내</button>
        <button type="button" data-v="1w">일주일 이내</button>
      </div>
      <input type="date" id="f_date"></div>
  </div>

  <div id="blk_appt">
    <div class="fld"><label>날짜</label>
      <div class="rangerow"><input type="date" id="a_date"><span class="tilde">~</span><input type="date" id="a_date2"></div>
      <div class="hint">끝 날짜는 여러 날 걸치는 일정일 때만 (선택)</div>
    </div>
    <div class="fld"><label>시간</label>
      <div class="chips" id="a_tbd" style="margin-bottom:.6rem">
        <button type="button" data-v="" class="on">시간 지정</button>
        <button type="button" data-v="tbd">시간 미정</button>
      </div>
      <div class="rangerow" id="a_timewrap"><input type="time" id="a_time"><span class="tilde">~</span><input type="time" id="a_time2"></div>
    </div>
    <div class="fld"><label>누구랑 (선택)</label><input type="text" id="a_who" placeholder="예: 남편" autocomplete="off"></div>
    <div class="fld"><label>장소 (선택)</label><input type="text" id="a_place" placeholder="예: CGV 강남" autocomplete="off"></div>
  </div>

  <div id="blk_wdue">
    <div class="fld"><label>누구랑 / 무슨 약속</label><input type="text" id="w_who" placeholder="예: 김OO 학생 / OO업체 납품" autocomplete="off"></div>
    <div class="fld"><label>날짜</label><input type="date" id="w_due"></div>
    <div class="fld"><label>시간 (선택)</label><input type="time" id="w_time"></div>
  </div>

  <div id="blk_recur">
    <div class="fld"><label>매주 언제 (선택)</label>
      <div class="chips" id="f_wday">
        <button type="button" data-v="daily">매일</button>
        <button type="button" data-v="" class="on">정함 없음</button>

const enc = new TextEncoder(), dec = new TextDecoder();
async function keyFrom(pw, salt) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt, iterations:200000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function b64e(b){ let s=""; new Uint8Array(b).forEach(c=>s+=String.fromCharCode(c)); return btoa(s); }
async function lock(pw, obj) {
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await keyFrom(pw, salt);
  const ct=await crypto.subtle.encrypt({ name:"AES-GCM", iv }, k, enc.encode(JSON.stringify(obj)));
  const out=new Uint8Array(28+ct.byteLength); out.set(salt,0); out.set(iv,16); out.set(new Uint8Array(ct),28); return b64e(out);
}
async function unlockText(pw, blob) {
  const raw=b64d(blob); const k=await keyFrom(pw, raw.slice(0,16));
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:raw.slice(16,28) }, k, raw.slice(28))));
}

let PW=null, STORE=null, saveTimer=null, storeSrc="local";

const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const shiftDay = (s,n) => { const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function goalStreak(claimed){ if(!claimed||!claimed.length) return 0; const set=new Set(claimed); let d = set.has(todayStr()) ? todayStr() : claimed.slice().sort().pop(); let n=0; while(set.has(d)){ n++; d=shiftDay(d,-1); } return n; }
const nowHM = () => { const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
function setDot(ok,msg){ const d=$("savedot"); d.textContent=msg; d.className=ok?"":"bad"; }
const CHIP = { asap:"최대한 빨리", "1-2d":"하루이틀 이내", "1w":"일주일 이내" };
function dueLabel(it){

  if (it.due){ const d=new Date(it.due+"T12:00:00"); return { text:(d.getMonth()+1)+"월 "+d.getDate()+"일", over:it.due<todayStr() && !it.done }; }
  return null;
}
function fmtD(s){ const d=new Date(s+"T12:00:00"); return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DOW[d.getDay()]+")"; }
function fmtT(t){ const p=t.split(":"),H=+p[0],ap=H<12?"오전":"오후",h=H%12||12; return ap+" "+h+":"+p[1]; }
function apptWhen(it){
  let s;
  if(it.date){ s=fmtD(it.date); if(it.endDate && it.endDate!==it.date) s+=" ~ "+fmtD(it.endDate); }
  else s="날짜 미정";
  if(it.timeTBD) s+=" · 시간 미정";
  else if(it.time){ s+=" · "+fmtT(it.time); if(it.endTime && it.endTime!==it.time) s+=" ~ "+fmtT(it.endTime); }
  return s;
}
function apptPast(it){
  const endD = it.endDate || it.date; if(!endD) return false; const t=todayStr();
  if(endD<t) return true;
  if(endD===t && !it.timeTBD){ const endT=it.endTime||it.time; if(endT) return endT<nowHM(); }
  return false;
}
const postBtn = '<button class="badge post" type="button" data-act="postpone">📅 미루기</button>';
function deadlineWhen(it){ if(!it.due) return ""; const d=new Date(it.due+"T12:00:00"); let s=(d.getMonth()+1)+"월 "+d.getDate()+"일"; if(it.dtime){ const p=it.dtime.split(":"),H=+p[0],ap=H<12?"오전":"오후",h=H%12||12; s+=" "+ap+" "+h+":"+p[1]; } return s; }
function recurLabel(it){ if(it.wday==="daily") return "매일"; if(it.wday!=="" && it.wday!=null) return "매주 "+DOW[+it.wday]; return "반복"; }
/* 완료한 것: 오늘 완료(눈에 띄게 남김) vs 지난 완료(접힌 아카이브). doneAt=완료한 날, swept='지금 정리'로 넘긴 것 */
const freshDone = it => !!it.done && !it.swept && it.doneAt===todayStr();
const oldDone   = it => !!it.done && (it.swept || it.doneAt!==todayStr());

async function pullCloud(){
  try { const r=await fetch(SB+"?id=eq.main&select=data",{headers:HDR,cache:"no-store"}); if(r.ok){ const j=await r.json(); return { reachable:true, blob:(Array.isArray(j)&&j.length?j[0].data:null) }; } } catch(e){}
  return { reachable:false, blob:null };
}
async function pushBlob(blob){
  localStorage.setItem(LSKEY, blob);
  try { const r=await fetch(SB+"?on_conflict=id",{method:"POST",headers:Object.assign({},HDR,{"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify({id:"main",data:blob})}); if(r.ok){ storeSrc="sb"; return; } } catch(e){}
  storeSrc="local";
}
async function pushState(){
  if(!STORE||!PW) return;
  try {
    STORE.updated=new Date().toLocaleString("ko-KR");
    const blob=await lock(PW,STORE);
    await pushBlob(blob);
    setDot(true,"저장됨 "+(storeSrc==="local"?"· 이 기기":"· 동기화"));
    if(storeSrc==="sb"){ const now=Date.now(); if(now-lastSnapMs>=SNAP_MIN_MS){ lastSnapMs=now; writeSnapshot(blob); } }
  } catch(e){ setDot(false,"저장 안 됨"); }
}
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(pushState,500); }
function blankStore(){ return { v:3, personal:[], work:{ quick:[], deadline:[], recurring:[], someday:[], project:[] }, marketing:[], money:{} }; }
function normalizeStore(){
  if(!Array.isArray(STORE.personal)) STORE.personal=[];
  if(!Array.isArray(STORE.marketing)) STORE.marketing=[];
  if(Array.isArray(STORE.work)){ const old=STORE.work; STORE.work={ quick:[],deadline:[],recurring:[],someday:[],project:[] }; old.forEach(x=>STORE.work.quick.push(Object.assign({ bucket:"quick" }, x))); }
  else if(!STORE.work || typeof STORE.work!=="object"){ STORE.work={}; }

/* ── 자동 버전 스냅샷 (별도 행 snap-<시각>, 최근 SNAP_KEEP개 유지) ── */
const SNAP_KEEP=30, SNAP_MIN_MS=90000;   // 최소 90초 간격
let lastSnapMs=0;
async function writeSnapshot(blob){
  try {
    await fetch(SB, { method:"POST", headers:Object.assign({},HDR,{"Prefer":"return=minimal"}), body:JSON.stringify({ id:"snap-"+Date.now(), data:blob }) });
    const r=await fetch(SB+"?id=like.snap-*&select=id&order=id.desc",{headers:HDR,cache:"no-store"});
    if(r.ok){ const rows=await r.json(); if(Array.isArray(rows)&&rows.length>SNAP_KEEP){ const del=rows.slice(SNAP_KEEP).map(x=>x.id); if(del.length) await fetch(SB+"?id=in.("+del.join(",")+")",{method:"DELETE",headers:HDR}); } }
  } catch(e){}
}

async function tryUnlock(pw){ try { const t=await unlockText(pw,VERIFIER); if(t&&t.ok==="note3") return {ok:true}; } catch(e){} return {ok:false}; }
$("unlock").addEventListener("click", doUnlock);

}
async function loadStore(){
  const cloud=await pullCloud(); const local=localStorage.getItem(LSKEY);

  if(cloud.reachable){ if(cloud.blob){ blob=cloud.blob; storeSrc="sb"; } else if(local){ blob=local; storeSrc="sb"; migrate=true; } else { storeSrc="sb"; } }

  if(blob){ try { STORE=Object.assign(blankStore(), await unlockText(PW,blob)); } catch(e){} }

}

/* 드래그 정렬 (보이는 것만 재정렬, 안 보이는 것은 뒤에 그대로 유지) */
function enableDrag(container, arr, onDone){
  container.querySelectorAll(":scope > [data-id] > .drag, :scope > [data-id] > .proj-top > .drag").forEach(handle=>{
    handle.addEventListener("pointerdown", e=>{
      e.preventDefault(); const card=handle.closest("[data-id]"); if(!card) return;
      try { handle.setPointerCapture(e.pointerId); } catch(_){}   // 모든 이동 이벤트를 핸들로 (contenteditable 등이 가로채지 못하게)
      card.classList.add("dragging"); document.body.classList.add("dragging-lock"); let moved=false;
      const move=ev=>{ ev.preventDefault(); moved=true; const others=[...container.querySelectorAll(":scope > [data-id]:not(.dragging)")]; let placed=false;
        for(const o of others){ const r=o.getBoundingClientRect(); if(ev.clientY < r.top+r.height/2){ container.insertBefore(card,o); placed=true; break; } } if(!placed) container.appendChild(card); };
      const up=()=>{ handle.removeEventListener("pointermove",move); handle.removeEventListener("pointerup",up); handle.removeEventListener("pointercancel",up);
        card.classList.remove("dragging"); document.body.classList.remove("dragging-lock");
        if(moved){ const ids=[...container.querySelectorAll(":scope > [data-id]")].map(c=>c.dataset.id);
          const inDom=ids.map(id=>arr.find(x=>x.id===id)).filter(Boolean); const rest=arr.filter(x=>!ids.includes(x.id));
          arr.length=0; arr.push(...inDom, ...rest); if(onDone) onDone(); else { save(); render(); } } };
      handle.addEventListener("pointermove",move); handle.addEventListener("pointerup",up); handle.addEventListener("pointercancel",up);
    });
  });
}

  if(archived.length) html += '<div class="fold">'+foldHeader("pdone","✓","완료·지난 것", archived.length)+(fold.pdone?'<div class="fold-body"><div class="list donelist">'+archived.map(personalCard).join("")+'</div></div>':'')+'</div>';
  return html;
}
function goalCard(g){
  const claimed = Array.isArray(g.claimed)?g.claimed:[]; const target = g.target||30; const n = Math.min(claimed.length, target);
  const doneAll = claimed.length>=target; const claimedToday = claimed.includes(todayStr()); const streak = goalStreak(claimed);
  let dots=""; for(let i=0;i<target;i++){ dots += '<span class="sticker'+(i<n?" on":"")+'">'+(i<n?"⭐":"")+'</span>'; }
  return '<div class="card goal" data-id="'+g.id+'"><div class="goal-top">'+dragH+
    '<div class="body"><div class="title">🎯 '+esc(g.title)+(doneAll?' <span class="badge soft">🎉 달성</span>':'')+'</div>'+
    (g.memo?'<div class="memo">'+esc(g.memo)+'</div>':'')+
    '<div class="goal-prog">'+claimed.length+'/'+target+(streak>1?' · 🔥 '+streak+'일 연속':'')+'</div></div>'+actsH+'</div>'+
    '<div class="stickers">'+dots+'</div>'+
    (doneAll?'':'<button class="goal-claim'+(claimedToday?' claimed':'')+'" type="button" data-act="claim"'+(claimedToday?' disabled':'')+'>'+(claimedToday?'오늘 완료 ✓':'오늘 스티커 붙이기 ⭐')+'</button>')+
    '</div>';
}

const WMETA = { quick:{ic:"⚡",name:"단발"}, deadline:{ic:"📌",name:"약속·마감"}, project:{ic:"📚",name:"프로젝트"}, someday:{ic:"💤",name:"백로그"} };
function workView(){
  let html='<div class="vhead"><span class="t">업무</span><button class="addbtn" id="wadd" type="button">+ 추가</button></div>';
  ["quick","deadline","project","someday"].forEach(k=>{ html += sectionHtml(k); });
  // 오늘 한 것 (완료해도 오늘은 눈에 띄게)
  html += todaySection(["quick","deadline","someday"].flatMap(k=>STORE.work[k].filter(freshDone)), workCard, "work");
  // 반복: 별도 접이식 참고 목록 (그날 뜨는 건 나중에 캘린더에서)
  const rec=STORE.work.recurring;
  html += '<div class="fold">'+foldHeader("recur","🔁","반복 업무", rec.length, "recurring")+(fold.recur?'<div class="fold-body">'+(rec.length?'<div class="list" data-bucket="recurring">'+rec.map(recurCard).join("")+'</div>':'<div class="wsec-empty">등록된 반복 업무가 없어요.</div>')+'</div>':'')+'</div>';
  // 완료·지난 것 (지난 완료만)
  const done = ["quick","deadline","someday"].flatMap(k=>STORE.work[k].filter(oldDone));
  if(done.length) html += '<div class="fold">'+foldHeader("wdone","✓","완료·지난 것", done.length)+(fold.wdone?'<div class="fold-body"><div class="list donelist">'+done.map(workCard).join("")+'</div></div>':'')+'</div>';
  return html;
}
function sectionHtml(key){
  const meta=WMETA[key], arr=STORE.work[key];
  const items = key==="project" ? arr : arr.filter(x=>!x.done);
  const h='<div class="wsec-h"><span class="ic">'+meta.ic+'</span>'+esc(meta.name)+'<span class="n">'+items.length+'</span><button class="secadd" type="button" data-add="'+key+'">+</button></div>';
  if(!items.length) return '<div class="wsec">'+h+'<div class="wsec-empty">비어 있음</div></div>';
  const cards = key==="project" ? items.map(projectCard).join("") : items.map(workCard).join("");
  return '<div class="wsec">'+h+'<div class="list" data-bucket="'+key+'">'+cards+'</div></div>';
}
function workCard(it){
  const b=it.bucket; let meta="";
  if(b==="deadline"){ const w=deadlineWhen(it), over=it.due&&it.due<todayStr()&&!it.done; if(w) meta+='<span class="badge due'+(over?' over':'')+'">📅 '+esc(w)+'</span>'; if(it.who) meta+='<span class="badge soft">🧑 '+esc(it.who)+'</span>'; if(over) meta+=postBtn; }
  else if(b==="someday" && it.hope){ meta='<span class="badge soft">💤 '+esc(HOPE[it.hope]||"")+'</span>'; }
  return '<div class="card'+(it.done?' done':'')+'" data-id="'+it.id+'">'+dragH+'<input type="checkbox" '+(it.done?'checked':'')+' data-act="done"><div class="body"><div class="title">'+esc(it.title)+'</div>'+(it.why?'<div class="why">'+esc(it.why)+'</div>':'')+(it.memo?'<div class="memo">'+esc(it.memo)+'</div>':'')+'<div class="meta">'+meta+'</div></div>'+actsH+'</div>';
}
function recurCard(it){
  return '<div class="card" data-id="'+it.id+'">'+dragH+'<div class="cal">🔁</div><div class="body"><div class="title">'+esc(it.title)+'</div>'+(it.memo?'<div class="memo">'+esc(it.memo)+'</div>':'')+'<div class="meta"><span class="badge when">🔁 '+esc(recurLabel(it))+'</span></div></div>'+actsH+'</div>';
}
function projectCard(p){
  const subs=p.subtasks||[]; const doneN=subs.filter(s=>s.done).length; const open=openProjects.has(p.id);
  let html='<div class="card proj" data-id="'+p.id+'"><div class="proj-top">'+dragH+'<div class="body" data-act="toggle"><div class="title">📚 '+esc(p.title)+'</div>'+(p.desc?'<div class="memo">'+esc(p.desc)+'</div>':'')+(p.hope?'<div class="meta"><span class="badge soft">⏳ '+esc(HOPE[p.hope]||"")+'</span></div>':'')+'<div class="prog">서브태스크 '+doneN+'/'+subs.length+(open?' ▾':' ▸')+'</div></div>'+actsH+'</div>';
  if(open){
    html+='<div class="proj-sub" data-proj="'+p.id+'">';
    html+=subs.map(s=>'<div class="sub'+(s.done?' done':'')+'" data-id="'+s.id+'"><span class="drag">⋮⋮</span><input type="checkbox" '+(s.done?'checked':'')+' data-sub="done"><span class="st" contenteditable="true" spellcheck="false">'+esc(s.title)+'</span><button class="x" type="button" data-sub="del">🗑</button></div>').join("");
    html+='<div class="subadd"><input type="text" placeholder="서브태스크 추가" data-subinput="'+p.id+'"><button type="button" data-subadd="'+p.id+'">추가</button></div></div>';
  }
  return html+'</div>';
}
function findWork(id){ for(const k of ["quick","deadline","recurring","someday","project"]){ const i=STORE.work[k].findIndex(x=>x.id===id); if(i>=0) return { bucket:k, arr:STORE.work[k], i }; } return null; }
function wireWork(){
  const add=$("wadd"); if(add) add.addEventListener("click", ()=>openForm({tab:"work", type:"quick", id:null}));
  document.querySelectorAll("#view .card").forEach(card=>{
    const id=card.dataset.id;
    card.querySelectorAll("[data-act]").forEach(el=> el.addEventListener("click", ()=>actWork(id, el.dataset.act)));
    card.querySelectorAll("[data-sub]").forEach(el=>{ const sub=el.closest("[data-id]"); const sid=sub.dataset.id; el.addEventListener("click", ()=>actSub(id, sid, el.dataset.sub)); });
    const si=card.querySelector("[data-subinput]"); if(si) si.addEventListener("keydown", e=>{ if(e.key==="Enter") addSub(id, si.value, si); });
    const sb=card.querySelector("[data-subadd]"); if(sb) sb.addEventListener("click", ()=>{ const inp=card.querySelector("[data-subinput]"); addSub(id, inp.value, inp); });
    card.querySelectorAll(".proj-sub .sub .st").forEach(st=>{
      const sid=st.closest("[data-id]").dataset.id;
      st.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); st.blur(); } });
      st.addEventListener("blur", ()=>{ const p=STORE.work.project.find(x=>x.id===id); if(!p) return; const s=(p.subtasks||[]).find(x=>x.id===sid); if(!s) return; const v=st.textContent.trim(); if(v && v!==s.title){ s.title=v; save(); } else if(!v){ st.textContent=s.title; } });
    });
    const subwrap=card.querySelector(".proj-sub"); if(subwrap){ const p=STORE.work.project.find(x=>x.id===id); if(p) enableDrag(subwrap, p.subtasks); }
  });
  document.querySelectorAll("#view .list[data-bucket]").forEach(list=>{ enableDrag(list, STORE.work[list.dataset.bucket]); });
  wireFolds();

function actWork(id, act){
  const f=findWork(id); if(!f) return; const { arr, i, bucket }=f; const it=arr[i];
  if(act==="done"){ it.done=!it.done; if(it.done){ it.doneAt=todayStr(); it.swept=false; } else { it.doneAt=""; it.swept=false; } it.updated=Date.now(); }
  else if(act==="toggle"){ if(openProjects.has(id)) openProjects.delete(id); else openProjects.add(id); }
  else if(act==="edit" || act==="postpone"){ openForm({tab:"work", type:bucket, id}); return; }
  else if(act==="del"){ if(!confirm('이 항목을 지웁니다.\n\n"'+it.title+'"\n\n계속할까요?')) return; arr.splice(i,1); openProjects.delete(id); }
  else return;
  save(); render();
}
function actSub(pid, sid, act){
  const p=STORE.work.project.find(x=>x.id===pid); if(!p) return; const subs=p.subtasks||[]; const i=subs.findIndex(s=>s.id===sid); if(i<0) return;
  if(act==="done") subs[i].done=!subs[i].done; else if(act==="del") subs.splice(i,1);
  save(); render();
}
function addSub(pid, title, inp){
  title=(title||"").trim(); if(!title) return;
  const p=STORE.work.project.find(x=>x.id===pid); if(!p) return;
  if(!Array.isArray(p.subtasks)) p.subtasks=[];
  p.subtasks.push({ id:uid(), title, done:false });
  if(inp) inp.value=""; save(); render();
}

  else { const names={ task:"할일", appt:"약속", routine:"루틴", goal:"목표" }; $("shtitle").textContent = (curCtx.id?"수정 · ":"새 ")+names[type]; }
}

function findItem(ctx){ return ctx.tab==="personal" ? STORE.personal.find(x=>x.id===ctx.id) : STORE.work[ctx.type].find(x=>x.id===ctx.id); }
function openForm(ctx){
  curCtx={ tab:ctx.tab, type:ctx.type, id:ctx.id||null, origType:ctx.type };
  const it = ctx.id ? findItem(ctx) : null;
  $("f_title").value = it ? it.title : "";
  $("f_why").value = it && it.why ? it.why : "";
  $("f_memo").value = it ? (it.memo||it.desc||"") : "";
  pickChip = it && it.dueChip ? it.dueChip : ""; $("f_date").value = it && it.type==="task" && it.due && !it.dueChip ? it.due : ""; selChips($("f_chip"), pickChip);
  $("a_date").value = it && it.date ? it.date : ""; $("a_date2").value = it && it.endDate ? it.endDate : "";
  pickTbd = it && it.timeTBD ? "tbd" : ""; $("a_time").value = it && it.time ? it.time : ""; $("a_time2").value = it && it.endTime ? it.endTime : ""; $("a_timewrap").style.display = pickTbd==="tbd"?"none":"flex"; selChips($("a_tbd"), pickTbd);
  $("a_who").value = it && ctx.tab==="personal" && it.who ? it.who : ""; $("a_place").value = it && it.place ? it.place : "";
  $("w_who").value = it && ctx.tab==="work" && it.who ? it.who : "";
  $("w_due").value = it && ctx.type==="deadline" && it.due ? it.due : "";
  $("w_time").value = it && ctx.type==="deadline" && it.dtime ? it.dtime : "";
  pickWday = it && (ctx.type==="recurring"||ctx.type==="routine") && it.wday!=null ? String(it.wday) : ""; selChips($("f_wday"), pickWday);
  pickHope = it && (ctx.type==="someday"||ctx.type==="project") && it.hope ? it.hope : ""; selChips($("f_hope"), pickHope);
  $("g_target").value = it && ctx.type==="goal" && it.target ? it.target : "";
  draftSubs = (ctx.type==="project" && it && Array.isArray(it.subtasks)) ? it.subtasks.map(s=>({ id:s.id||uid(), title:s.title, done:!!s.done })) : [];

$("ov").addEventListener("click", e=>{ if(e.target===$("ov")) closeForm(); });
$("shsave").addEventListener("click", saveForm);
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("ov").classList.contains("on")) closeForm(); });

function buildItem(){
  const {tab,type}=curCtx, title=$("f_title").value.trim(), why=$("f_why").value.trim(), memo=$("f_memo").value.trim(), now=Date.now();
  if(tab==="personal"){
    if(type==="appt") return { type:"appt", title, memo, date:$("a_date").value, endDate:$("a_date2").value, time:pickTbd==="tbd"?"":$("a_time").value, endTime:pickTbd==="tbd"?"":$("a_time2").value, timeTBD:pickTbd==="tbd", who:$("a_who").value.trim(), place:$("a_place").value.trim(), updated:now };
    if(type==="routine") return { type:"routine", title, memo, wday:pickWday, updated:now };
    if(type==="goal") return { type:"goal", title, memo, target:(+$("g_target").value||30), updated:now };
    return { type:"task", title, why, memo, dueChip:pickChip, due:pickChip?"":$("f_date").value, updated:now };
  }
  if(type==="quick") return { bucket:"quick", title, memo, updated:now };
  if(type==="deadline") return { bucket:"deadline", title, memo, who:$("w_who").value.trim(), due:$("w_due").value, dtime:$("w_time").value, updated:now };
  if(type==="recurring") return { bucket:"recurring", title, memo, wday:pickWday, updated:now };
  if(type==="someday") return { bucket:"someday", title, memo, hope:pickHope, updated:now };
  if(type==="project") return { bucket:"project", title, desc:memo, hope:pickHope, subtasks:draftSubs.map(s=>({ id:s.id, title:s.title, done:!!s.done })), updated:now };
}
const KEYS = ["why","dueChip","due","date","endDate","time","endTime","timeTBD","who","place","dtime","wday","hope","target","memo","desc"];
function saveForm(){
  if($("shsave").disabled) return;
  const data=buildItem();
  if(curCtx.id){
    if(curCtx.tab==="work" && curCtx.type!==curCtx.origType){
      const from=STORE.work[curCtx.origType], i=from.findIndex(x=>x.id===curCtx.id);
      const old = i>=0 ? from.splice(i,1)[0] : {};
      const merged=Object.assign({ id:curCtx.id, created:old.created||Date.now() }, data);
      if(curCtx.type==="project" && !Array.isArray(merged.subtasks)) merged.subtasks=old.subtasks||[];
      if(["quick","deadline","someday"].includes(curCtx.type)) merged.done=old.done||false;
      STORE.work[curCtx.type].unshift(merged); openProjects.delete(curCtx.id);
    } else {
      const arr = curCtx.tab==="personal" ? STORE.personal : STORE.work[curCtx.type];
      const it=arr.find(x=>x.id===curCtx.id);
      if(it){ KEYS.forEach(k=>delete it[k]); Object.assign(it, data); }
    }
  } else {
    const base={ id:uid(), created:Date.now() };
    if(curCtx.tab==="personal" || ["quick","deadline","someday"].includes(curCtx.type)) base.done=false;
    if(curCtx.type==="project") base.subtasks=[];
    if(curCtx.tab==="personal" && curCtx.type==="goal") base.claimed=[];
    const arr = curCtx.tab==="personal" ? STORE.personal : STORE.work[curCtx.type];
    arr.unshift(Object.assign(base, data));
  }
  closeForm(); save(); render();
}

  $("restore").classList.add("on");
  const box=$("restorelist"); box.innerHTML='<div class="wsec-empty">불러오는 중…</div>';
  fetch(SB+"?id=like.snap-*&select=id&order=id.desc&limit=50",{headers:HDR,cache:"no-store"})
    .then(r=>r.ok?r.json():Promise.reject()).then(rows=>{
      if(!Array.isArray(rows)||!rows.length){ box.innerHTML='<div class="wsec-empty">아직 저장된 시점이 없어요. 기록을 저장하면 자동으로 쌓여요.</div>'; return; }
      box.innerHTML=rows.map(x=>{ const ms=+String(x.id).replace("snap-",""); const lab=isNaN(ms)?x.id:new Date(ms).toLocaleString("ko-KR"); return '<div class="snap-row"><span>'+esc(lab)+'</span><button type="button" class="snap-restore" data-snap="'+esc(x.id)+'">이 상태로</button></div>'; }).join("");
      box.querySelectorAll(".snap-restore").forEach(b=> b.addEventListener("click", ()=>restoreTo(b.dataset.snap)));
    }).catch(()=>{ box.innerHTML='<div class="wsec-empty">불러오지 못했어요 (인터넷 확인).</div>'; });
}
async function restoreTo(snapId){
  if(!confirm("이 시점 상태로 전체를 되돌립니다.\n지금 상태도 스냅샷으로 남겨두니 다시 되돌릴 수 있어요.\n\n계속할까요?")) return;
  try { await writeSnapshot(await lock(PW,STORE)); } catch(e){}
  let obj=null;
  try { const r=await fetch(SB+"?id=eq."+encodeURIComponent(snapId)+"&select=data",{headers:HDR,cache:"no-store"}); const j=await r.json(); obj=await unlockText(PW, j&&j[0]&&j[0].data); }
  catch(e){ alert("복원할 데이터를 못 열었어요."); return; }
  STORE=Object.assign(blankStore(), obj); normalizeStore();
  $("restore").classList.remove("on");
  await pushState(); render(); setDot(true,"복원됨 ✓");
}

async function start(){ setDot(true,"여는 중…"); await loadStore(); render(); setDot(true,"준비됨"); }
(async ()=>{
  const saved=localStorage.getItem(PWKEY);
  if(saved){ const r=await tryUnlock(saved); if(r.ok){ PW=saved; $("gate").style.display="none"; $("app").style.display=""; await start(); return; } localStorage.removeItem(PWKEY); }
  $("pw").focus();
})();
</script>
