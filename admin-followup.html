  <title>후속메일 관리</title>
  <style>
    :root{font-family:Arial,"Noto Sans KR",sans-serif;color:#1d2433;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1120px;margin:auto;padding:28px 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.card{background:#fff;border:1px solid #dfe4ee;border-radius:14px;padding:20px;box-shadow:0 6px 22px #1b29400d}.auth{max-width:520px;margin:56px auto}.hidden{display:none!important}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px;border:1px solid #b9c1d0;border-radius:8px}textarea{min-height:240px;line-height:1.55}button{border:0;border-radius:8px;padding:10px 14px;background:#1f5eea;color:#fff;cursor:pointer}button.secondary{background:#e9edf5;color:#26334a}button.danger{background:#b42318}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0}.tab{white-space:nowrap;background:#e9edf5;color:#26334a}.tab.active{background:#1f5eea;color:#fff}.status{padding:10px 12px;border-radius:8px;background:#eef3ff;margin:12px 0}.error{background:#fff0ef;color:#9c1c13}.item{margin:12px 0}.item h3{margin:0 0 5px;font-size:17px}.meta{font-size:13px;color:#5c667a;line-height:1.55}.body{white-space:pre-wrap;background:#f8f9fc;padding:12px;border-radius:8px;max-height:240px;overflow:auto;margin:12px 0}.switch{display:flex;align-items:center;gap:9px}.switch input{width:auto}.empty{padding:36px;text-align:center;color:#6b7280}.metrics{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin:12px 0}.metric{background:#eef3ff;border-radius:10px;padding:14px}.metric strong{display:block;font-size:24px;color:#1f5eea;margin-top:5px}.dialog{position:fixed;inset:0;background:#16213a88;display:grid;place-items:center;padding:18px}.dialog>.card{width:min(760px,100%);max-height:92vh;overflow:auto}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.shell{padding:18px 12px}.metrics{grid-template-columns:repeat(2,minmax(120px,1fr))}}

<body>
  <main class="shell">
    <section id="authPanel" class="card auth">
      <h1>후속메일 관리</h1>
      <p>대표 이메일로 받은 6자리 인증번호를 입력해 주세요.</p>
      <div id="authStatus" class="status hidden"></div>
      <div id="emailStep">
        <label for="email">대표 이메일</label><input id="email" type="email" autocomplete="email">
        <button id="sendCode" style="margin-top:12px">인증번호 받기</button>
      </div>
      <div id="codeStep" class="hidden">
        <label for="code">6자리 인증번호</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
        <div class="row" style="margin-top:12px"><button id="verifyCode">확인</button><button id="changeEmail" class="secondary">이메일 다시 입력</button></div>
      </div>
    </section>

    <section id="adminPanel" class="hidden">
      <div class="top"><div><h1>후속메일 관리</h1><div id="account" class="meta"></div></div><div class="row"><label class="switch"><input id="sendLock" type="checkbox" disabled>자동 발송 잠금</label><button id="refresh" class="secondary">새로고침</button><button id="logout" class="secondary">로그아웃</button></div></div>
      <div id="adminStatus" class="status hidden"></div>
      <nav id="tabs" class="tabs"></nav>
      <section id="list"></section>
    </section>
  </main>
  <section id="editor" class="dialog hidden" aria-modal="true" role="dialog">
    <div class="card"><h2>편지 수정</h2><label for="editSubject">제목</label><input id="editSubject"><label for="editBody">본문</label><textarea id="editBody"></textarea><div class="row"><button id="saveEdit">저장하고 다시 검사</button><button id="closeEdit" class="secondary">닫기</button></div></div>
  </section>
  <section id="cancelDialog" class="dialog hidden" aria-modal="true" role="dialog">
    <div class="card"><h2>발송 취소</h2><div id="cancelStatus" class="status hidden"></div><label for="cancelReason">취소 이유</label><textarea id="cancelReason" style="min-height:120px"></textarea><div class="row"><button id="confirmCancel" class="danger">취소 확정</button><button id="closeCancel" class="secondary">닫기</button></div></div>
  </section>
  <script src="./vendor/supabase-2.116.0.js"></script>
  <script>
  (()=>{'use strict';
    const $=(id)=>document.getElementById(id),cfg=(name)=>document.querySelector(`meta[name="${name}"]`)?.content||'';
    const configuration={url:cfg('supabase-url'),anon:cfg('supabase-anon-key'),edge:cfg('followup-edge-url')};
    if(Object.values(configuration).some((v)=>!v||v.startsWith('__'))){$('authStatus').textContent='관리자 연결 설정이 아직 준비되지 않았습니다.';$('authStatus').className='status error';return;}
    const client=window.supabase.createClient(configuration.url,configuration.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    const tabDefs=[['scheduled,awaiting_review','발송예정'],['held','검사보류'],['failed','실패'],['skipped,canceled','제외'],['logs','관리기록'],['sent','발송·성과']];
    let session=null,data=null,currentTab='scheduled,awaiting_review',editing=null,canceling=null,actionInFlight=false;
    let sessionGeneration=0,loadSequence=0,pendingRevision=null;
    const status=(id,text,error=false)=>{const el=$(id);el.textContent=text||'';el.className=text?`status${error?' error':''}`:'status hidden'};
    const clearPrivate=()=>{data=null;editing=null;canceling=null;pendingRevision=null;$('list').replaceChildren();$('editor').classList.add('hidden');$('cancelDialog').classList.add('hidden');$('editSubject').value='';$('editBody').value='';$('cancelReason').value='';status('cancelStatus','');$('account').textContent='';$('sendLock').checked=false;$('sendLock').indeterminate=false;$('sendLock').disabled=true};
    const showAuth=()=>{$('adminPanel').classList.add('hidden');$('authPanel').classList.remove('hidden');clearPrivate()};
    const showAdmin=()=>{$('authPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');$('account').textContent=session?.user?.email||''};
    const requestId=()=>crypto.randomUUID();
    const staleError=()=>Object.assign(new Error('stale response'),{stale:true});
    function expireSession(message='로그인이 만료되었습니다. 인증번호를 다시 받아 주세요.'){
      session=null;sessionGeneration++;loadSequence++;actionInFlight=false;showAuth();status('authStatus',message,true);void client.auth.signOut();
    }
    async function api(body,generation=sessionGeneration){
      const token=session?.access_token;if(!token)throw new Error('로그인이 필요합니다.');
      const options={method:body?'POST':'GET',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'}};
      if(body)options.body=JSON.stringify(body);
      const res=await fetch(configuration.edge,options),payload=await res.json().catch(()=>({ok:false,error:'서버 응답을 읽지 못했습니다.'}));
      if(generation!==sessionGeneration||token!==session?.access_token)throw staleError();
      if(res.status===401){expireSession(payload?.error);throw staleError()}
      if(!res.ok||payload?.ok===false)throw new Error(payload?.error||'요청을 처리하지 못했습니다.');return payload;
    }
    const formatTime=(value)=>value?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',dateStyle:'medium',timeStyle:'short'}).format(new Date(value)):'-';
    const escape=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const statusLabels={scheduled:'작성 대기',awaiting_review:'검토 중',held:'검사 보류',failed:'발송 실패',skipped:'발송 제외',canceled:'취소',sent:'발송 완료',sending:'발송 중'};
    const eventLabels={result_registered:'작성 결과 등록',result_terminal_acknowledged:'종료된 작업의 늦은 결과 확인',writing_revision_required:'부분 수정 필요',writing_final_failure:'최종 검사 실패',revision_requested:'수정 검사 요청',revision_validation_recorded:'수정 검사 결과',job_canceled:'발송 취소',send_requested:'지금 발송 요청',runtime_send_lock_changed:'자동 발송 잠금 변경',reply:'답장',application:'내챌 신청',analysis_consent:'개별분석 동의',contract_consent:'계약서 동의',payment:'입금 완료'};
    function reasonText(value){const text=String(value||'');const known={'representative revision awaiting validation':'대표 수정본 검사 대기 중','representative revision failed validation':'대표 수정본이 검사를 통과하지 못했습니다.','final writing failure':'작성 결과가 최종 검사를 통과하지 못했습니다.','writing attempt requires revision':'작성 결과에 부분 수정이 필요합니다.',held:'검사 보류'};if(known[text])return known[text];if(/pre-review checks failed:.*machine=False/i.test(text))return `기계 검사에서 통과하지 못했습니다. (${text})`;if(/pre-review checks failed:.*source=False/i.test(text))return `출처 검사에서 통과하지 못했습니다. (${text})`;return text?`처리 기록: ${text}`:''}
    const reviewLabels={tone:'말투',story:'내용 흐름',duplicate:'중복',date_stage:'날짜·단계',one_to_one:'학생별 맞춤'};
    function validationHtml(x){const d=x.validation_details;if(!d)return'';const rows=[];for(const issue of d.source_issues||[])rows.push(`출처: ${typeof issue==='string'?issue:(issue.reason||issue.evidence||JSON.stringify(issue))}`);for(const failure of d.machine_failures||[])rows.push(`기계 검사 · ${failure.check||'항목'}: ${failure.evidence||'근거 없음'}`);for(const failure of d.review_failures||[])rows.push(`독립 검수 · ${reviewLabels[failure.check]||failure.check||'항목'}: ${failure.reason||''}${failure.evidence?` (${failure.evidence})`:''}`);if(!rows.length)return'';return `<details><summary>검사 실패 근거 ${rows.length}개</summary><ul>${rows.map((row)=>`<li>${escape(row)}</li>`).join('')}</ul></details>`}
    function filtered(){const items=data?.items||[];if(currentTab==='logs')return [];const statuses=currentTab.split(',');return items.filter((x)=>statuses.includes(x.status));}
    function render(){
      $('tabs').innerHTML=tabDefs.map(([key,label])=>`<button class="tab ${key===currentTab?'active':''}" data-tab="${key}">${label}</button>`).join('');
      if(currentTab==='logs'){const logs=data?.logs||[];$('list').innerHTML=logs.length?logs.map((x)=>`<article class="card item"><h3>${escape(eventLabels[x.event]||'관리 기록')}</h3><div class="meta">${escape(x.email||'')} · ${escape(x.occurrence_known===false?'발생 시각 미상 · 관측 '+formatTime(x.observed_at):formatTime(x.occurred_at))}</div>${x.summary?`<div class="body">${escape(reasonText(x.summary))}</div>`:''}</article>`).join(''):'<div class="card empty">관리 기록이 없습니다.</div>';return;}
      const items=filtered();
      if(currentTab==='sent'){const labels=[['reply','답장'],['application','내챌 신청'],['analysis_consent','개별분석 동의'],['contract_consent','계약서 동의'],['payment','입금 완료']];const metrics=`<div class="metrics">${labels.map(([key,label])=>`<div class="metric">${escape(label)}<strong>${escape(data?.outcomes?.[key]??0)}</strong></div>`).join('')}</div>`;const activity=(data?.outcome_activity||[]).map(outcomeHtml).join('');const rows=items.length?items.map(itemHtml).join(''):'<div class="card empty">발송 기록이 없습니다.</div>';$('list').innerHTML=metrics+activity+rows;return;}
      if(!items.length){$('list').innerHTML='<div class="card empty">해당 항목이 없습니다.</div>';return;}$('list').innerHTML=items.map(itemHtml).join('');
    }
    function outcomeHtml(x){const when=x.occurrence_known===false?`발생 시각 미상 · 관측 ${formatTime(x.observed_at)}`:formatTime(x.occurred_at);const sent=(data?.items||[]).find((item)=>item.job_id===x.linked_sent_job_id),sentAt=sent?.sent_at||x.linked_sent_at;const linked=sentAt?`성과 근거 ${sent?.subject||'과거 발송 기록'} · ${formatTime(sentAt)}`:'연결된 발송 없음';return `<article class="card item"><h3>${escape(eventLabels[x.event]||'학생 행동')}</h3><div class="meta">${escape(x.email||'')} · ${escape(when)}<br>14일 성과 ${x.attributed===true?'포함':'미포함'} · ${escape(linked)}</div></article>`}
    function itemHtml(x){const canCancel=['scheduled','awaiting_review'].includes(x.status)||(x.status==='held'&&x.held_kind==='validation');const editable=['awaiting_review','held'].includes(x.status)&&(!x.held_kind||x.held_kind==='validation')&&x.can_edit===true;const editReason=!editable&&x.edit_unavailable_reason?`<div class="meta">${escape(x.edit_unavailable_reason)}</div>`:'';const timing=x.status==='sent'?`발송 ${formatTime(x.sent_at)}`:`예약 ${formatTime(x.scheduled_at)} · 검토 마감 ${formatTime(x.review_deadline_at)}`;return `<article class="card item" data-job="${escape(x.job_id)}"><h3>${escape(x.subject||'(제목 없음)')}</h3><div class="meta">${escape(x.email)} · ${escape(statusLabels[x.status]||'상태 확인 필요')} · 본문 ${escape(x.revision??0)}판<br>${escape(timing)}${x.held_reason?`<br>보류 이유: ${escape(reasonText(x.held_reason))}`:''}</div><div class="body">${escape(x.body||'(저장된 본문 없음)')}</div>${validationHtml(x)}${editReason}<div class="row">${editable?'<button data-action="edit">수정</button>':''}${x.status==='awaiting_review'?'<button data-action="send">지금 발송</button>':''}${canCancel?'<button data-action="cancel" class="danger">취소</button>':''}</div></article>`}
    async function load(successMessage=''){if(!session?.access_token)return false;const generation=sessionGeneration,sequence=++loadSequence;$('refresh').disabled=true;$('sendLock').disabled=true;if(!data)$('sendLock').indeterminate=true;status('adminStatus','불러오는 중…');try{const next=await api(null,generation);if(generation!==sessionGeneration||sequence!==loadSequence)throw staleError();data=next;$('sendLock').checked=data.runtime?.send_locked===true;$('sendLock').indeterminate=false;$('sendLock').disabled=false;render();status('adminStatus',successMessage);return true}catch(e){if(e.stale||generation!==sessionGeneration||sequence!==loadSequence)return false;data=null;$('sendLock').indeterminate=true;$('sendLock').disabled=true;render();status('adminStatus',e.message,true);return false}finally{if(sequence===loadSequence)$('refresh').disabled=false}}
    async function act(body,message){if(actionInFlight)return false;const generation=sessionGeneration;actionInFlight=true;status('adminStatus','처리 중…');try{await api(body,generation);if(generation!==sessionGeneration)throw staleError();return await load(message)}catch(e){if(!e.stale&&generation===sessionGeneration)status('adminStatus',e.message,true);return false}finally{if(generation===sessionGeneration)actionInFlight=false}}
    $('sendCode').onclick=async()=>{const email=$('email').value.trim();status('authStatus','인증번호를 보내는 중…');try{const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error)throw error;$('emailStep').classList.add('hidden');$('codeStep').classList.remove('hidden');status('authStatus','이메일로 보낸 6자리 인증번호를 입력해 주세요.')}catch(e){status('authStatus',e.message||'인증번호를 보내지 못했습니다.',true)}};
    $('verifyCode').onclick=async()=>{const email=$('email').value.trim(),token=$('code').value.trim();if(!/^\d{6}$/.test(token)){status('authStatus','6자리 숫자를 입력해 주세요.',true);return}status('authStatus','확인 중…');try{const {data:verified,error}=await client.auth.verifyOtp({email,token,type:'email'});if(error||!verified.session)throw error||new Error('로그인을 확인하지 못했습니다.');adoptSession(verified.session);await load()}catch(e){status('authStatus',e.message||'인증번호가 틀렸거나 만료되었습니다.',true)}};
    $('changeEmail').onclick=()=>{$('codeStep').classList.add('hidden');$('emailStep').classList.remove('hidden');$('code').value='';status('authStatus','')};
    $('refresh').onclick=()=>load();$('logout').onclick=async()=>{session=null;sessionGeneration++;loadSequence++;actionInFlight=false;showAuth();try{await client.auth.signOut()}finally{status('authStatus','로그아웃했습니다.')}};
    $('sendLock').onchange=async()=>{const control=$('sendLock'),confirmed=data?.runtime?.send_locked===true,desired=control.checked;if(actionInFlight){control.checked=confirmed;return}control.disabled=true;const ok=await act({action:'set_send_lock',request_id:requestId(),send_locked:desired},'자동 발송 잠금을 바꿨습니다.');if(ok)return;const reconciled=session?.access_token?await load('서버의 현재 잠금 상태를 다시 확인했습니다.'):false;if(!reconciled){control.checked=confirmed;control.indeterminate=true;control.disabled=true;status('adminStatus','자동 발송 잠금의 현재 상태를 확인할 수 없습니다. 새로고침하기 전에는 바꿀 수 없습니다.',true)}};
    $('tabs').onclick=(e)=>{const button=e.target.closest('[data-tab]');if(button){currentTab=button.dataset.tab;render()}};
    $('list').onclick=(e)=>{const button=e.target.closest('[data-action]');if(!button)return;const item=data.items.find((x)=>x.job_id===button.closest('[data-job]').dataset.job);if(!item)return;
      if(button.dataset.action==='edit'){editing=item;if(!(pendingRevision&&pendingRevision.jobId===item.job_id&&pendingRevision.subject===(item.subject||'')&&pendingRevision.body===(item.body||'')))pendingRevision=item.pending_revision_request_id?{jobId:item.job_id,subject:item.subject||'',body:item.body||'',requestId:item.pending_revision_request_id}:null;$('editSubject').value=item.subject||'';$('editBody').value=item.body||'';$('editor').classList.remove('hidden')}
      if(button.dataset.action==='send'&&confirm('남은 검토시간만 생략하고 발송 직전 검사를 요청할까요?'))act({action:'send_now',job_id:item.job_id,request_id:requestId()},'지금 발송 요청을 기록했습니다.');
      if(button.dataset.action==='cancel'){canceling=item;$('cancelReason').value='';status('cancelStatus','');$('cancelDialog').classList.remove('hidden')}};
    $('closeEdit').onclick=()=>{$('editor').classList.add('hidden');editing=null};
    $('saveEdit').onclick=async()=>{if(!editing)return;const subject=$('editSubject').value.trim(),body=$('editBody').value.trim();if(!subject||!body){alert('제목과 본문을 모두 입력해 주세요.');return}if(!(pendingRevision&&pendingRevision.jobId===editing.job_id&&pendingRevision.subject===subject&&pendingRevision.body===body))pendingRevision={jobId:editing.job_id,subject,body,requestId:editing.pending_revision_request_id&&editing.subject===subject&&editing.body===body?editing.pending_revision_request_id:requestId()};const ok=await act({action:'save_revision',job_id:editing.job_id,request_id:pendingRevision.requestId,subject,body},'수정본을 저장하고 검사를 요청했습니다.');if(ok){pendingRevision=null;$('editor').classList.add('hidden');editing=null}};
    $('closeCancel').onclick=()=>{$('cancelDialog').classList.add('hidden');$('cancelReason').value='';status('cancelStatus','');canceling=null};
    $('confirmCancel').onclick=async()=>{if(!canceling)return;const reason=$('cancelReason').value.trim();if(!reason){status('cancelStatus','취소 이유를 입력해 주세요.',true);return}const item=canceling,ok=await act({action:'cancel',job_id:item.job_id,request_id:requestId(),reason},'발송을 취소했습니다.');if(ok){$('cancelDialog').classList.add('hidden');$('cancelReason').value='';status('cancelStatus','');canceling=null}};
    function adoptSession(next){const changed=(session?.access_token||'')!==(next?.access_token||'')||(session?.user?.id||'')!==(next?.user?.id||'');if(changed){sessionGeneration++;loadSequence++}session=next;if(next)showAdmin();else showAuth()}
    client.auth.onAuthStateChange((event,next)=>{adoptSession(next);if(event==='SIGNED_OUT'){$('codeStep').classList.add('hidden');$('emailStep').classList.remove('hidden');$('code').value='';status('authStatus','로그인이 종료되었습니다. 인증번호를 다시 받아 주세요.',true)}if(next&&['SIGNED_IN','TOKEN_REFRESHED','INITIAL_SESSION'].includes(event))void load()});
    const bootstrapGeneration=sessionGeneration;
    client.auth.getSession().then(({data:initial,error})=>{if(bootstrapGeneration!==sessionGeneration)return;if(error){expireSession('로그인 상태를 갱신하지 못했습니다. 인증번호를 다시 받아 주세요.');return}adoptSession(initial.session);if(initial.session)void load()});
  })();
  </script>
