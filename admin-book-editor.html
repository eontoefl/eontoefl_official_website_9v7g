<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입문서 편집기 - 이온토플</title>

    <!-- Inter (디자인 시스템 앵커 폰트) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Pretendard (학생 뷰어와 동일한 본문 폰트 — 줄바꿈까지 일치시키기 위함) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">

    <!-- BlockNote 번들 스타일 -->
    <link rel="stylesheet" href="js/book-editor.bundle.css">

    <!-- 페이지 스타일 (Ethereal Dashboard) -->
    <link rel="stylesheet" href="css/admin-book-editor.css">
</head>
<body class="bookedit-body">

    <!-- ===== 상단바 ===== -->
    <header class="bookedit-topbar">
        <div class="bookedit-topbar-left">
            <button class="btn-ghost" onclick="goBack()" title="뒤로가기">
                <i class="fas fa-arrow-left"></i> 뒤로
            </button>
            <h1 class="bookedit-title" id="editorTitle">입문서</h1>
            <span class="bookedit-save-status" id="saveStatus">
                <span class="bookedit-glint"></span> 준비됨
            </span>
        </div>
        <div class="bookedit-topbar-right">
            <button class="btn-ghost" onclick="downloadBook()" title="이 책 전체를 텍스트(.md)로 다운로드">
                <i class="fas fa-file-arrow-down"></i> 텍스트
            </button>
            <button class="btn-ghost" onclick="showVersions()" title="이전 버전 되돌리기">
                <i class="fas fa-clock-rotate-left"></i> 버전
            </button>
            <button class="btn-grad" id="btnSave" onclick="savePage()" title="저장 (저장해야 학생에게 반영)">
                <i class="fas fa-floppy-disk"></i> 저장
            </button>
        </div>
    </header>

    <!-- ===== 본문: 왼쪽 목차 패널 + 페이지 스크롤 ===== -->
    <div class="bookedit-main">

        <!-- 왼쪽 목차(아웃라인) 패널 — 제목1·제목2 실제 내용 표시, 클릭 시 이동 -->
        <aside class="bookedit-outline" id="outline">
            <div class="bookedit-outline-head">
                <span class="bookedit-outline-title"><i class="fas fa-list-ul"></i> 목차</span>
                <button class="bookedit-outline-collapse" id="outlineCollapse" title="목차 접기">
                    <i class="fas fa-angles-left"></i>
                </button>
            </div>
            <div class="bookedit-outline-list" id="outlineList"></div>
            <!-- 오른쪽 가장자리: 드래그해서 너비 조절 -->
            <div class="bookedit-outline-resizer" id="outlineResizer" title="드래그해서 너비 조절"></div>
        </aside>

        <!-- 접혔을 때 나타나는 '펼치기' 탭 -->
        <button class="bookedit-outline-open" id="outlineOpen" title="목차 펼치기" hidden>
            <i class="fas fa-list-ul"></i>
        </button>

        <main class="bookedit-canvas" id="canvas">
            <div class="bookedit-stack" id="pageStack"></div>

            <div class="bookedit-loading" id="editorLoading">
                <div class="bookedit-spinner"></div>
                <p>편집기를 불러오는 중...</p>
            </div>
        </main>
    </div>

    <!-- ===== 페이지 조작 툴바 (용지 옆에 떠 있음) ===== -->
    <div class="bookedit-slidebar" id="slideBar" hidden>
        <div class="bookedit-sb-group">
            <button class="bookedit-sb-btn" id="sbPrev" title="이 페이지를 앞으로 옮기기"><i class="fas fa-arrow-up"></i></button>
            <button class="bookedit-sb-num" id="sbNum" title="페이지 목록 (클릭)">1</button>
            <button class="bookedit-sb-btn" id="sbNext" title="이 페이지를 뒤로 옮기기"><i class="fas fa-arrow-down"></i></button>
        </div>
        <button class="bookedit-sb-btn solo" id="sbDup" title="이 페이지 복제"><i class="far fa-clone"></i></button>
        <button class="bookedit-sb-btn solo" id="sbAdd" title="아래에 새 페이지"><i class="far fa-square-plus"></i></button>
        <button class="bookedit-sb-btn solo is-danger" id="sbDel" title="이 페이지 삭제"><i class="far fa-trash-can"></i></button>
    </div>

    <!-- ===== 페이지 목록 팝오버 (이동 / 드래그 순서변경) ===== -->
    <div class="bookedit-pop" id="pagePop" hidden>
        <div class="bookedit-pop-head">페이지 이동 · 순서 변경</div>
        <div class="bookedit-pop-list" id="pagePopList"></div>
    </div>

    <!-- ===== 버전 되돌리기 모달 ===== -->
    <div class="bookedit-modal-overlay" id="versionModal">
        <div class="bookedit-modal">
            <div class="bookedit-modal-head">
                <h2><i class="fas fa-clock-rotate-left"></i> 이 페이지의 버전</h2>
                <button class="btn-ghost" onclick="closeVersions()"><i class="fas fa-xmark"></i></button>
            </div>
            <div class="bookedit-modal-body" id="versionList"></div>
        </div>
    </div>

    <!-- ===== 스크립트 ===== -->
    <script src="js/supabase-config.js"></script>
    <script src="js/book-editor.bundle.js"></script>
    <script src="js/book-markdown.js"></script>
    <script src="js/admin-book-editor.js"></script>
</body>
</html>
