<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>학생 화면으로 보기 - 이온토플</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<style>
/* 2026-11-17 관리자 "학생 화면으로 보기": 테스트룸 학생 서재(book-v3)를 그대로 넣어 보여준다. PC / 휴대폰 전환. 기록은 남지 않는다. */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Pretendard,sans-serif;color:#2E2A3A;background:#ECE9F2;display:flex;flex-direction:column}
.sv-top{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;background:#fff;border-bottom:1px solid #E6E1EF}
.sv-back{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:9px;color:#4E3D73;text-decoration:none;font-weight:700;font-size:14px}
.sv-back:hover{background:#F1EDF8}
.sv-title{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.sv-note{font-size:12.5px;color:#7A7290;white-space:nowrap}
.sv-sp{flex:1}
.sv-seg{display:inline-flex;background:#F1EDF8;border-radius:10px;padding:3px}
.sv-seg button{border:0;background:transparent;height:32px;padding:0 14px;border-radius:8px;font:700 13.5px Pretendard;color:#6B6382;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.sv-seg button.on{background:#fff;color:#4E3D73;box-shadow:0 1px 3px rgba(46,42,58,.12)}
.sv-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sv-frame{border:0;background:#fff;display:block}
.sv-stage.pc .sv-frame{width:100%;height:100%}
.sv-phone{width:390px;height:844px;border-radius:44px;background:#1E1B26;padding:12px;box-shadow:0 18px 50px rgba(46,42,58,.28);transform-origin:center center;flex:none}
.sv-phone .sv-frame{width:366px;height:820px;border-radius:33px}
.sv-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#6B6382}
</style>
</head>
<body>
<header class="sv-top">
  <a class="sv-back" id="btnBack" href="admin-book-list-v2.html"><i class="fas fa-arrow-left"></i>교재 관리</a>
  <div class="sv-title" id="title">학생 화면으로 보기</div>
  <span class="sv-note">넘겨 보거나 북마크·메모를 눌러도 학생 기록에는 남지 않아요</span>
  <span class="sv-sp"></span>
  <span class="sv-seg" id="seg"><button data-m="pc" class="on"><i class="fas fa-desktop"></i>PC</button><button data-m="phone"><i class="fas fa-mobile-screen"></i>휴대폰</button></span>
</header>
<main class="sv-stage pc" id="stage"><div class="sv-msg" id="msg">불러오는 중…</div></main>
<script src="js/supabase-config.js?v=20261012"></script>
<script>
(async function () {
  const p = new URLSearchParams(location.search);
  const LOCAL = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
  const DEV = p.get('dev') === '1' && LOCAL;
  if (!DEV) { let u = null; try { u = JSON.parse(localStorage.getItem('iontoefl_user') || 'null'); } catch (_) {} if (!u || u.role !== 'admin') { alert('관리자만 접근할 수 있습니다.'); location.href = 'index.html'; return; } }
  const id = p.get('book'); const msg = document.getElementById('msg');
  const listUrl = 'admin-book-list-v2.html?' + new URLSearchParams(Object.assign({ book: id || '' }, DEV ? { dev: '1' } : {})).toString();
  document.getElementById('btnBack').href = listUrl;
  if (!id) { msg.textContent = '책 번호가 없어요'; return; }
  // 학생 서재(테스트룸). 내 컴퓨터에서는 로컬 테스트룸(8821)
  const VIEWER = LOCAL ? 'http://127.0.0.1:8821' : 'https://testroom.eonfl.com';
  const VIEWER_ORIGIN = new URL(VIEWER).origin;
  try { const d = (await supabaseAPI.query('tr_book_documents', { id: 'eq.' + id, select: 'title' }))[0]; if (d) { document.getElementById('title').textContent = d.title || '책'; document.title = (d.title || '책') + ' · 학생 화면으로 보기'; } } catch (_) {}

  // 학생 서재가 "관리자 화면 안이에요?" 하고 물으면 답해 준다 (이 페이지는 위에서 관리자 확인을 통과했을 때만 여기까지 온다)
  window.addEventListener('message', (e) => {
    if (e.origin !== VIEWER_ORIGIN || !frame || e.source !== frame.contentWindow || !e.data) return;
    if (e.data.type === 'bookv3-preview-hello') e.source.postMessage({ type: 'bookv3-preview-ok' }, e.origin);
    if (e.data.type === 'bookv3-preview-leave') { window.close(); setTimeout(() => { location.href = listUrl; }, 150); }
  });

  const stage = document.getElementById('stage'); let frame = null, mode = p.get('view') === 'phone' ? 'phone' : 'pc';
  function fitPhone() { const ph = stage.querySelector('.sv-phone'); if (!ph) return; const s = Math.min(1, (stage.clientHeight - 40) / 844, (stage.clientWidth - 40) / 390); ph.style.transform = 'scale(' + s + ')'; }
  function load() {
    stage.className = 'sv-stage ' + mode; stage.innerHTML = '';
    frame = document.createElement('iframe'); frame.className = 'sv-frame'; frame.title = '학생 화면';
    frame.src = VIEWER + '/book-v3.html?' + new URLSearchParams(Object.assign({ book: id, preview: 'admin' }, mode === 'phone' ? { phone: '1' } : {})).toString();
    frame.addEventListener('load', () => { try { frame.focus(); } catch (_) {} });
    if (mode === 'phone') { const ph = document.createElement('div'); ph.className = 'sv-phone'; ph.appendChild(frame); stage.appendChild(ph); fitPhone(); }
    else stage.appendChild(frame);
    document.querySelectorAll('#seg button').forEach((b) => b.classList.toggle('on', b.dataset.m === mode));
  }
  document.getElementById('seg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b || b.dataset.m === mode) return; mode = b.dataset.m; const q = new URLSearchParams(location.search); q.set('view', mode); history.replaceState(null, '', '?' + q.toString()); load(); });
  window.addEventListener('resize', fitPhone);
  load();
})();
</script>
</body>
</html>
