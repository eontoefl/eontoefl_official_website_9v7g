<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>김비서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* 표면 (톤으로 층을 만든다 — 선으로 나누지 않는다) */
    --surface: #f8f9fa;
    --surface-lowest: #ffffff;
    --surface-low: #f3f4f5;
    --surface-container: #edeef0;
    --surface-high: #e7e9eb;
    --surface-highest: #e1e4e6;
    /* 글자 */
    --on-surface: #191c1d;
    --on-surface-variant: #3e484f;
    /* 강조 */
    --primary: #006688;
    --primary-container: #50c9ff;
    --primary-fixed-dim: #76d1ff;
    --on-primary-container: #001e2b;
    --secondary-container: #cfe9d6;
    --on-secondary-container: #14351f;
    --tertiary: #a53b22;
    --error: #ba1a1a;
    --grad: linear-gradient(135deg, #006688 0%, #50c9ff 100%);
    --lift: 0 4px 28px rgba(25, 28, 29, .05);
    --r: .5rem;
    --r-lg: 1rem;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Inter", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--surface); color: var(--on-surface);
    line-height: 1.72; font-size: 15px; font-weight: 400;
    padding: 0 0 96px;
  }
  .wrap { max-width: 1460px; margin: 0 auto; padding: 0 1.4rem; }

  /* ───── 2단 레이아웃 (넓은 화면) ─────
     좁은 화면: .cols 는 그냥 블록 → 세로 한 줄 (기존 그대로)
     760px↑  : 왼쪽(주 작업) + 오른쪽(현황·소통) 2단 그리드 */
  .cols { display: block; }
  .only-d { display: none; }
  @media (min-width: 760px) {
    .wrap { padding: 0 2rem; }
    .cols { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
      column-gap: 1.75rem; align-items: start; }
    .only-d { display: block; }
    .only-m { display: none; }
    /* 오늘판이 없어서 왼쪽이 비면 한 줄로 (채팅·메모만 가운데) */
    .cols:has(> .main:empty) { display: block; max-width: 860px; }
  }
  @media (min-width: 1200px) {
    .cols { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); column-gap: 2.25rem; }
  }
  h1, h2, h3 { letter-spacing: -0.02em; }
  ::selection { background: var(--primary-fixed-dim); color: var(--on-primary-container); }

  /* ───── 잠금 화면 ───── */
  #gate { max-width: 360px; margin: 16vh auto; padding: 0 1.4rem; text-align: center; }
  #gate .mark { width: 52px; height: 52px; margin: 0 auto 1.4rem; border-radius: var(--r-lg);
    background: var(--grad); display: grid; place-items: center; font-size: 23px; }
  #gate h1 { font-size: 20px; font-weight: 700; margin-bottom: .35rem; }
  #gate p { font-size: 13.5px; color: var(--on-surface-variant); margin-bottom: 1.4rem; }
  #gate input { width: 100%; background: var(--surface-highest); border: none; border-radius: var(--r);
    padding: 14px 16px; font-family: inherit; font-size: 16px; color: var(--on-surface);
    outline: none; text-align: center; transition: outline-color .15s; }
  #gate input:focus { outline: 2px solid var(--primary-fixed-dim); outline-offset: 0; }
  #gate button { width: 100%; margin-top: .7rem; background: var(--grad); color: #fff; border: none;
    border-radius: var(--r); padding: 14px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  #gate .msg { font-size: 13px; color: var(--error); margin-top: .7rem; min-height: 20px; font-weight: 500; }

  /* ───── 상단 바 (유리) ───── */
  .topbar { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, .8);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); margin-bottom: 1.75rem; }
  .topbar .inner { max-width: 1460px; margin: 0 auto; padding: 1rem 1.4rem;
    display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
  @media (min-width: 760px) { .topbar .inner { padding: 1rem 2rem; } }
  .brand { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
  .brand small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .18em;
    color: var(--on-surface-variant); }
  #offbtn { margin-left: auto; border: none; border-radius: var(--r); background: var(--tertiary); color: #fff;
    padding: 10px 16px; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  #offbtn:hover { filter: brightness(1.08); }
  #offbtn.sent { background: var(--secondary-container); color: var(--on-secondary-container); }
  #savedot { font-size: 12px; font-weight: 500; color: var(--on-surface-variant); }
  #savedot.bad { color: var(--tertiary); }

  /* ───── 김비서 머리 배터리 (대화 맥락이 몇 % 찼나) — 채팅 창 머리(그라데이션 위)라 흰색 계열 ───── */
  #kbbat { display: flex; align-items: center; gap: .4rem; flex-shrink: 0; cursor: default; margin-left: auto; }
  #kbbat .bat { position: relative; width: 23px; height: 12px; border: 1.5px solid rgba(255,255,255,.85);
    border-radius: 3.5px; margin-right: 3px; }
  #kbbat .bat::after { content: ""; position: absolute; right: -4.5px; top: 2px; width: 2.5px; height: 5px;
    background: rgba(255,255,255,.85); border-radius: 0 1.5px 1.5px 0; }
  #kbbat .fill { position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; max-width: calc(100% - 3px);
    border-radius: 1.5px; background: #2f6f4f; transition: width .3s; }
  #kbbat .pct { font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; }

  /* ───── 날짜 이동 · 3주 일정표 (note.html에서 가져옴) ───── */
  .iconbtn { width: 40px; height: 40px; border: none; border-radius: var(--r); background: var(--surface-high);
    color: var(--on-primary-container); font-size: 19px; font-weight: 600; cursor: pointer; line-height: 1;
    font-family: inherit; transition: background .15s; flex-shrink: 0; }
  .iconbtn:hover { background: var(--surface-highest); }
  .iconbtn:disabled { opacity: .35; cursor: default; }
  .iconbtn:disabled:hover { background: var(--surface-high); }
  .cal2 { background: var(--surface-lowest); border-radius: var(--r-lg); padding: 1.1rem 1.2rem 1.2rem;
    box-shadow: var(--lift); margin-bottom: 1.75rem; }
  .cal2 .c2head { display: flex; align-items: center; gap: .5rem; margin-bottom: .9rem; }
  .cal2 .c2head .iconbtn { width: 34px; height: 34px; font-size: 17px; }
  .cal2 .dnow { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
  .cal2 .dnow.isnow { color: var(--primary); }
  .cal2 .c2head b { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; color: var(--on-surface-variant);
    margin-left: auto; }
  .cal2 .c2head .rng { font-size: 11.5px; color: var(--on-surface-variant); font-weight: 500; }
  .cal2 .grid14 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal2 .dw { text-align: center; font-size: 10px; font-weight: 700; color: var(--on-surface-variant);
    padding: 2px 0 5px; letter-spacing: .06em; }
  .cal2 .dw.sun { color: var(--tertiary); }
  .cal2 .cell { min-height: 74px; border-radius: var(--r); background: var(--surface-low); padding: .4rem .45rem;
    cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .cal2 .cell:hover { background: var(--surface-high); }
  .cal2 .cell.today { background: #e3f3fb; box-shadow: inset 0 0 0 2px var(--primary-fixed-dim); }
  .cal2 .cell.past { opacity: .45; }
  .cal2 .cell.nofuture { cursor: default; }
  .cal2 .cell .dd { font-size: 11.5px; font-weight: 700; color: var(--on-surface-variant);
    display: flex; align-items: center; gap: 4px; }
  .cal2 .cell.today .dd { color: var(--primary); }
  .cal2 .cell .dd.sun { color: var(--tertiary); }
  .cal2 .cell .tdy { font-size: 9px; font-weight: 700; letter-spacing: -0.01em; color: #fff;
    background: var(--grad); border-radius: 99px; padding: 1.5px 6px; line-height: 1.3; }
  .cal2 .ev { font-size: 10.5px; line-height: 1.4; color: var(--on-surface); display: flex; gap: 3px;
    align-items: flex-start; position: relative; padding-right: 12px; }
  .cal2 .ev .pt { width: 5px; height: 5px; border-radius: 99px; flex-shrink: 0; margin-top: 4px; }
  .cal2 .ev .tx { word-break: break-word; }
  .cal2 .evx { position: absolute; right: -2px; top: -1px; opacity: 0; border: none; background: var(--surface-lowest);
    color: var(--on-surface-variant); font-size: 10px; line-height: 1; padding: 2px 3px; border-radius: 99px;
    cursor: pointer; font-family: inherit; }
  .cal2 .cell:hover .evx, .cal2 .lrow:hover .evx { opacity: .75; }
  .cal2 .evx:hover { opacity: 1; background: var(--tertiary); color: #fff; }
  .cal2 .lrow { position: relative; padding-right: 16px; }
  .cal2 .later { margin-top: .8rem; background: var(--surface-low); border-radius: var(--r); padding: .7rem .9rem;
    font-size: 11.5px; color: var(--on-surface-variant); line-height: 1.8; }
  .cal2 .later b { font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--on-surface);
    display: block; margin-bottom: .2rem; }
  .cal2 .empty2 { font-size: 12px; color: var(--on-surface-variant); opacity: .7; padding: .5rem 0; }
  @media (max-width: 700px) {
    .cal2 .cell { min-height: 58px; } .cal2 .ev { font-size: 9.5px; } .cal2 .dnow { font-size: 17px; }
  }
  /* 좁은 화면: 칸이 손톱만해서 글자가 세로로 부서진다 — 일정은 점으로만 보여준다 */
  @media (max-width: 620px) {
    .cal2 .cell { min-height: 44px; }
    .cal2 .ev { padding-right: 0; }
    .cal2 .ev .tx, .cal2 .ev .evx { display: none; }
    .cal2 .ev .pt { margin-top: 2px; }
  }

  /* ───── 히어로 (오늘 목표) ───── */
  .hero { background: var(--grad); color: #fff; border-radius: var(--r-lg); padding: 1.5rem 1.75rem;
    margin-bottom: 1.75rem; }
  .hero .lab { font-size: 10.5px; font-weight: 600; letter-spacing: .16em; opacity: .78; }
  .hero .h { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; margin-top: .15rem; line-height: 1.5; }
  .hero .d { font-size: 12.5px; opacity: .85; margin-top: .3rem; }

  /* 오늘판 아님 · 지난 판 배너 */
  .stale { background: #fdf0e7; color: var(--on-surface-variant); border-radius: var(--r);
    padding: .9rem 1.1rem; font-size: 13px; line-height: 1.7; margin-bottom: 1.75rem; }
  .stale b { color: var(--tertiary); font-weight: 700; }
  .empty-day { background: var(--surface-low); border-radius: var(--r-lg); padding: 3rem 1.4rem;
    text-align: center; color: var(--on-surface-variant); font-size: 14.5px; line-height: 1.8;
    margin-bottom: 1.75rem; }
  .empty-day .big { font-size: 34px; margin-bottom: .5rem; }

  /* ───── 공통 패널 ───── */
  section { margin-bottom: 1.75rem; }
  .seclab { font-size: 10.5px; font-weight: 600; letter-spacing: .16em; color: var(--on-surface-variant);
    margin-bottom: .7rem; padding-left: .15rem; }
  .seclab span { font-weight: 400; letter-spacing: .02em; }
  .panel { background: var(--surface-lowest); border-radius: var(--r-lg); padding: 1.4rem; box-shadow: var(--lift); }

  /* ───── 진행 막대 ───── */
  .prog { display: flex; align-items: center; gap: 1rem; margin-bottom: .5rem; }
  .prog .track { flex: 1; height: 6px; background: var(--surface-high); border-radius: 99px; overflow: hidden; }
  .prog .bar { height: 100%; width: 0%; background: var(--grad); border-radius: 99px; transition: width .3s; }
  .prog .n { font-size: 12.5px; font-weight: 600; color: var(--on-surface-variant); white-space: nowrap; }

  /* ───── 체크 목록 (must · stretch) ───── */
  .todo { list-style: none; }
  .todo li { display: flex; align-items: flex-start; gap: .7rem; padding: .8rem .3rem; border-radius: var(--r); }
  .todo li:hover { background: var(--surface-low); }
  .todo input[type=checkbox] { width: 21px; height: 21px; margin-top: 3px; accent-color: var(--primary);
    cursor: pointer; flex-shrink: 0; }
  .todo .b { flex: 1; min-width: 0; }
  .todo .task { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.55; }
  .todo .sub { font-size: 12.5px; color: var(--on-surface-variant); line-height: 1.65; margin-top: .1rem; }
  .todo li.done .task { text-decoration: line-through; color: var(--on-surface-variant); opacity: .6; }
  .todo li.done .sub { opacity: .5; }
  .todo .none { padding: .5rem .3rem; font-size: 13px; color: var(--on-surface-variant); opacity: .8; }
  /* 김비서가 DB 실측으로 완료 확인한 항목 — 체크 고정(클릭 무시), 김비서 톤(초록) */
  .todo li.kbdone input[type=checkbox] { accent-color: #2f6f4f; pointer-events: none; cursor: default; }

  /* ───── 김비서 업무 현황 ───── */
  .kb { list-style: none; }
  .kb li { display: flex; align-items: flex-start; gap: .7rem; padding: .7rem .3rem; border-radius: var(--r); }
  .kb .mk { flex-shrink: 0; width: 21px; height: 21px; margin-top: 3px; border-radius: 6px;
    display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .kb .mk.todo { border: 2px solid var(--surface-highest); background: var(--surface-lowest); }
  .kb .mk.done { background: var(--grad); color: #fff; }
  .kb .tx { flex: 1; font-size: 14.5px; line-height: 1.6; }
  .kb li.isdone .tx { text-decoration: line-through; color: var(--on-surface-variant); opacity: .6; }
  .kb .doing { flex-shrink: 0; margin-top: 4px; font-size: 10.5px; font-weight: 700; color: #fff;
    background: var(--tertiary); border-radius: 99px; padding: 2px 9px; letter-spacing: .02em;
    animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .kb .doing { animation: none; } }

  /* ───── 전체 업무리스트 (표시 전용) ───── */
  .wl summary { cursor: pointer; user-select: none; -webkit-user-select: none; list-style: none; }
  .wl summary::-webkit-details-marker { display: none; }
  .wl summary.seclab::after { content: " ▾"; font-size: 11px; }
  .wl:not([open]) summary.seclab::after { content: " ▸"; }
  .wlg { font-size: 12px; font-weight: 700; color: var(--on-surface-variant); letter-spacing: .04em;
    margin: 1rem .15rem .25rem; }
  .wlg:first-child { margin-top: 0; }
  .wgroup { break-inside: avoid; -webkit-column-break-inside: avoid; margin-bottom: 1.1rem; }
  .wgroup:last-child { margin-bottom: 0; }
  /* 넓을 때 그룹 카드를 2~3열로 흘린다 (그룹은 중간에서 안 잘림) */
  @media (min-width: 1000px) { .wl .panel { column-count: 2; column-gap: 2.25rem; } }
  @media (min-width: 1500px) { .wl .panel { column-count: 3; } }
  /* 완료 카드는 항목이 짧아서 한 열로만 (위 다열 규칙 무효화) */
  .wl.dl .panel { column-count: 1; }
  .wlist { list-style: none; }
  .wlist li { display: flex; align-items: flex-start; gap: .6rem; padding: .45rem .3rem;
    border-radius: var(--r); cursor: default; }
  .wmk { flex-shrink: 0; width: 18px; height: 18px; margin-top: 4px; border-radius: 5px;
    border: 2px solid var(--surface-highest); background: var(--surface-lowest);
    display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .wmk.on { border: none; background: var(--grad); color: #fff; }
  .wb { flex: 1; min-width: 0; }
  .wtx { font-size: 14px; line-height: 1.6; word-break: break-word; }
  .wlist li.wdone .wtx { text-decoration: line-through; color: var(--on-surface-variant); opacity: .6; }
  .wlist li.wdone .wmemo { opacity: .55; }
  .wurg { display: inline-block; width: 8px; height: 8px; border-radius: 99px;
    background: var(--error); margin-right: .45rem; vertical-align: 1px; }
  .wmemo { font-size: 12px; color: var(--on-surface-variant); line-height: 1.65; margin-top: .1rem;
    word-break: break-word; }

  /* ───── 돈 (막대는 note.html의 gauge 스타일) ───── */
  .gauge { background: var(--surface-low); border-radius: var(--r); padding: .8rem .95rem; }
  .gauge .lab { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 600;
    color: var(--on-surface-variant); margin-bottom: .45rem; }
  .gauge .lab span:last-child { color: var(--on-surface); font-weight: 700; }
  .gauge .track { height: 8px; background: var(--surface-high); border-radius: 99px; overflow: hidden; }
  .gauge .bar { height: 100%; background: var(--grad); border-radius: 99px; }
  .mbars .gauge { margin-bottom: .6rem; }
  .mbars .gauge:last-child { margin-bottom: 0; }
  .mbars + .lines { margin-top: .9rem; }
  /* ───── 용돈기입장 (오늘 쓴 돈) — state.expenses2. note.html의 expenses 키와는 별개 ───── */
  .expzone { margin-top: 1rem; border-top: 1px solid var(--surface-high); padding-top: .8rem; }
  .expzone .ezhead { font-size: 11px; font-weight: 700; letter-spacing: .1em;
    color: var(--on-surface-variant); display: flex; align-items: center; margin-bottom: .25rem; }
  .expzone .ezhead b { margin-left: auto; font-size: 12.5px; letter-spacing: 0; color: var(--tertiary); }
  .ezrow { display: flex; align-items: center; gap: .5rem; padding: .35rem .1rem; font-size: 13px; }
  .ezrow .ezamt { font-weight: 700; white-space: nowrap; }
  .ezrow .ezamt.minus { color: var(--tertiary); }
  .ezrow .ezamt.plus { color: #2f6f4f; }
  .ezrow .ezlb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ezrow .eztm { font-size: 10px; color: var(--on-surface-variant); flex-shrink: 0; }
  .ezrow .ezx { border: none; background: none; color: var(--on-surface-variant); cursor: pointer;
    font-size: 11px; padding: 2px 5px; border-radius: 99px; flex-shrink: 0; font-family: inherit; }
  .ezrow .ezx:hover { background: var(--surface-high); color: var(--tertiary); }
  .eznone { font-size: 12px; color: var(--on-surface-variant); opacity: .7; padding: .3rem 0; }
  .ezrow .ezpay { font-size: 11px; color: var(--on-surface-variant); flex-shrink: 0; white-space: nowrap; }
  /* 폼은 flex-wrap — 좁으면 [토글·통화·카드·금액] / [항목·추가] 두 줄로 자연스럽게 접힌다 */
  .ezform { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
  .ezform #exptype { width: 38px; border: none; border-radius: var(--r); background: var(--surface-high);
    color: var(--tertiary); font-size: 17px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    font-family: inherit; }
  .ezform #exptype.plus { color: #2f6f4f; }
  .ezform #expcur { width: 38px; border: none; border-radius: var(--r); background: var(--surface-high);
    color: var(--on-surface); font-size: 14px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    font-family: inherit; }
  .ezform select { background: var(--surface-highest); border: none; border-radius: var(--r);
    padding: .55rem .45rem; font-family: inherit; font-size: 13px; color: var(--on-surface);
    outline: none; flex-shrink: 0; max-width: 118px; }
  .ezform select:focus { outline: 2px solid var(--primary-fixed-dim); }
  .ezform input { background: var(--surface-highest); border: none; border-radius: var(--r);
    padding: .55rem .7rem; font-family: inherit; font-size: 14px; color: var(--on-surface);
    outline: none; min-width: 0; }
  .ezform input:focus { outline: 2px solid var(--primary-fixed-dim); }
  .ezform #exppayx { width: 96px; flex-shrink: 0; }
  .ezform #expamt { width: 92px; flex-shrink: 0; text-align: right; }
  .ezform #explabel { flex: 1 1 140px; }
  .ezform #expadd { border: none; border-radius: var(--r); background: var(--grad); color: #fff;
    padding: 0 14px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    flex-shrink: 0; }

function b64e(b) { let s = ""; new Uint8Array(b).forEach(c => s += String.fromCharCode(c)); return btoa(s); }
async function lock(pw, obj) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await keyFrom(pw, salt);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, enc.encode(JSON.stringify(obj)));
  const out = new Uint8Array(28 + ct.byteLength);
  out.set(salt, 0); out.set(iv, 16); out.set(new Uint8Array(ct), 28);
  return b64e(out);
}
async function unlockText(pw, blob) {
  const raw = b64d(blob);
  const k = await keyFrom(pw, raw.slice(0, 16));
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(16, 28) }, k, raw.slice(28))));
}

/* ───── 공통 ───── */
let PW = null, DATE = null, DAY = null, STATE = null, saveTimer = null;
const todayStr = () => { const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const shift = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const inlineMd = s => esc(s).replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
/* 마크다운 표(| a | b |)·헤딩(## 제목)·불릿(- 항목)을 줄 단위로 인식한다.
   셀·본문 전부 inlineMd(esc 경로)만 태우므로 원문 HTML은 절대 그대로 꽂히지 않는다. */
const mdRow = s => /^\s*\|.*\|\s*$/.test(s);
const mdSep = s => /^\s*\|(\s*:?-{2,}:?\s*\|)+\s*$/.test(s);
const mdCells = s => s.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
function fmt(t) {
  const src = String(t == null ? "" : t).split("\n");
  let html = "", plainBefore = false, i = 0, m;
  const block = h => { html += h; plainBefore = false; };
  while (i < src.length) {
    const line = src[i];
    if (mdRow(line) && i + 1 < src.length && mdSep(src[i + 1])) {
      const head = mdCells(line), rows = [];
      i += 2;
      while (i < src.length && mdRow(src[i])) { rows.push(mdCells(src[i])); i++; }
      block('<div class="mdtw"><table class="mdt"><thead><tr>' +
        head.map(c => "<th>" + inlineMd(c) + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map(c => "<td>" + inlineMd(c) + "</td>").join("") + "</tr>").join("") +
        "</tbody></table></div>");
      continue;
    }
    if ((m = /^#{2,3}\s+(.+)$/.exec(line))) block('<div class="mdh">' + inlineMd(m[1]) + "</div>");
    else if ((m = /^\s*-\s+(.+)$/.exec(line))) block('<div class="mdli">' + inlineMd(m[1]) + "</div>");
    else { html += (plainBefore ? "\n" : "") + inlineMd(line); plainBefore = true; }
    i++;
  }
  return html;
}
const plain = t => {
  if (t && typeof t === "object") return String(t.text || t.name || "");
  return String(t == null ? "" : t);
};
function hhmm(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  if (d.toDateString() !== now.toDateString()) return (d.getMonth() + 1) + "/" + d.getDate();
  let h = d.getHours(); const ap = h < 12 ? "오전" : "오후";
  h = h % 12 || 12;
  return ap + " " + h + ":" + String(d.getMinutes()).padStart(2, "0");
}
function korDate(s) {
  const d = new Date(s + "T12:00:00");
  return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + DOW[d.getDay()] + ")";
}
function setDot(ok, msg) { const d = document.getElementById("savedot"); d.textContent = msg; d.className = ok ? "" : "bad"; }

/* ───── 서버 ───── */
async function fetchDay(d) {
  const r = await fetch(SB + "?d=eq." + d + "&select=d,payload,state", { headers: HDR, cache: "no-store" });
  const j = await r.json();
  return Array.isArray(j) && j.length ? j[0] : null;
}
async function fetchLatest() {
  const r = await fetch(SB + "?select=d,payload,state&payload=not.is.null&order=d.desc&limit=1",
    { headers: HDR, cache: "no-store" });
  const j = await r.json();
  return Array.isArray(j) && j.length ? j[0] : null;
}
async function pushState() {
  if (!DATE || !STATE) return;
  try {
    STATE.updated = new Date().toLocaleString("ko-KR");
    const blob = await lock(PW, STATE);
    const r = await fetch(SB + "?on_conflict=d", { method: "POST",
      headers: Object.assign({}, HDR, { "Prefer": "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify({ d: DATE, state: blob }) });
    if (!r.ok) throw new Error(r.status);
    setDot(true, "저장됨 " + STATE.updated);
  } catch (e) { setDot(false, "저장 안 됨 — 인터넷 확인"); }
}
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(pushState, 500); }

/* ───── 잠금 해제 ───── */
async function tryUnlock(pw) {
  const row = await fetchLatest();
  if (!row || !row.payload) return { ok: true };   // 검증할 자료가 아직 없으면 통과
  try { await unlockText(pw, row.payload); return { ok: true }; } catch (e) { return { ok: false }; }
}
document.getElementById("unlock").addEventListener("click", doUnlock);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") doUnlock(); });
async function doUnlock() {
  const pw = document.getElementById("pw").value, msg = document.getElementById("gatemsg");
  if (!pw) return;
  msg.style.color = "var(--on-surface-variant)"; msg.textContent = "여는 중…";
  const r = await tryUnlock(pw);
  if (!r.ok) { msg.style.color = "var(--error)"; msg.textContent = "비밀번호가 다릅니다"; return; }
  PW = pw; localStorage.setItem(PWKEY, pw);
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "";
  await start();
}

/* ───── 3주 일정표 (note.html에서 가져옴 · hq_events) ───── */
const EV = "https://qpqjevecjejvbeuogtbx.supabase.co/rest/v1/hq_events";
const TONE = { fin: "#2f6f4f", mkt: "#a53b22", cs: "#006688", ct: "#7b4fa0", dev: "#3e484f", hr: "#b0355c" };
let evCache = null;

async function loadEvents() {
  if (!PW) return;
  try {
    const from = shift(todayStr(), -21), to = shift(todayStr(), 120);
    const r = await fetch(EV + "?select=id,d,team,body&d=gte." + from + "&d=lte." + to + "&order=d.asc",
      { headers: HDR, cache: "no-store" });
    const rows = await r.json();
    if (!Array.isArray(rows)) return;
    const out = [];
    for (const x of rows) {
      let v;
      try { v = await unlockText(PW, x.body); } catch (e) { continue; }
      out.push({ id: x.id, d: x.d, team: x.team, title: (v && v.title) || String(v || ""), note: (v && v.note) || "" });
    }
    evCache = out;
    drawCal2();
  } catch (e) { /* 표가 아직 없으면 조용히 넘어간다 */ }
}

function drawCal2() {
  const box = document.getElementById("cal2");
  if (!box || !DATE) return;
  const today = todayStr();
  const dow = new Date(today + "T12:00:00").getDay();
  const start = shift(today, -dow);                 // 이번 주 일요일
  const days = [];
  for (let i = 0; i < 21; i++) days.push(shift(start, i));   // 3주
  const end = days[20];

  const byDay = {};
  (evCache || []).forEach(e => { (byDay[e.d] = byDay[e.d] || []).push(e); });

  const cur = new Date(DATE + "T12:00:00");
  let html = '<div class="c2head">' +
    '<button class="iconbtn" id="prev" type="button" title="이전 날">‹</button>' +
    '<div class="dnow' + (DATE === today ? " isnow" : "") + '">' +
      (cur.getMonth() + 1) + '월 ' + cur.getDate() + '일 (' + DOW[cur.getDay()] + ')</div>' +
    '<button class="iconbtn" id="next" type="button" title="다음 날"' + (DATE >= today ? " disabled" : "") + '>›</button>' +
    '<b>앞으로 3주</b><span class="rng">' +
    esc(start.slice(5).replace("-", "월 ") + "일 ~ " + end.slice(5).replace("-", "월 ") + "일") + '</span></div>' +
    '<div class="grid14">' + DOW.map((w, i) => '<div class="dw' + (i === 0 ? " sun" : "") + '">' + w + "</div>").join("") + '</div>' +
    '<div class="grid14">';
  days.forEach(d => {
    const evs = byDay[d] || [];
    const isToday = d === today;
    const past = d < today;
    const sun = new Date(d + "T12:00:00").getDay() === 0;
    html += '<div class="cell' + (isToday ? " today" : "") + (past ? " past" : "") +
      (d > today ? " nofuture" : "") + '" data-d="' + d + '">' +
      '<div class="dd' + (sun ? " sun" : "") + '">' + Number(d.slice(8)) +
        (isToday ? '<span class="tdy">오늘</span>' : "") + '</div>' +
      evs.map(e => '<div class="ev"><span class="pt" style="background:' +
        (TONE[e.team] || "#006688") + '"></span><span class="tx">' + esc(e.title) + '</span>' +
        '<button class="evx" type="button" data-ev="' + e.id + '" title="이 일정 지우기">✕</button></div>').join("") +
      '</div>';
  });
  html += '</div>';

  const later = (evCache || []).filter(e => e.d > end).slice(0, 6);
  if (later.length) {
    html += '<div class="later"><b>그 뒤로</b>' + later.map(e =>
      '<div class="lrow">' + esc(e.d.slice(5).replace("-", "월 ") + "일") + " · " + esc(e.title) +
      '<button class="evx" type="button" data-ev="' + e.id + '" title="이 일정 지우기">✕</button></div>').join("") + '</div>';
  } else if (!(evCache || []).length) {
    html += '<div class="empty2">아직 잡힌 일정이 없습니다.</div>';
  }
  box.innerHTML = html;
  /* 과거·오늘만 이동할 수 있다 — 미래 판은 아직 없으니 눌러도 가지 않는다 */
  box.querySelectorAll(".cell").forEach(c =>
    c.addEventListener("click", () => { if (c.dataset.d <= todayStr()) go(c.dataset.d, true); }));
  document.getElementById("prev").addEventListener("click", () => go(shift(DATE, -1), true));
  const nx = document.getElementById("next");
  if (!nx.disabled) nx.addEventListener("click", () => go(shift(DATE, 1), true));

  box.querySelectorAll(".evx").forEach(b => b.addEventListener("click", async e => {
    e.stopPropagation();                      // 날짜 이동은 막고 지우기만 한다
    const id = b.dataset.ev;
    const hit = (evCache || []).find(x => String(x.id) === String(id));
    if (!confirm("이 일정을 지웁니다.\n\n" + (hit ? hit.d + " · " + hit.title : "") + "\n\n계속할까요?")) return;
    b.disabled = true;
    await fetch(EV + "?id=eq." + id, { method: "DELETE", headers: HDR });
    await loadEvents();
  }));
}

/* ───── 돈 카드 — 옛 형태(문자열 배열)와 새 형태({lines, bars}) 둘 다 그린다 ───── */
function manWon(n) {
  n = +n || 0;
  const v = Math.round(n / 1000) / 10;        // 만 단위, 소수 첫째 자리까지
  return v.toLocaleString("ko-KR") + "만";
}
function moneyCard(money) {
  let bars = [], lines = [];
  if (Array.isArray(money)) lines = money;
  else if (money && typeof money === "object") {
    bars = Array.isArray(money.bars) ? money.bars : [];
    lines = Array.isArray(money.lines) ? money.lines : [];
  }
  const barHtml = bars.map(b => {
    const now = +(b && b.now) || 0, max = +(b && b.max) || 0;
    const pct = max > 0 ? Math.max(0, Math.min(100, now / max * 100)) : 0;
    return '<div class="gauge"><div class="lab"><span>' + esc(b && b.label || "") + '</span>' +
      '<span>' + manWon(now) + ' / ' + manWon(max) + '</span></div>' +
      '<div class="track"><div class="bar" style="width:' + pct + '%"></div></div></div>';
  }).join("");
  const body = (barHtml ? '<div class="mbars">' + barHtml + '</div>' : "") +
    (lines.length ? '<div class="lines">' + lines.map(x => '<div>' + fmt(x) + '</div>').join("") + '</div>' : "");
  /* 용돈기입장 — 막대 아래에 오늘 쓴 돈 입력·목록 */
  const expHtml = '<div class="expzone" id="expzone">' +
    '<div class="ezhead">오늘 쓴 돈<b id="exptotal"></b></div>' +
    '<div id="explist"></div>' +
    '<div class="ezform">' +
    '<button type="button" id="exptype" title="지출/수입 전환 (지금: 지출)">−</button>' +
    '<button type="button" id="expcur" title="통화 전환 (₩/$)">₩</button>' +
    '<select id="exppay" title="결제수단">' +
      EXP_PAYS.map(p => '<option>' + esc(p) + '</option>').join("") + '</select>' +
    '<input id="exppayx" placeholder="어디로" style="display:none">' +
    '<input id="expamt" inputmode="numeric" placeholder="금액">' +
    '<input id="explabel" placeholder="항목 (예: 점심 (편의점))">' +
    '<button type="button" id="expadd">추가</button></div></div>';
  return '<section><div class="seclab">돈</div><div class="panel">' +
    (body || '<div class="lines"><div class="none">오늘 돈 소식은 없습니다.</div></div>') +
    expHtml + '</div></section>';
}

/* ── 용돈기입장 동작 — STATE.expenses2 배열에 담아 기존 자동저장(save)으로 잠가 올린다.
   ★note.html 유산인 STATE.expenses(팀장 페이지 지출)는 절대 건드리지 않는다 (checks/checks2와 같은 원칙)
   항목 형식: {t:"-"|"+", amt, label, at, pay:"아멕스"…, cur:"KRW"|"USD"} — pay·cur 없는 옛 줄은 원화·수단 미상 */
const EXP_PAYS = ["토스파랑이", "카뱅파랑이", "카뱅노랑이", "아멕스", "신한", "KB", "국민(사업)", "현금", "기타"];
const EXP_PAY_KEY = "kb-exp-pay", EXP_CUR_KEY = "kb-exp-cur";
function mountExpenses() {
  const zone = document.getElementById("expzone");
  if (!zone) return;                                 // 오늘판이 없으면 돈 카드 자체가 없다
  const amt = document.getElementById("expamt"), label = document.getElementById("explabel");
  const typeBtn = document.getElementById("exptype"), list = document.getElementById("explist");
  const pay = document.getElementById("exppay"), payx = document.getElementById("exppayx");
  const curBtn = document.getElementById("expcur");
  let type = "-";
  let cur = localStorage.getItem(EXP_CUR_KEY) === "USD" ? "USD" : "KRW";   // 마지막 통화 기억
  if (EXP_PAYS.indexOf(localStorage.getItem(EXP_PAY_KEY)) >= 0)            // 마지막 카드 기억
    pay.value = localStorage.getItem(EXP_PAY_KEY);
  const usdFmt = n => "$" + (+n || 0).toLocaleString("en-US",
    { minimumFractionDigits: (+n % 1 ? 2 : 0), maximumFractionDigits: 2 });
  function fmtAmt() {
    if (cur === "USD") {                             // 달러: 소수점 허용 (12.50)
      let v = amt.value.replace(/[^0-9.]/g, "");
      const i = v.indexOf(".");
      if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, "").slice(0, 2);
      amt.value = v;
    } else {                                         // 원화: 콤마 자동 표시
      const v = amt.value.replace(/[^0-9]/g, "");
      amt.value = v ? (+v).toLocaleString("ko-KR") : "";
    }
  }
  const drawCur = () => {
    curBtn.textContent = cur === "USD" ? "$" : "₩";
    amt.inputMode = cur === "USD" ? "decimal" : "numeric";
  };
  const drawPayx = () => { payx.style.display = pay.value === "기타" ? "" : "none"; };
  drawCur(); drawPayx();
  amt.addEventListener("input", fmtAmt);
  curBtn.addEventListener("click", () => {
    cur = cur === "USD" ? "KRW" : "USD";
    localStorage.setItem(EXP_CUR_KEY, cur);
    drawCur(); fmtAmt();
  });
  pay.addEventListener("change", () => { localStorage.setItem(EXP_PAY_KEY, pay.value); drawPayx(); });
  typeBtn.addEventListener("click", () => {
    type = type === "-" ? "+" : "-";
    typeBtn.textContent = type === "-" ? "−" : "＋";
    typeBtn.classList.toggle("plus", type === "+");
    typeBtn.title = "지출/수입 전환 (지금: " + (type === "-" ? "지출" : "수입") + ")";
  });
  const money = x => (x.t === "+" ? "+" : "−") +
    (x.cur === "USD" ? usdFmt(x.amt) : (+x.amt || 0).toLocaleString("ko-KR") + "원");
  function drawExp() {
    const rows = STATE.expenses2 || [];
    list.innerHTML = rows.length ? rows.map((x, i) =>
      '<div class="ezrow"><span class="ezamt ' + (x.t === "+" ? "plus" : "minus") + '">' +
      money(x) + '</span>' +
      '<span class="ezlb">' + esc(x.label || "") + '</span>' +
      (x.pay ? '<span class="ezpay">· ' + esc(x.pay) + '</span>' : '') +
      '<span class="eztm">' + esc(hhmm(new Date((+x.at || 0) * 1000))) + '</span>' +
      '<button class="ezx" data-i="' + i + '" type="button" title="이 줄 지우기">✕</button></div>').join("")
      : '<div class="eznone">오늘 적은 지출이 없습니다.</div>';
    // 합계는 통화별로 따로 — 환율을 지어내지 않는다
    const krw = rows.reduce((s, x) => s + (x.t !== "+" && x.cur !== "USD" ? (+x.amt || 0) : 0), 0);
    const usd = rows.reduce((s, x) => s + (x.t !== "+" && x.cur === "USD" ? (+x.amt || 0) : 0), 0);
    document.getElementById("exptotal").textContent = (krw || usd)
      ? "지출 " + [krw ? "−" + krw.toLocaleString("ko-KR") + "원" : null,
                   usd ? "−" + usdFmt(usd) : null].filter(Boolean).join(" · ")
      : "";
    list.querySelectorAll(".ezx").forEach(b => b.addEventListener("click", () => {
      STATE.expenses2.splice(+b.dataset.i, 1);
      drawExp(); save();
    }));
  }
  function addExp() {
    const a = cur === "USD" ? (parseFloat(amt.value.replace(/[^0-9.]/g, "")) || 0)
                            : (+(amt.value.replace(/[^0-9]/g, "")) || 0);
    const lb = label.value.trim();
    if (!a && !lb) return;
    const payName = pay.value === "기타" ? (payx.value.trim() || "기타") : pay.value;
    STATE.expenses2 = STATE.expenses2 || [];
    STATE.expenses2.push({ t: type, amt: a, label: lb, at: Math.floor(Date.now() / 1000),
      pay: payName, cur: cur });
    amt.value = ""; label.value = "";
    drawExp(); save(); amt.focus();
  }
  document.getElementById("expadd").addEventListener("click", addExp);
  [amt, label, payx].forEach(el => el.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); addExp(); }
  }));
  drawExp();
}

    ? items.map(t => {
        const fix = !!(t && t.done);            // 김비서가 실측으로 완료 확인 → 체크 고정
        const on = fix || !!checks[t.id];
        return '<li data-id="' + esc(t.id || "") + '"' +
          (on ? ' class="done' + (fix ? ' kbdone' : '') + '"' : '') + '>' +
          '<input type="checkbox"' + (on ? ' checked' : '') +
          (fix ? ' title="김비서가 실측으로 완료 확인"' : '') + '>' +
          '<div class="b"><div class="task">' + esc(t.text || "") + '</div>' +
          (sub && t.note ? '<div class="sub">' + fmt(t.note) + '</div>' : '') + '</div></li>';
      }).join("")
    : '<li class="none">오늘은 없습니다.</li>';

  const must = DAY.must || [], stretch = DAY.stretch || [];

  left += '<section><div class="seclab">무조건 여기까지 <span>· 체크 자동 저장</span></div><div class="panel">' +
    '<div class="prog"><div class="track"><div class="bar" id="pbar"></div></div><div class="n" id="pnum">0 / 0</div></div>' +
    '<ul class="todo" id="mustlist">' + todoList(must, true) + '</ul></div></section>';

  left += '<section><div class="seclab">시간 나면 여기까지</div><div class="panel">' +
    '<ul class="todo" id="strlist">' + todoList(stretch, false) + '</ul></div></section>';

  /* 김비서 카드 — 업무 현황(kimbi)과 처리한 것(reports)을 한 체크리스트로. 표시 전용 */
  const kb = DAY.kimbi || [], reps = DAY.reports || [];
  const kbRow = (filled, text, doing, strike) =>
    '<li' + (strike ? ' class="isdone"' : '') + '>' +
    '<span class="mk ' + (filled ? 'done">✓' : 'todo">') + '</span>' +
    '<span class="tx">' + fmt(text || "") + '</span>' +
    (doing ? '<span class="doing">진행중</span>' : '') + '</li>';
  right += '<section><div class="seclab">김비서 <span>· 업무 현황과 오늘 처리한 것</span></div><div class="panel"><ul class="kb">' +
    ((kb.length || reps.length)
      ? kb.map(k => kbRow(k.state === "done", k.text, k.state === "doing", k.state === "done")).join("") +
        reps.map(t => kbRow(true, t, false, false)).join("")
      : '<li><span class="tx" style="opacity:.7">등록된 일이 없습니다.</span></li>') +
    '</ul></div></section>';

  /* 전체 업무리스트 — 표시 전용(체크해도 저장 안 됨), 없거나 비면 섹션 숨김 */
  const wl = (Array.isArray(DAY.worklist) ? DAY.worklist : [])
    .filter(g => g && Array.isArray(g.items) && g.items.length);
  if (wl.length) {
    const wTotal = wl.reduce((n, g) => n + g.items.length, 0);
    const wDone = wl.reduce((n, g) => n + g.items.filter(i => i && i.done).length, 0);
    left += '<section><details class="wl" open>' +
      '<summary class="seclab">전체 업무리스트 <span>· ' + wDone + ' / ' + wTotal + ' · 눌러서 접기/펼치기</span></summary>' +
      '<div class="panel">' +
      wl.map(g =>
        '<div class="wgroup"><div class="wlg">' + esc(g.group || "") + '</div><ul class="wlist">' +
        g.items.map(i => {
          const done = !!(i && i.done);
          return '<li' + (done ? ' class="wdone"' : '') + '>' +
            '<span class="wmk' + (done ? ' on' : '') + '">' + (done ? '✓' : '') + '</span>' +
            '<div class="wb"><div class="wtx">' +
            (i && i.urgency === "긴급" ? '<span class="wurg"></span>' : '') +
            esc(i && i.text || "") + '</div>' +
            (i && i.memo ? '<div class="wmemo">' + fmt(i.memo) + '</div>' : '') +
            '</div></li>';
        }).join("") + '</ul></div>').join("") +
      '</div></details></section>';
  }

  /* 완료 카드 — 퇴근 후 김비서가 worklist에서 옮겨 담는 donelist. 표시 전용, 기본 접힘, 없으면 숨김 */
  const dl = (Array.isArray(DAY.donelist) ? DAY.donelist : [])
    .filter(i => i && plain(i.text != null ? i.text : i).trim());
  if (dl.length) {
    left += '<section><details class="wl dl">' +
      '<summary class="seclab">완료 ' + dl.length + ' <span>· 눌러서 접기/펼치기</span></summary>' +
      '<div class="panel"><ul class="wlist">' +
      dl.map(i => {
        const text = plain(i.text != null ? i.text : i);
        const memo = (i && typeof i === "object" && i.memo) ? String(i.memo) : "";
        return '<li class="wdone"><span class="wmk on">✓</span>' +
          '<div class="wb"><div class="wtx">' + esc(text) + '</div>' +
          (memo ? '<div class="wmemo">' + fmt(memo) + '</div>' : '') + '</div></li>';
      }).join("") + '</ul></div></details></section>';
  }

  right += moneyCard(DAY.money);

  c.innerHTML = top; main.innerHTML = left; side.innerHTML = right;
  drawCal2();
  mountExpenses();

  /* 체크 동작 */
  function progress() {
    const done = must.filter(t => (t && t.done) || (STATE.checks2 || {})[t.id]).length;
    const pn = document.getElementById("pnum"), pb = document.getElementById("pbar");
    if (pn) pn.textContent = done + " / " + must.length;
    if (pb) pb.style.width = must.length ? (done / must.length * 100) + "%" : "0%";
  }
  main.querySelectorAll(".todo li[data-id]").forEach(li => {
    const box = li.querySelector("input[type=checkbox]");
    if (!box) return;
    if (li.classList.contains("kbdone")) {      // done 고정 — 키보드 스페이스까지 막는다
      box.addEventListener("click", e => e.preventDefault());
      return;
    }
    box.addEventListener("change", () => {
      STATE.checks2 = STATE.checks2 || {};
      if (box.checked) STATE.checks2[li.dataset.id] = true;
      else delete STATE.checks2[li.dataset.id];
      li.classList.toggle("done", box.checked);
      progress(); save();
    });
  });
  progress();
}

   내가 보낸 줄: role="boss", status="kb"  ← 기존 팀장 시스템("pending")과 절대 겹치지 않게
   김비서 답:    role="kimbi", status="kbdone" 인 줄만 화면에 띄운다 */
let kbCache = [], kbTimer = null;
const decCache = {};

/* ── /teach·/end 토큰 판정 — 메시지 어느 위치에 있어도, 단어 경계 기준, 대소문자 무시 ──
   당번(서버)의 (?<![\w/])\/(teach|end)(?!\w) 와 같은 판정이다. 룩비하인드 대신 앞글자를
   캡처해 되돌려 넣는 방식(구형 사파리 호환): 앞글자가 글자·숫자·_·/ 가 아니어야 토큰 */
const CMD_RE = () => /(^|[^\w/])(\/(teach|end))(?!\w)/gi;
function hasCmd(text, which) {
  let m; const re = CMD_RE();
  while ((m = re.exec(String(text)))) if (m[3].toLowerCase() === which) return true;
  return false;
}
/* esc를 이미 거친 HTML 속 토큰을 그 자리에서 칩으로 — 토큰엔 특수문자가 없어 esc 후에도 원형 */
const chipify = h => String(h).replace(CMD_RE(), (all, pre, tok, name) =>
  pre + '<span class="cmdchip' + (name.toLowerCase() === "end" ? " end" : "") + '">' +
  name.toLowerCase() + '</span>');

/* ── 사진·파일 첨부 — note.html과 같은 데이터 경로: 전부 잠가서 hq_files 표에 저장 ──
   채팅 body는 문자열 대신 {file: id, name, mime, text} 로 보낸다 (당번이 이 형식을 처리) */
const FILEURL = CHAT.replace("hq_chat", "hq_files");
const fileCache = {};                                // id → {name, mime, url}
const MAXF = 8 * 1024 * 1024;                        // 비이미지 원본 한도 8MB

function b64ofBuf(buf) {
  let s = ""; const b = new Uint8Array(buf); const CH = 0x8000;
  for (let i = 0; i < b.length; i += CH) s += String.fromCharCode.apply(null, b.subarray(i, i + CH));
  return btoa(s);
}
function bufOfB64(b64) {
  const s = atob(b64); const b = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return b.buffer;
}
async function shrinkImage(file) {                   // 큰 사진은 긴 변 2000px JPEG로 줄인다
  if (!/^image\/(jpeg|png|webp)/i.test(file.type) || file.size < 400 * 1024) return file;
  try {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", .85));
    return blob && blob.size < file.size
      ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
  } catch (e) { return file; }
}
async function uploadFile(file) {
  const f = await shrinkImage(file);
  if (f.size > MAXF) throw new Error("파일이 너무 큽니다 (8MB까지): " + file.name);
  const data = b64ofBuf(await f.arrayBuffer());
  const body = await lock(PW, { name: file.name, mime: f.type || "application/octet-stream", data: data });
  const r = await fetch(FILEURL, { method: "POST",
    headers: Object.assign({}, HDR, { Prefer: "return=representation" }),
    body: JSON.stringify({ body: body }) });
  if (!r.ok) throw new Error(r.status === 404
    ? "파일 보관함이 아직 없습니다 — 회의실\\파일 표 만들기.sql을 한 번 실행해 주세요"
    : "업로드 실패 (" + r.status + ")");
  const j = await r.json();
  return { file: j[0].id, name: file.name, mime: f.type || "application/octet-stream", size: f.size };
}
async function getFile(id) {
  if (fileCache[id]) return fileCache[id];           // 복호화는 한 번만
  try {
    const r = await fetch(FILEURL + "?id=eq." + id + "&select=body", { headers: HDR, cache: "no-store" });
    const j = await r.json();
    if (!Array.isArray(j) || !j.length) return null;
    const o = await unlockText(PW, j[0].body);
    const url = URL.createObjectURL(new Blob([bufOfB64(o.data)], { type: o.mime || "application/octet-stream" }));
    return (fileCache[id] = { name: o.name, mime: o.mime, url: url });
  } catch (e) { return null; }
}
function hydrateFiles(log) {
  log.querySelectorAll("[data-fid]").forEach(elm => {
    const id = +elm.dataset.fid;
    if (elm.tagName === "IMG") {
      getFile(id).then(f => { if (f) elm.src = f.url; });
      elm.addEventListener("load", () => {           // 사진이 늦게 뜨면 바닥 근처일 때만 따라 내려간다
        if (log.scrollHeight - log.scrollTop - log.clientHeight < 340) log.scrollTop = log.scrollHeight;
      });
      elm.addEventListener("click", () => getFile(id).then(f => f && window.open(f.url)));
    } else {
      elm.addEventListener("click", () => getFile(id).then(f => {
        if (!f) return;
        const a = document.createElement("a");
        a.href = f.url; a.download = elm.dataset.name || f.name || "file";
        a.click();
      }));
    }
  });
}

DING.volume = 0.55;
let kbSoundSeen = null;
const popupAlive = () => Date.now() - (+localStorage.getItem(POPHB_KEY) || 0) < 10000;
function playDing() {
  if (localStorage.getItem(SOUND_KEY) === "0") return;
  try { DING.currentTime = 0; const p = DING.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
function notifyDing() {
  if (!CHATONLY && popupAlive()) return;             // 팝업이 떠 있으면 팝업만 울린다
  playDing();
  if (document.hidden || !document.hasFocus()) document.title = "(새 답변) 김비서";
}
window.addEventListener("focus", () => { document.title = "김비서"; });
document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = "김비서"; });

let kbActBody = null, kbActVal = null, kbActLive = false;
function drawAct() {
  const box = document.getElementById("kbact");
  const v = kbActVal;
  const live = !!(v && v.act && typeof v.at === "number" && Date.now() / 1000 - v.at < 300);
  if (live) {
    document.getElementById("kbactlabel").textContent = "김비서: " + v.act;
    box.style.display = "";
  } else box.style.display = "none";
  if (live !== kbActLive) { kbActLive = live; chatSig = ""; drawChat(); }
}

let kbTeach = false, kbModeSeen = null;
const PH_CHAT = "김비서에게 할 말";
const PH_TEACH = "수업 중 — 김비서가 배우고 있어요. 다 가르치셨으면 /end";
function drawTeach(on) {
  on = !!on;
  if (on === kbTeach) return;
  kbTeach = on;
  // .teach = 배경 틴트 + 안쪽 테두리 글로우 (뱃지는 없다 — 입력창 하이라이트·말풍선 칩이 대신한다)
  document.getElementById("chatpanel").classList.toggle("teach", on);
  document.getElementById("chatta").placeholder = on ? PH_TEACH : PH_CHAT;
}

async function kbLoad() {
  clearTimeout(kbTimer);
  if (!PW) return;
  try {
    const r = await fetch(CHAT + "?select=id,team,role,body,status,created_at&team=eq.kb&order=id.asc&limit=300",
      { headers: HDR, cache: "no-store" });
    const rows = await r.json();
    if (!Array.isArray(rows)) throw new Error("bad");
    const out = [], alive = new Set();
    let meta = null, mode = null, act = null;
    for (const row of rows) {
      if (row.role === "kimbi_meta") {          // 상태 줄 — 채팅에는 절대 안 띄운다
        if (row.status === "kbbat") meta = row; // id 오름차순이라 마지막 것이 최신
        else if (row.status === "kbmode") mode = row;
        else if (row.status === "kbact") act = row;
        continue;
      }
      const isMine = row.role === "boss";
      const isKb = row.role === "kimbi" && row.status === "kbdone";
      if (!isMine && !isKb) continue;
      alive.add(row.id);
      let text = decCache[row.id];
      if (text === undefined) {
        try { text = await unlockText(PW, row.body); } catch (e) { text = "(읽을 수 없는 메시지)"; }
        decCache[row.id] = text;
      }
      out.push({ id: row.id, role: isMine ? "boss" : "kimbi", text: text, at: row.created_at });
    }
    Object.keys(decCache).forEach(k => { if (!alive.has(+k)) delete decCache[k]; });
    // 아직 저장이 안 끝난 임시 말풍선(id 0)은 그대로 살린다
    kbCache.filter(m => m.id === 0).forEach(m => out.push(m));
    kbCache = out;
    drawChat();
    // 새 김비서 답변이면 알림음 — 첫 로드는 기준만 잡고 조용히 지나간다
    const topKb = out.reduce((n, m) => (m.role === "kimbi" && m.id > n) ? m.id : n, 0);
    if (kbSoundSeen === null) kbSoundSeen = topKb;
    else if (topKb > kbSoundSeen) { kbSoundSeen = topKb; notifyDing(); }
    if (CHATONLY) localStorage.setItem(POPHB_KEY, String(Date.now()));   // 팝업 심장박동
    if (meta && meta.id !== kbBatSeen) {
      kbBatSeen = meta.id;
      try { const v = await unlockText(PW, meta.body); drawBattery(v ? +v.battery : NaN); }
      catch (e) { /* 못 읽으면 이전 표시 유지 */ }
    }
    if (mode && mode.id !== kbModeSeen) {
      kbModeSeen = mode.id;
      try { const v = await unlockText(PW, mode.body); drawTeach(!!(v && v.teach)); }
      catch (e) { /* 못 읽으면 이전 표시 유지 */ }
    }
    if (act && act.body !== kbActBody) {        // 같은 id에 body만 덮어써지므로 body로 비교
      kbActBody = act.body;
      try { kbActVal = await unlockText(PW, act.body); }
      catch (e) { /* 못 읽으면 이전 값 유지 */ }
    }
    drawAct();                                  // 매 갱신마다 5분 경과 여부도 다시 따진다
  } catch (e) { /* 조용히 다음 차례에 재시도 */ }
  kbTimer = setTimeout(kbLoad, 4000);
}

/* 말풍선 속 내용 — 파일 첨부 메시지면 썸네일/파일 표시, 아니면 글 그대로.
   새 형식 {files:[{file,name,mime},…], text} 와 옛 단건 형식 {file,name,mime,text} 둘 다 읽는다 */
function bubbleBody(m) {
  const s = m.text;
  const base = txt => m.role === "boss" ? chipify(fmt(txt)) : fmt(txt);
  const isImg = f => /^image\//.test(f.mime || "") || /\.(png|jpe?g|gif|webp|bmp|heic)$/i.test(f.name || "");
  const one = f => isImg(f)
    ? '<img class="att-img" data-fid="' + (+f.file) + '" alt="' + esc(f.name || "") + '">'
    : '<span class="att-file" data-fid="' + (+f.file) + '" data-name="' + esc(f.name || "") +
      '">📄 ' + esc(f.name || "파일") + '</span>';
  if (s && typeof s === "object" && (s.file || Array.isArray(s.files))) {
    const list = (Array.isArray(s.files) ? s.files : [s]).filter(f => f && f.file);
    const imgs = list.filter(isImg), rest = list.filter(f => !isImg(f));
    return (s.text ? base(String(s.text)) : "") +
      (imgs.length ? '<div class="attgrid' + (imgs.length > 1 ? ' many' : '') + '">' +
        imgs.map(one).join("") + '</div>' : "") +
      rest.map(one).join("");
  }
  return base(plain(s));
}

let chatSig = "";
function drawChat() {
  const log = document.getElementById("chatlog");
  const sig = kbCache.map(m => m.id + ":" + m.role).join(",");
  if (sig === chatSig) return;
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  const waiting = !kbActLive && kbCache.length && kbCache[kbCache.length - 1].role === "boss";
  log.innerHTML = (kbCache.length
    ? kbCache.map((m, i) => {
        const t = '<span class="tm">' + esc(hhmm(m.at)) + '</span>';
        if (m.role === "boss")
          // 토큰 칩·파일 첨부 렌더링은 bubbleBody가 처리 (저장 원문은 그대로)
          return '<div class="row me">' + t + '<div class="bubble me">' + bubbleBody(m) + '</div></div>';
        const same = i > 0 && kbCache[i - 1].role === "kimbi";
        return '<div class="row"><span class="ava' + (same ? ' hide' : '') + '">김</span>' +
          '<div class="bubble kb">' + bubbleBody(m) + '</div>' + t + '</div>';
      }).join("")
    : '<div class="empty">아직 나눈 이야기가 없습니다. 편하게 말 걸어보세요.</div>')
    + (waiting ? '<div class="wait">김비서가 확인하는 중…</div>' : "");
  hydrateFiles(log);                                  // 첨부 썸네일·파일은 여기서 채워 넣는다
  if (atBottom || !chatSig) log.scrollTop = log.scrollHeight;
  chatSig = sig;
  if (chatOpen) markChatSeen(); else drawChatBadge();   // 창이 닫혀 있으면 안 읽음 뱃지만 갱신
}

async function kbSend(text) {
  // /teach·/end 토큰이 어느 위치에 있든 서버 확인 전에 미리 반영한다 (나중에 kbmode 줄이 오면 그 값이 진실)
  // text는 문자열이거나 파일 첨부 {file,name,mime,text} — 명령 판정은 글 부분만 본다
  const cmdSrc = (text && typeof text === "object") ? String(text.text || "") : String(text);
  if (hasCmd(cmdSrc, "teach")) drawTeach(true);
  else if (hasCmd(cmdSrc, "end")) drawTeach(false);
  // 말풍선을 저장을 기다리지 않고 즉시 띄운다
  kbCache.push({ id: 0, role: "boss", text: text, at: new Date().toISOString() });
  chatSig = ""; drawChat();
  const body = await lock(PW, text);
  const r = await fetch(CHAT, { method: "POST",
    headers: Object.assign({}, HDR, { Prefer: "return=representation" }),
    body: JSON.stringify({ team: "kb", role: "boss", body: body, status: "kb" }) });
  try {
    const saved = await r.json();
    const mine = kbCache.find(m => m.id === 0);
    if (mine && Array.isArray(saved) && saved.length) {
      mine.id = saved[0].id;
      decCache[mine.id] = text;
    }
  } catch (e) { /* 다음 갱신 때 맞춰진다 */ }
  kbLoad();
}

(function () {
  const ta = document.getElementById("chatta"), btn = document.getElementById("chatsend");
  const mirror = document.getElementById("tamirror");
  /* 입력값 속 /teach·/end 토큰(위치 무관, 여러 개면 각각)을 치는 순간 볼드+색으로 —
     textarea 글자를 투명하게 하고, 똑같은 칸(미러)이 위에서 전체 글자를 대신 그린다 */
  function drawMirror() {
    const v = ta.value;
    if (!CMD_RE().test(v)) {
      mirror.style.display = "none";
      mirror.innerHTML = "";
      ta.classList.remove("hascmd");
      return;
    }
    let html = "", last = 0, m;
    const re = CMD_RE();
    while ((m = re.exec(v))) {
      const at = m.index + m[1].length;          // 캡처한 앞글자는 일반 글자로 되돌린다
      html += esc(v.slice(last, at)) +
        '<span class="cmdtok' + (m[3].toLowerCase() === "end" ? " end" : "") + '">' + esc(m[2]) + '</span>';
      last = at + m[2].length;
    }
    mirror.innerHTML = html + esc(v.slice(last)) + "\u200b";   // 끝의 빈 줄도 textarea와 똑같이
    mirror.style.display = "block";
    ta.classList.add("hascmd");
    mirror.scrollTop = ta.scrollTop;
  }
  /* ── 첨부 대기열 — 여러 개를 쌓아 한 번에 전송. 칩마다 X로 개별 제거, 상한 10개 ── */
  let kbAtts = [];
  const attrow = document.getElementById("attrow"), fpick = document.getElementById("chatfpick");
  function drawAtts() {
    if (!kbAtts.length) { attrow.innerHTML = ""; return; }
    const total = kbAtts.reduce((n, a) => n + (a.size || 0), 0);
    attrow.innerHTML = kbAtts.map((a, i) =>
      '<div class="attchip">' +
      (a.preview ? '<img class="th" src="' + a.preview + '" alt="">' : '<span>📄</span>') +
      '<span class="nm">' + esc(a.name) + '</span>' +
      '<button class="rm" data-i="' + i + '" type="button" title="이 첨부 빼기">✕</button></div>').join("") +
      '<div class="attsum">' + kbAtts.length + '개 · ' + (total / 1048576).toFixed(1) + 'MB</div>';
    attrow.querySelectorAll(".rm").forEach(b =>
      b.addEventListener("click", () => { kbAtts.splice(+b.dataset.i, 1); drawAtts(); }));
  }
  async function attach(files) {
    let list = Array.prototype.slice.call(files || []);
    if (!list.length) return;
    if (kbAtts.length + list.length > 10) {
      alert("첨부는 한 번에 10개까지입니다.");
      list = list.slice(0, Math.max(0, 10 - kbAtts.length));
    }
    for (const f of list) {                         // 하나씩 올린다 (실패한 것만 건너뛴다)
      const ld = document.createElement("div");
      ld.className = "attchip"; ld.textContent = "⏳ 올리는 중… " + f.name;
      attrow.appendChild(ld);
      try {
        const meta = await uploadFile(f);
        meta.preview = /^image\//.test(f.type || "") ? URL.createObjectURL(f) : null;
        kbAtts.push(meta);
      } catch (e) { alert(e.message || e); }
    }
    drawAtts();
  }
  document.getElementById("chatclip").addEventListener("click", () => fpick.click());
  fpick.addEventListener("change", () => { if (fpick.files.length) { attach(fpick.files); fpick.value = ""; } });
  // 채팅 창 전체가 드롭 존 (팝업·오버레이 공용 — 같은 #chatwin)
  const win = document.getElementById("chatwin");
  ["dragenter", "dragover"].forEach(ev => win.addEventListener(ev, e => {
    e.preventDefault(); win.classList.add("dropping");
  }));
  win.addEventListener("dragleave", e => {
    if (!e.relatedTarget || !win.contains(e.relatedTarget)) win.classList.remove("dropping");
  });
  win.addEventListener("drop", e => {
    e.preventDefault(); win.classList.remove("dropping");
    if (e.dataTransfer && e.dataTransfer.files.length) attach(e.dataTransfer.files);
  });
  // 스크린샷 붙여넣기 (Ctrl+V)
  ta.addEventListener("paste", e => {
    const fs = e.clipboardData && e.clipboardData.files;
    if (fs && fs.length) { e.preventDefault(); attach(fs); }
  });

  async function send() {
    const v = ta.value.trim();
    if (!v && !kbAtts.length) return;                  // 사진만 단독 전송도 된다
    btn.disabled = true; ta.value = ""; drawMirror();   // 입력창이 비었으니 하이라이트도 해제
    const payload = kbAtts.length
      ? { files: kbAtts.map(a => ({ file: a.file, name: a.name, mime: a.mime })), text: v }
      : v;
    kbAtts = []; drawAtts();
    try { await kbSend(payload); } finally { btn.disabled = false; ta.focus(); }
  }
  btn.addEventListener("click", send);
  ta.addEventListener("input", drawMirror);
  ta.addEventListener("scroll", () => { if (ta.classList.contains("hascmd")) mirror.scrollTop = ta.scrollTop; });
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
})();

/* ───── 플로팅 채팅 — 기본은 진짜 새 창(팝업), 안 되면 오버레이 ─────
   채팅 로직(폴링·전송·암호)은 위 그대로고, 여기는 껍데기(창)와 뱃지만 다룬다.
   ?chat=1 로 열리면 이 페이지 자체가 "채팅만 있는 팝업 창"이 된다 (비번은 localStorage 공유) */
const CHATOPEN_KEY = "kb-chat-open", CHATSEEN_KEY = "kb-chat-seen";
const CHATONLY = new URLSearchParams(location.search).has("chat");
if (CHATONLY) document.body.classList.add("chatonly");
const narrowScreen = () => matchMedia("(max-width: 620px)").matches;
/* 좁은 화면에서만 오버레이 열림 상태를 복원한다 — 넓은 화면 기본 경로는 팝업이라 자동으로 안 띄운다 */
let chatOpen = CHATONLY || (narrowScreen() && localStorage.getItem(CHATOPEN_KEY) === "1");
function drawChatBadge() {
  let seen = localStorage.getItem(CHATSEEN_KEY);
  const kbIds = kbCache.filter(m => m.role === "kimbi").map(m => m.id);
  if (seen === null && kbIds.length) {      // 이 브라우저 첫 사용 — 지난 대화는 읽은 것으로 친다
    seen = String(Math.max.apply(null, kbIds));
    localStorage.setItem(CHATSEEN_KEY, seen);
  }
  const n = kbIds.filter(id => id > +(seen || 0)).length;
  const b = document.getElementById("chatbadge");
  if (!chatOpen && n > 0) { b.textContent = n > 99 ? "99+" : String(n); b.style.display = ""; }
  else b.style.display = "none";
}
function markChatSeen() {
  const kbIds = kbCache.filter(m => m.role === "kimbi").map(m => m.id);
  if (kbIds.length) {
    const top = Math.max.apply(null, kbIds);
    if (top > +(localStorage.getItem(CHATSEEN_KEY) || 0)) localStorage.setItem(CHATSEEN_KEY, String(top));
  }
  drawChatBadge();
}
function drawChatWin() {
  document.getElementById("chatwin").classList.toggle("open", chatOpen);
  document.getElementById("chatfab").classList.toggle("open", chatOpen && !CHATONLY);
  // 좁은 화면에서 채팅이 떠 있는 동안 뒤 페이지 스크롤 잠금 (CSS는 620px 이하에서만 적용)
  document.body.classList.toggle("chatlock", chatOpen && !CHATONLY);
  if (!CHATONLY) localStorage.setItem(CHATOPEN_KEY, chatOpen ? "1" : "0");
  if (chatOpen) {
    markChatSeen();
    const log = document.getElementById("chatlog");
    log.scrollTop = log.scrollHeight;
  } else drawChatBadge();
}
/* 아이콘 클릭 — ① 오버레이가 떠 있으면 닫기(토글) ② 넓은 화면이면 팝업 새 창(끌기·크기조절 가능)
   ③ 이미 팝업이 떠 있으면 그 창에 포커스 ④ 팝업이 차단되면·좁은 화면이면 오버레이로 */
let popRef = null;
function openChat() {
  if (chatOpen) { chatOpen = false; drawChatWin(); return; }
  if (!narrowScreen()) {
    if (popRef && !popRef.closed) { popRef.focus(); return; }
    popRef = window.open(location.pathname + "?chat=1", "kimbi_chat",
      "popup=yes,width=420,height=680,resizable=yes");
    if (popRef) return;
  }
  chatOpen = true; drawChatWin();
}
document.getElementById("chatfab").addEventListener("click", openChat);
document.getElementById("chatclose").addEventListener("click", () => {
  if (CHATONLY) { window.close(); return; }        // 팝업 창의 X — 창 자체를 닫는다
  chatOpen = false; drawChatWin();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && chatOpen && !CHATONLY) { chatOpen = false; drawChatWin(); }
});
/* 팝업 창에서 읽으면(kb-chat-seen 갱신) 메인 페이지 뱃지도 바로 꺼진다 */
window.addEventListener("storage", e => { if (e.key === CHATSEEN_KEY && !CHATONLY) drawChatBadge(); });
/* 알림음 토글 — 🔔/🔕, 끄면 localStorage에 기억(기본 켜짐) */
function drawBell() {
  document.getElementById("chatbell").textContent = localStorage.getItem(SOUND_KEY) === "0" ? "🔕" : "🔔";
}
document.getElementById("chatbell").addEventListener("click", () => {
  localStorage.setItem(SOUND_KEY, localStorage.getItem(SOUND_KEY) === "0" ? "1" : "0");
  drawBell();
});
drawBell();
drawChatWin();

/* ───── 오늘판 새로 왔나 보기 (45초마다) ───── */
let daySig = "", dayTimer = null, USERNAV = false;   // USERNAV=대표님이 직접 과거로 이동한 상태
async function watchDay() {
  clearTimeout(dayTimer);
  try {
    const today = todayStr();
    if (DATE === today) {
      const row = await fetchDay(DATE);
      const sig = row && row.payload ? row.payload.slice(0, 80) + row.payload.length : "";
      if (sig !== daySig) {
        const el = document.activeElement;
        if (!(el && /INPUT|TEXTAREA/.test(el.tagName))) { await go(DATE, USERNAV); return; }
      }
    } else if (!USERNAV) {
      const row = await fetchDay(today);
      if (row && row.payload) { await go(today, false); return; }   // 오늘판이 방금 올라왔다
    }
  } catch (e) {}
  dayTimer = setTimeout(watchDay, 45000);
}

/* ───── 날짜 이동 · 시작 ───── */
async function go(d, nav) {
  clearTimeout(dayTimer);
  USERNAV = !!nav;
  DATE = d; history.replaceState(null, "", "#" + d);
  setDot(true, "여는 중…");
  const row = await fetchDay(d);
  DAY = null;
  STATE = { checks2: {}, memo: "", offwork: false };
  if (row) {
    if (row.payload) { try { DAY = await unlockText(PW, row.payload); } catch (e) { DAY = null; } }
    if (row.state) { try { STATE = Object.assign(STATE, await unlockText(PW, row.state)); } catch (e) {} }
  }
  /* ★ note.html(옛 팀장 페이지)이 같은 날짜의 state 칸을 같이 쓴다.
     거기서는 checks가 '번호 배열'이라, 이 페이지가 같은 이름에 id→true 객체로 쓰면
     배열에 얹힌 객체 키는 JSON 저장에서 조용히 사라진다 (새로고침하면 체크가 풀리던 버그).
     그래서 이 페이지 체크는 checks2에 따로 담고, note.html의 checks 배열은 건드리지 않는다. */
  if (!STATE.checks2 || typeof STATE.checks2 !== "object" || Array.isArray(STATE.checks2)) STATE.checks2 = {};
  if (STATE.checks && typeof STATE.checks === "object" && !Array.isArray(STATE.checks)) {
    if (!Object.keys(STATE.checks2).length) STATE.checks2 = Object.assign({}, STATE.checks);
    delete STATE.checks;   // 옛 note2가 객체로 남긴 것 — note.html은 배열을 기대하므로 치운다
  }
  /* 용돈기입장은 expenses2에만 담는다 — note.html의 expenses 배열은 절대 손대지 않는다 */
  if (!Array.isArray(STATE.expenses2)) STATE.expenses2 = [];
  daySig = row && row.payload ? row.payload.slice(0, 80) + row.payload.length : "";
  render();
  mountMemo();
  drawOff();
  loadEvents();
  setDot(true, row ? "저장 준비됨" : (d === todayStr() ? "오늘판 없음" : "이 날짜 판 없음"));
  dayTimer = setTimeout(watchDay, 45000);
  window.scrollTo({ top: 0 });
}
async function loadDay() {                 // 기본: 오늘판, 없으면 가장 최근 판
  const today = todayStr();
  let d = today;
  const row = await fetchDay(today);
  if (!row || !row.payload) {
    const latest = await fetchLatest();
    if (latest) d = latest.d;
  }
  await go(d, false);
}
document.addEventListener("keydown", e => {
  if (!PW || !DATE || (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) return;
  if (e.key === "ArrowLeft") go(shift(DATE, -1), true);
  if (e.key === "ArrowRight" && DATE < todayStr()) go(shift(DATE, 1), true);
});
async function start() {
  if (CHATONLY) { kbLoad(); return; }   // 팝업 창 — 오늘판·일정·감시는 안 싣고 채팅만 가볍게
  const h = (location.hash || "").replace("#", "");
  if (/^\d{4}-\d{2}-\d{2}$/.test(h) && h <= todayStr()) await go(h, h !== todayStr());
  else await loadDay();
  kbLoad();
}
(async () => {
  const saved = localStorage.getItem(PWKEY);
  if (saved) {
    const r = await tryUnlock(saved);
    if (r.ok) {
      PW = saved;
      document.getElementById("gate").style.display = "none";
      document.getElementById("app").style.display = "";
      await start();
      return;
    }
    localStorage.removeItem(PWKEY);
  }
  document.getElementById("pw").focus();
})();
</script>
