<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입문서 관리 - 이온토플</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin-book-list.css">
</head>
<body class="booklist-body">

    <header class="booklist-topbar">
        <div class="booklist-topbar-left">
            <button class="btn-ghost" onclick="goBack()"><i class="fas fa-arrow-left"></i> 뒤로</button>
            <h1 class="booklist-title">입문서 관리</h1>
        </div>
        <div class="booklist-topbar-right">
            <button class="btn-ghost" id="trashToggle" onclick="toggleTrash()"><i class="fas fa-trash-can"></i> 휴지통 <span id="trashCount"></span></button>
            <button class="btn-grad" onclick="createBook()"><i class="fas fa-plus"></i> 새 책 만들기</button>
        </div>
    </header>

    <main class="booklist-main">
        <!-- 활성 책 목록 -->
        <section id="activeSection">
            <div class="booklist-list" id="bookList"></div>
            <div class="booklist-empty" id="bookEmpty" style="display:none;">
                <i class="fas fa-book"></i>
                <p>아직 만든 입문서가 없어요.<br>오른쪽 위 <b>새 책 만들기</b>로 시작하세요.</p>
            </div>
        </section>

        <!-- 휴지통 -->
        <section id="trashSection" style="display:none;">
            <div class="booklist-section-head">
                <h2><i class="fas fa-trash-can"></i> 휴지통</h2>
                <p>삭제한 책은 30일간 보관 후 자동으로 영구삭제돼요.</p>
            </div>
            <div class="booklist-list" id="trashList"></div>
            <div class="booklist-empty" id="trashEmpty" style="display:none;">
                <i class="fas fa-trash-can"></i>
                <p>휴지통이 비어 있어요.</p>
            </div>
        </section>

        <div class="booklist-loading" id="loading">
            <div class="booklist-spinner"></div><p>불러오는 중...</p>
        </div>
    </main>

    <!-- 공개 대상 관리 모달 -->
    <div class="aud-overlay" id="audModal">
      <div class="aud-box">
        <div class="aud-head">
          <h2><i class="fas fa-user-group"></i> 공개 대상 · <span id="audBookTitle"></span></h2>
          <button class="book-mini" onclick="closeAudience()"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="aud-modes">
          <label class="aud-mode">
            <input type="radio" name="audMode" value="all" onchange="onAudModeChange('all')">
            <span class="aud-mode-body"><b>전체공개</b><small>결제한 학생 전원에게 보여요</small></span>
          </label>
          <label class="aud-mode">
            <input type="radio" name="audMode" value="selected" onchange="onAudModeChange('selected')">
            <span class="aud-mode-body"><b>특정 학생</b><small>아래에서 지정한 학생만 봐요</small></span>
          </label>
        </div>
        <div class="aud-selected" id="audSelectedArea" style="display:none;">
          <div class="aud-search">
            <i class="fas fa-magnifying-glass"></i>
            <input id="audSearch" placeholder="학생 이름 검색 (결제 완료 학생만)" oninput="onAudSearchInput(this.value)" autocomplete="off">
          </div>
          <div class="aud-results" id="audResults"></div>
          <div class="aud-added-label">지정된 학생</div>
          <div class="aud-added" id="audAdded"></div>
        </div>
      </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/admin-book-list.js"></script>
</body>
</html>
